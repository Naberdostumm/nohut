<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bağlantı Testi</title>
<style>
  :root { --zemin:#f4f2ee; --kart:#fff; --cizgi:#e2ded6; --metin:#1f1d1a; --metin2:#6b665d;
          --arti:#2f7d55; --arti-ac:#e3f2e9; --eksi:#b3402f; --eksi-ac:#fbe8e5;
          --uyari:#9a6a05; --uyari-ac:#fdf2d9; }
  @media (prefers-color-scheme: dark) {
    :root { --zemin:#16150f; --kart:#211f19; --cizgi:#34322a; --metin:#f0ede5; --metin2:#a8a294;
            --arti:#5fbe8a; --arti-ac:#17301f; --eksi:#e8836f; --eksi-ac:#331c18;
            --uyari:#d9ac4a; --uyari-ac:#302716; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--zemin); color:var(--metin); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:22px;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif }
  .kutu { width:100%; max-width:420px; background:var(--kart); border:1px solid var(--cizgi);
    border-radius:18px; padding:26px 22px; text-align:center;
    box-shadow:0 8px 40px rgba(0,0,0,.12) }
  h1 { font-size:19px; margin:0 0 6px }
  .alt { font-size:14px; color:var(--metin2); margin:0 0 22px }
  .sonuc { border-radius:14px; padding:22px 16px; margin-bottom:18px }
  .sonuc .simge { font-size:44px; line-height:1 }
  .sonuc .baslik { font-size:19px; font-weight:700; margin-top:10px }
  .sonuc .detay { font-size:14px; margin-top:8px; line-height:1.5 }
  .bekle { background:var(--uyari-ac); color:var(--uyari) }
  .iyi { background:var(--arti-ac); color:var(--arti) }
  .kotu { background:var(--eksi-ac); color:var(--eksi) }
  table { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:4px }
  td { padding:7px 4px; border-bottom:1px solid var(--cizgi); text-align:left; color:var(--metin2) }
  td.d { text-align:right; font-weight:600; color:var(--metin); font-variant-numeric:tabular-nums }
  tr:last-child td { border-bottom:0 }
  .not { font-size:12.5px; color:var(--metin2); margin-top:18px; line-height:1.5 }
  button { margin-top:16px; width:100%; min-height:48px; border:1px solid var(--cizgi);
    border-radius:12px; background:var(--kart); color:var(--metin); font:inherit;
    font-weight:600; cursor:pointer }
</style>
</head>
<body>
<div class="kutu">
  <h1>Bağlantı Testi</h1>
  <p class="alt">Bu sayfa, bulunduğun yerden sunucuya erişilip erişilmediğini ölçer.<br>
     Hiçbir bilgi kaydedilmez.</p>

  <div class="sonuc bekle" id="sonuc">
    <div class="simge">⏳</div>
    <div class="baslik">Deneniyor…</div>
    <div class="detay">Birkaç saniye sürebilir</div>
  </div>

  <table id="ayrinti"></table>

  <button onclick="location.reload()">Tekrar dene</button>

  <p class="not">Sonucu ekran görüntüsü alıp gönderebilirsin.</p>
</div>

<script>
var ADRES = 'https://xcranaiavarxjfnmirie.supabase.co';
var ANAHTAR = 'sb_publishable_Xfja65X5wqUBp_CX0t02dQ_25p-rLEi';

function goster(sinif, simge, baslik, detay) {
  var k = document.getElementById('sonuc');
  k.className = 'sonuc ' + sinif;
  k.innerHTML = '<div class="simge">' + simge + '</div>' +
    '<div class="baslik">' + baslik + '</div>' +
    '<div class="detay">' + detay + '</div>';
}

function satir(ad, deger) {
  document.getElementById('ayrinti').insertAdjacentHTML('beforeend',
    '<tr><td>' + ad + '</td><td class="d">' + deger + '</td></tr>');
}

var basla = Date.now();
var zamanAsimi = setTimeout(function () {
  goster('kotu', '❌', 'Erişilemiyor', 'Sunucuya bağlanılamadı (zaman aşımı).');
  satir('Sonuç', 'Zaman aşımı');
}, 20000);

fetch(ADRES + '/auth/v1/settings', {
  headers: { 'apikey': ANAHTAR },
  cache: 'no-store'
}).then(function (y) {
  clearTimeout(zamanAsimi);
  var sure = Date.now() - basla;
  if (y.ok) {
    goster('iyi', '✅', 'Bağlantı var',
      'Sunucuya erişilebiliyor. Program buradan çalışabilir.');
    satir('Sonuç', 'Başarılı');
    satir('Yanıt süresi', sure + ' ms');
    satir('Durum kodu', y.status);
  } else {
    goster('kotu', '⚠️', 'Sunucu yanıt verdi ama hata',
      'Durum kodu: ' + y.status);
    satir('Sonuç', 'Hata ' + y.status);
    satir('Yanıt süresi', sure + ' ms');
  }
  satir('Tarih', new Date().toLocaleString('tr-TR'));
}).catch(function (e) {
  clearTimeout(zamanAsimi);
  goster('kotu', '❌', 'Erişilemiyor',
    'Sunucuya bağlanılamadı. Büyük ihtimalle engelli.');
  satir('Sonuç', 'Bağlanamadı');
  satir('Hata', (e && e.message ? e.message : 'bilinmiyor').slice(0, 60));
  satir('Tarih', new Date().toLocaleString('tr-TR'));
});
</script>
</body>
</html>
