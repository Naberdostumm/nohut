<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nohut">
<title>Nohut İthalat Takip</title>
<style>
/* Nohut İthalat Takip — telefon öncelikli arayüz */

:root {
  --zemin:      #f4f2ee;
  --kart:       #ffffff;
  --kart2:      #faf9f6;
  --cizgi:      #e2ded6;
  --cizgi2:     #eeebe4;
  --metin:      #1f1d1a;
  --metin2:     #6b665d;
  --metin3:     #9a948a;
  --vurgu:      #8a6d3b;
  --vurgu-ac:   #f0e7d6;
  --arti:       #2f7d55;
  --arti-ac:    #e3f2e9;
  --eksi:       #b3402f;
  --eksi-ac:    #fbe8e5;
  --uyari:      #9a6a05;
  --uyari-ac:   #fdf2d9;
  --golge:      0 1px 2px rgba(31,29,26,.06), 0 4px 12px rgba(31,29,26,.05);
  --golge-buyuk:0 8px 40px rgba(31,29,26,.18);
  --yuvarlak:   14px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="acik"]) {
    --zemin:    #16150f;
    --kart:     #211f19;
    --kart2:    #1a1913;
    --cizgi:    #34322a;
    --cizgi2:   #2a2821;
    --metin:    #f0ede5;
    --metin2:   #a8a294;
    --metin3:   #78735F;
    --vurgu:    #d4b27a;
    --vurgu-ac: #33291a;
    --arti:     #5fbe8a;
    --arti-ac:  #17301f;
    --eksi:     #e8836f;
    --eksi-ac:  #331c18;
    --uyari:    #d9ac4a;
    --uyari-ac: #302716;
    --golge:    0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    --golge-buyuk: 0 8px 40px rgba(0,0,0,.6);
  }
}

[data-tema="koyu"] {
  --zemin:#16150f; --kart:#211f19; --kart2:#1a1913; --cizgi:#34322a; --cizgi2:#2a2821;
  --metin:#f0ede5; --metin2:#a8a294; --metin3:#78735F;
  --vurgu:#d4b27a; --vurgu-ac:#33291a;
  --arti:#5fbe8a; --arti-ac:#17301f; --eksi:#e8836f; --eksi-ac:#331c18;
  --uyari:#d9ac4a; --uyari-ac:#302716;
  --golge:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  --golge-buyuk:0 8px 40px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--zemin);
  color: var(--metin);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}

.rakam, table, .tutar { font-variant-numeric: tabular-nums; }

/* ---------- başlık ---------- */
.tepe {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--zemin) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--cizgi);
  padding: 10px 16px calc(10px + env(safe-area-inset-top)) 16px;
  padding-top: max(10px, env(safe-area-inset-top));
  display: flex; align-items: center; gap: 10px;
}
.tepe h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; flex: 1; }
.tepe .geri {
  background: none; border: 0; color: var(--vurgu); font-size: 16px;
  padding: 6px 4px 6px 0; cursor: pointer; font-weight: 500;
}

/* ---------- sayfa ---------- */
.sayfa { padding: 14px 14px 20px; max-width: 900px; margin: 0 auto; }
.sayfa > * + * { margin-top: 12px; }

h2.bolum {
  font-size: 12px; font-weight: 650; text-transform: uppercase;
  letter-spacing: .07em; color: var(--metin3); margin: 22px 0 8px 2px;
}

/* ---------- kart ---------- */
.kart {
  background: var(--kart); border: 1px solid var(--cizgi);
  border-radius: var(--yuvarlak); box-shadow: var(--golge);
  overflow: hidden;
}
.kart-ic { padding: 14px 16px; }
.kart + .kart { margin-top: 12px; }

/* ---------- özet kutuları ---------- */
.kutular { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kutu {
  background: var(--kart); border: 1px solid var(--cizgi);
  border-radius: var(--yuvarlak); padding: 13px 14px; box-shadow: var(--golge);
}
.kutu .etiket { font-size: 11.5px; color: var(--metin2); font-weight: 550;
  text-transform: uppercase; letter-spacing: .04em; }
.kutu .deger { font-size: 21px; font-weight: 660; margin-top: 5px; letter-spacing: -.02em; }
.kutu .alt { font-size: 12.5px; color: var(--metin2); margin-top: 3px; }
.kutu.genis { grid-column: 1 / -1; }

/* ---------- stok şeridi ---------- */
.stok-serit { display: flex; gap: 1px; background: var(--cizgi); border-radius: var(--yuvarlak);
  overflow: hidden; border: 1px solid var(--cizgi); box-shadow: var(--golge); }
.stok-serit > div { flex: 1; background: var(--kart); padding: 11px 6px; text-align: center; min-width: 0; }
.stok-serit .s-etiket { font-size: 10.5px; color: var(--metin2); font-weight: 550;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stok-serit .s-deger { font-size: 15px; font-weight: 650; margin-top: 3px; }

/* ---------- liste ---------- */
.liste { list-style: none; margin: 0; padding: 0; }
.liste li {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-bottom: 1px solid var(--cizgi2);
  cursor: pointer; min-height: 56px;
}
.liste li:last-child { border-bottom: 0; }
.liste li:active { background: var(--kart2); }
.liste .sol { flex: 1; min-width: 0; }
.liste .ana { font-weight: 570; font-size: 15px; }
.liste .yan { font-size: 12.5px; color: var(--metin2); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.liste .sag { text-align: right; white-space: nowrap; }
.liste .sag .ana { font-weight: 620; }
.liste .ok { color: var(--metin3); font-size: 18px; margin-left: -4px; }

/* ---------- rozet ---------- */
.rozet {
  display: inline-block; font-size: 11px; font-weight: 620; padding: 2.5px 8px;
  border-radius: 100px; background: var(--vurgu-ac); color: var(--vurgu);
  letter-spacing: .01em; white-space: nowrap;
}
.rozet.arti  { background: var(--arti-ac);  color: var(--arti); }
.rozet.eksi  { background: var(--eksi-ac);  color: var(--eksi); }
.rozet.uyari { background: var(--uyari-ac); color: var(--uyari); }
.rozet.sonuk { background: var(--cizgi2); color: var(--metin2); }

/* ---------- düğmeler ---------- */
.dugme {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 46px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--cizgi);
  background: var(--kart); color: var(--metin); font-size: 15px; font-weight: 570;
  cursor: pointer; font-family: inherit; text-decoration: none;
}
.dugme:active { transform: scale(.985); }
.dugme.ana { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
[data-tema="koyu"] .dugme.ana { color: #16150f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="acik"]) .dugme.ana { color: #16150f; }
}
.dugme.tehlike { color: var(--eksi); border-color: color-mix(in srgb, var(--eksi) 35%, var(--cizgi)); }
.dugme.tam { width: 100%; }
.dugme.kucuk { min-height: 38px; padding: 0 13px; font-size: 14px; }
.dugmeler { display: flex; gap: 9px; flex-wrap: wrap; }
.dugmeler .dugme { flex: 1; min-width: 130px; }

/* ---------- alt gezinme ---------- */
.gezinme {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; background: color-mix(in srgb, var(--kart) 94%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--cizgi);
  padding-bottom: env(safe-area-inset-bottom);
}
.gezinme button {
  flex: 1; border: 0; background: none; cursor: pointer; font-family: inherit;
  padding: 8px 2px 9px; color: var(--metin3); font-size: 10.5px; font-weight: 570;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.gezinme button .simge { font-size: 19px; line-height: 1; }
.gezinme button.etkin { color: var(--vurgu); }
.gezinme .orta { flex: 0 0 62px; }
.gezinme .orta .yuvarlak-dugme {
  width: 46px; height: 46px; border-radius: 50%; background: var(--vurgu);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 300; margin-top: -14px; box-shadow: var(--golge-buyuk);
  line-height: 1;
}
[data-tema="koyu"] .gezinme .orta .yuvarlak-dugme { color: #16150f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="acik"]) .gezinme .orta .yuvarlak-dugme { color: #16150f; }
}

/* ---------- sayfa üstü panel (form / seçim) ---------- */
.perde {
  position: fixed; inset: 0; z-index: 100; background: rgba(20,18,14,.45);
  display: flex; align-items: flex-end; justify-content: center;
  animation: sol .16s ease;
}
@keyframes sol { from { opacity: 0 } to { opacity: 1 } }
.panel {
  background: var(--zemin); width: 100%; max-width: 560px;
  border-radius: 20px 20px 0 0; max-height: 92vh; display: flex; flex-direction: column;
  animation: yukari .22s cubic-bezier(.32,.72,0,1);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes yukari { from { transform: translateY(20px) } to { transform: translateY(0) } }
.panel-tepe {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border-bottom: 1px solid var(--cizgi); flex: 0 0 auto;
}
.panel-tepe h3 { margin: 0; font-size: 16.5px; font-weight: 650; flex: 1; letter-spacing: -.01em; }
.panel-tepe .kapat {
  background: var(--cizgi2); border: 0; width: 30px; height: 30px; border-radius: 50%;
  color: var(--metin2); font-size: 17px; cursor: pointer; line-height: 1;
}
.panel-govde { overflow-y: auto; padding: 16px; flex: 1; -webkit-overflow-scrolling: touch; }
.panel-alt {
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--cizgi); display: flex; gap: 9px; flex: 0 0 auto;
  background: var(--kart);
}
.panel-alt .dugme { flex: 1; }

@media (min-width: 620px) {
  .perde { align-items: center; }
  .panel { border-radius: 18px; max-height: 86vh; }
}

/* ---------- form ---------- */
.alan { margin-bottom: 15px; }
.alan > label {
  display: block; font-size: 13px; font-weight: 570; color: var(--metin2); margin-bottom: 6px;
}
.alan input, .alan select, .alan textarea {
  width: 100%; padding: 12px 13px; border: 1px solid var(--cizgi); border-radius: 11px;
  background: var(--kart); color: var(--metin); font-size: 16px; font-family: inherit;
  min-height: 46px;
}
.alan textarea { min-height: 74px; resize: vertical; }
.alan input:focus, .alan select:focus, .alan textarea:focus {
  outline: none; border-color: var(--vurgu);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--vurgu) 18%, transparent);
}
.alan .ipucu { font-size: 12.5px; color: var(--metin3); margin-top: 5px; }
.alan .ipucu.vurgulu { color: var(--vurgu); font-weight: 550; }
.alan .ipucu.hata { color: var(--eksi); font-weight: 550; }
.ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.alan-grubu { background: var(--kart); border: 1px solid var(--cizgi); border-radius: var(--yuvarlak);
  padding: 14px 14px 1px; margin-bottom: 15px; }
.onek { position: relative; }
.onek input { padding-right: 46px; }
.onek .birim {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 13px; color: var(--metin3); font-weight: 560; pointer-events: none;
}
.secim-satir { display: flex; gap: 8px; flex-wrap: wrap; }
.secim-satir label {
  flex: 1; min-width: 92px; display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 11px 8px; border: 1px solid var(--cizgi); border-radius: 11px;
  background: var(--kart); cursor: pointer; font-size: 14px; font-weight: 550;
}
/* Gizli ama klavyeyle erişilebilir: display:none olsaydı Tab atlardı */
.secim-satir input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.secim-satir label:focus-within {
  border-color: var(--vurgu);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--vurgu) 25%, transparent);
}
.secim-satir input:checked + span { color: var(--vurgu); }
.secim-satir label:has(input:checked) {
  border-color: var(--vurgu); background: var(--vurgu-ac);
}
.onay-satir { display: flex; align-items: center; gap: 10px; padding: 11px 0; }
.onay-satir input { width: 21px; height: 21px; accent-color: var(--vurgu); }
.onay-satir label { font-size: 15px; font-weight: 540; }

/* ---------- maliyet kartı ---------- */
.maliyet { font-variant-numeric: tabular-nums; }
.maliyet .satir {
  display: flex; align-items: baseline; gap: 10px; padding: 8px 0;
  border-bottom: 1px dashed var(--cizgi2);
}
.maliyet .satir:last-child { border-bottom: 0; }
.maliyet .ad { flex: 1; min-width: 0; }
.maliyet .ad small { display: block; color: var(--metin3); font-size: 12px; font-weight: 400; }
.maliyet .tutar { font-weight: 570; white-space: nowrap; }
.maliyet .usd { color: var(--metin3); font-size: 12.5px; width: 78px; text-align: right;
  white-space: nowrap; }
.maliyet .ayrac { border-top: 1.5px solid var(--metin3); margin: 4px 0; opacity: .45; }
.maliyet .toplam { font-weight: 650; }
.maliyet .mahsup .tutar, .maliyet .mahsup .ad { color: var(--arti); }
.maliyet .net { font-weight: 700; font-size: 16px; padding-top: 10px; }

/* Dar telefonlarda Tümen rakamları geniş — satırı sıkıştırmak yerine küçült */
@media (max-width: 400px) {
  .maliyet { font-size: 13.5px; }
  .maliyet .satir { gap: 7px; }
  .maliyet .usd { width: 60px; font-size: 11.5px; }
  .maliyet .ad small { font-size: 11px; }
  .maliyet .net { font-size: 15px; }
  .kart-ic { padding: 13px 13px; }
}

.sonuc-kutu {
  background: var(--vurgu-ac); border: 1px solid color-mix(in srgb, var(--vurgu) 30%, transparent);
  border-radius: var(--yuvarlak); padding: 15px 16px; margin-top: 14px;
}
.sonuc-kutu .baslik { font-size: 11.5px; font-weight: 650; color: var(--vurgu);
  text-transform: uppercase; letter-spacing: .06em; }
.sonuc-kutu .buyuk { font-size: 28px; font-weight: 700; margin-top: 6px; letter-spacing: -.025em;
  color: var(--metin); }
.sonuc-kutu .yan { font-size: 14px; color: var(--metin2); margin-top: 3px; font-weight: 550; }
.sonuc-kutu .not { font-size: 12px; color: var(--metin3); margin-top: 9px; }

/* ---------- randıman çubuğu ---------- */
.randiman-cubuk { display: flex; height: 30px; border-radius: 9px; overflow: hidden;
  border: 1px solid var(--cizgi); margin: 4px 0 9px; }
.randiman-cubuk > div { display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 650; color: #fff; min-width: 0; overflow: hidden; }
.randiman-cubuk .r-ust  { background: #2f7d55; }
.randiman-cubuk .r-alt  { background: #b78a3c; }
.randiman-cubuk .r-fire { background: #9a948a; }
.randiman-aciklama { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--metin2); }
.randiman-aciklama i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; }

/* ---------- tablo ---------- */
.tablo-sar { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 10px 11px; text-align: right; white-space: nowrap;
  border-bottom: 1px solid var(--cizgi2); }
th { font-size: 11.5px; font-weight: 620; color: var(--metin2); text-transform: uppercase;
  letter-spacing: .04em; background: var(--kart2); position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0;
  background: var(--kart); }
th:first-child { background: var(--kart2); z-index: 2; }
tbody tr:active td { background: var(--kart2); }
tbody tr.tiklanabilir { cursor: pointer; }
td.pozitif { color: var(--arti); font-weight: 570; }
td.negatif { color: var(--eksi); font-weight: 570; }

/* ---------- uyarı şeridi ---------- */
.uyari-serit {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--uyari-ac); border: 1px solid color-mix(in srgb, var(--uyari) 30%, transparent);
  color: var(--metin); border-radius: var(--yuvarlak); padding: 12px 14px; font-size: 13.5px;
}
.uyari-serit.kotu { background: var(--eksi-ac);
  border-color: color-mix(in srgb, var(--eksi) 30%, transparent); }
.uyari-serit .simge { font-size: 16px; line-height: 1.2; }
.uyari-serit b { display: block; margin-bottom: 2px; }

/* ---------- boş durum ---------- */
.bos-durum { text-align: center; padding: 46px 22px; color: var(--metin2); }
.bos-durum .simge { font-size: 40px; opacity: .5; }
.bos-durum p { margin: 12px 0 18px; font-size: 14.5px; line-height: 1.6; }

/* ---------- bildirim ---------- */
.bildirim {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 200;
  background: var(--metin); color: var(--zemin); padding: 11px 18px; border-radius: 100px;
  font-size: 14px; font-weight: 560; box-shadow: var(--golge-buyuk);
  animation: sol .18s ease; max-width: 90vw; text-align: center;
}

/* ---------- seçim ızgarası (yeni kayıt) ---------- */
.secim-izgara { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.secim-izgara button {
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  padding: 15px 14px; border: 1px solid var(--cizgi); border-radius: var(--yuvarlak);
  background: var(--kart); cursor: pointer; font-family: inherit; text-align: left;
  color: var(--metin); min-height: 92px;
}
.secim-izgara button:active { background: var(--kart2); }
.secim-izgara .simge { font-size: 22px; line-height: 1; }
.secim-izgara .ad { font-size: 14.5px; font-weight: 610; }
.secim-izgara .aciklama { font-size: 12px; color: var(--metin2); line-height: 1.35; font-weight: 400; }

/* ---------- yardımcılar ---------- */
.sag { text-align: right; }
.orta { text-align: center; }
.sonuk { color: var(--metin2); }
.kucuk-yazi { font-size: 12.5px; color: var(--metin2); line-height: 1.55; }
.bosluk { height: 10px; }
.satir-arasi { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pozitif { color: var(--arti); }
.negatif { color: var(--eksi); }

/* ---------- çoklu tüccar alım satırları ---------- */
.alim-satir {
  background: var(--kart); border: 1px solid var(--cizgi); border-radius: var(--yuvarlak);
  padding: 12px 13px; margin-bottom: 10px;
}
.alim-satir.borclu { border-color: color-mix(in srgb, var(--eksi) 40%, var(--cizgi)); }
.alim-tepe { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.alim-no {
  flex: 0 0 22px; height: 22px; border-radius: 50%; background: var(--vurgu-ac);
  color: var(--vurgu); font-size: 11.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.alim-tepe input {
  flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--cizgi);
  border-radius: 10px; background: var(--kart2); color: var(--metin);
  font-size: 16px; font-family: inherit; min-height: 44px; font-weight: 550;
}
.alim-tepe input:focus {
  outline: none; border-color: var(--vurgu);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--vurgu) 18%, transparent);
}
.alim-sil {
  flex: 0 0 32px; height: 32px; border: 0; border-radius: 50%; background: var(--cizgi2);
  color: var(--metin2); font-size: 14px; cursor: pointer; line-height: 1;
}
.alim-satir .ikili { gap: 9px; }
.alim-satir .onek input {
  width: 100%; padding: 10px 40px 10px 12px; border: 1px solid var(--cizgi);
  border-radius: 10px; background: var(--kart2); color: var(--metin);
  font-size: 16px; font-family: inherit; min-height: 44px;
}
.alim-satir .onek input:focus {

<div class="tepe">
  <button class="geri" id="geriDugme" type="button" style="display:none">‹ Geri</button>

  <button type="button" data-sekme="ozet"><span class="simge">🏠</span>Özet</button>
  <button type="button" data-sekme="partiler"><span class="simge">📦</span>Partiler</button>

    <span class="yuvarlak-dugme">+</span>
  </button>

  <button type="button" data-sekme="rapor"><span class="simge">📊</span>Rapor</button>
</nav>
<script>
/* ============================================================
   sifre.js — Kilit ayarı

   Buradaki değer şifrenin kendisi DEĞİL, SHA-256 özetidir.
   ./sifre-belirle.sh ile üretildi; şifre hiçbir yerde düz metin
   olarak durmaz. Değiştirmek için betiği tekrar çalıştır.

   Boşsa kilit yoktur.
   ============================================================ */
window.NOHUT_SIFRE_OZETI = 'cb8767df6e31c9f1d0ec6b3380419fe035519c821a4589b264eac6f764113ae5';
window.NOHUT_TUZ = 'nohut-ithalat-takip-v1';
/* ============================================================
   kilit.js — Basit erişim kilidi

   Program tarayıcıda çalıştığı için bu kilit askeri düzeyde
   değildir: teknik biri dosyayı indirip inceleyebilir. Amacı
   adresi tesadüfen bulanları ve meraklı gözleri engellemektir.
   Verilerin zaten sunucuda durmaz — karşı taraf boş bir program
   görür.

   Yerel dosyadan (file://) açıldığında kilit sorulmaz: cihaza
   erişebilen zaten dosyaya da erişebilir.
   ============================================================ */
(function () {
  'use strict';

  var ANAHTAR = 'nohut_kilit';
  var SURE = 30 * 24 * 60 * 60 * 1000;   // 30 gün

  function ozetle(metin) {
    var veri = new TextEncoder().encode(window.NOHUT_TUZ + '|' + metin);
    return crypto.subtle.digest('SHA-256', veri).then(function (tampon) {
      return Array.prototype.map.call(new Uint8Array(tampon), function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }

  function acikMi() {
    try {
      var d = Number(localStorage.getItem(ANAHTAR));
      return d && (Date.now() - d) < SURE;
    } catch (e) { return false; }
  }

  window.Kilit = {
    gerekli: function () {
      if (!window.NOHUT_SIFRE_OZETI) return false;          // kilit kurulmamış
      if (!/^https?:/.test(location.protocol)) return false; // yerel dosya
      if (!(window.crypto && crypto.subtle)) return false;   // özet alınamıyor
      return !acikMi();
    },

    sor: function (basarili) {
      var perde = document.createElement('div');
      perde.className = 'kilit-perde';
      perde.innerHTML =
        '<form class="kilit-kutu" autocomplete="on">' +
          '<div class="kilit-simge">🔒</div>' +
          '<h1>Nohut İthalat Takip</h1>' +
          '<p>Devam etmek için şifreyi gir.</p>' +
          '<input type="password" id="kilitSifre" placeholder="Şifre" ' +
            'autocomplete="current-password" autofocus>' +
          '<div class="kilit-hata" id="kilitHata"></div>' +
          '<button type="submit" class="dugme ana tam">Aç</button>' +
        '</form>';
      document.body.appendChild(perde);
      var giris = perde.querySelector('#kilitSifre');
      giris.focus();

      perde.querySelector('form').addEventListener('submit', function (e) {
        e.preventDefault();
        var hataAlani = perde.querySelector('#kilitHata');
        hataAlani.textContent = '';
        ozetle(giris.value).then(function (o) {
          if (o === window.NOHUT_SIFRE_OZETI) {
            try { localStorage.setItem(ANAHTAR, String(Date.now())); } catch (err) { }
            perde.remove();
            basarili();
          } else {
            hataAlani.textContent = 'Şifre yanlış.';
            giris.value = '';
            giris.focus();
          }
        }).catch(function () {
          hataAlani.textContent = 'Kontrol edilemedi. Sayfayı yenile.';
        });
      });
    },

    kilitle: function () {
      try { localStorage.removeItem(ANAHTAR); } catch (e) { }
      location.reload();
    }
  };
})();
/* ============================================================
   hesap.js — Nohut İthalat Takip: hesap motoru
   Saf fonksiyonlar. Arayüzden bağımsız, ayrıca test edilebilir.

   Temel kural:
     8mm+ maliyeti = (alım + masraflar − 8mm altı geliri) / 8mm üstü kg
   ============================================================ */
(function (kok) {
  'use strict';

  var Hesap = {};

  /* ---------- yardımcılar ---------- */

  function S(n) { n = Number(n); return isFinite(n) ? n : 0; }
  Hesap.S = S;

  // Tarihe göre sırala; aynı tarihte ekleme sırası korunur (kararlı sıralama)
  function tariheGore(kayitlar) {
    return kayitlar
      .map(function (k, i) { return { k: k, i: i }; })
      .sort(function (a, b) {
        var t1 = a.k.tarih || '', t2 = b.k.tarih || '';
        if (t1 < t2) return -1;
        if (t1 > t2) return 1;
        return a.i - b.i;
      })
      .map(function (x) { return x.k; });
  }
  Hesap.tariheGore = tariheGore;

  function dizi(v) { return Array.isArray(v) ? v : []; }

  /* ============================================================
     PARTİ NORMALİZASYONU

     Bir parti artık tek bir alım değil, ALIM SATIRLARI listesidir:
     aynı gün 10 ayrı tüccardan alınan mallar tek partide toplanır
     (depoda karışıp birlikte elendikleri için maliyet birimi budur).

     Bu fonksiyon partiyi okunabilir hale getirir: satır toplamlarını,
     ağırlıklı ortalama birim fiyatı, ödenen/borç tutarını hesaplar.
     Eski tek satırlı kayıtları da otomatik yeni biçime çevirir.
     ============================================================ */

  Hesap.satirBorc = function (a) {
    var tutar = S(a.tutar);
    if (a.odemeDurumu === 'Borç') return tutar;
    if (a.odemeDurumu === 'Kısmi') return Math.max(0, tutar - S(a.odenen));
    return 0;                       // 'Ödendi' (varsayılan)
  };

  Hesap.normalizeParti = function (p) {
    var alimlar = dizi(p.alimlar);
    if (!alimlar.length) {
      // eski biçim: parti alanlarının kendisi tek bir alım satırıydı
      alimlar = [{
        id: (p.id || '') + '-a1',
        satici: p.satici || '',
        kg: S(p.hamKg),
        birimFiyat: S(p.birimFiyat),
        tutar: S(p.tutar),
        odemeDurumu: p.odemeDurumu || 'Ödendi',
        odenen: p.odemeDurumu === 'Kısmi' ? 0 : S(p.tutar)
      }];
    }

    var kg = 0, tutar = 0, borc = 0;
    var saticilar = [];
    alimlar.forEach(function (a) {
      kg += S(a.kg);
      tutar += S(a.tutar);
      borc += Hesap.satirBorc(a);
      var ad = (a.satici || '').trim();
      if (ad && saticilar.indexOf(ad) === -1) saticilar.push(ad);
    });

    var durum = borc <= 0 ? 'Ödendi' : (borc >= tutar - 0.5 ? 'Borç' : 'Kısmi');
    var ozet = saticilar.length === 0 ? ''
             : saticilar.length === 1 ? saticilar[0]
             : saticilar.length + ' tüccar';

    var y = Object.assign({}, p);
    y.alimlar = alimlar;
    y.hamKg = kg;
    y.tutar = tutar;
    y.odenen = tutar - borc;
    y.borc = borc;
    y.birimFiyat = kg > 0 ? tutar / kg : 0;   // ağırlıklı ortalama
    y.saticilar = saticilar;
    y.saticiSayisi = saticilar.length;
    y.satici = ozet;                          // ekranlarda gösterilen özet
    y.odemeDurumu = durum;
    return y;
  };

  Hesap.partiListesi = function (veri) {
    return dizi(veri.partiler).map(Hesap.normalizeParti);
  };

  /* ============================================================
     KASA — hareketli ağırlıklı ortalama kur

     Mantık: kasada duran Tümen'in bir "USD karşılığı" vardır.
       - Dolar bozdurulunca:  bakiye += gelen Tümen
                              usdKarsilik += gönderilen USD
       - Tümen harcanınca:    bakiye -= tutar
                              usdKarsilik -= tutar / ortKur
                              (harcamanın USD maliyeti = tutar / ortKur)
       - 8mm altı satışı:     Tümen geri girer, ortalama kur DEĞİŞMEZ
                              (bu gelirin faydası parti maliyet kartında
                               mahsup olarak zaten sayılıyor; kura da
                               yansıtılsa çifte sayım olurdu)

     ortKur = bakiye / usdKarsilik   (1 USD kaç Tümen)
     ============================================================ */

  Hesap.kasa = function (veri) {
    var olaylar = [];

    dizi(veri.transferler).forEach(function (t) {
      olaylar.push({ tur: 'transfer', tarih: t.tarih, kayit: t });
    });
    Hesap.partiListesi(veri).forEach(function (p) {
      olaylar.push({ tur: 'parti', tarih: p.tarih, kayit: p });
    });
    dizi(veri.masraflar).forEach(function (m) {
      olaylar.push({ tur: 'masraf', tarih: m.tarih, kayit: m });
    });
    dizi(veri.elemeler).forEach(function (e) {
      if (S(e.ucret) > 0) olaylar.push({ tur: 'eleme', tarih: e.tarih, kayit: e });
    });
    dizi(veri.altSatislar).forEach(function (a) {
      olaylar.push({ tur: 'altSatis', tarih: a.tarih, kayit: a });
    });

    olaylar = tariheGore(olaylar);

    var bakiye = 0;        // Tümen
    var usdKarsilik = 0;   // bu bakiyenin USD karşılığı
    var girenUsd = 0, girenTumen = 0;
    var defter = [];
    var usdDegeri = {};    // "tur:id" -> USD tutarı
    var sonKur = S((veri.ayarlar || {}).varsayilanKur); // kasa boşalırsa geri düşülecek kur
    var kursuzHarcama = false;

    // Kasa sıfırlanınca (ya da eksiye düşünce) bakiye/usdKarşılık oranı
    // anlamını yitirir; son bilinen geçerli kura geri düşeriz. Yoksa
    // ayarlardaki varsayılan kur, o da yoksa 0 (arayüz uyarır).
    function ortKur() {
      if (usdKarsilik > 0 && bakiye > 0) {
        sonKur = bakiye / usdKarsilik;
        return sonKur;
      }
      return sonKur;
    }

    function cikis(tumen) {
      var kur = ortKur();
      if (!(kur > 0)) kursuzHarcama = true;
      var usd = kur > 0 ? tumen / kur : 0;
      bakiye -= tumen;
      usdKarsilik -= usd;
      return { usd: usd, kur: kur };
    }

    olaylar.forEach(function (o) {
      var k = o.kayit, satir = null;

      if (o.tur === 'transfer') {
        var gelen = S(k.tumen);
        var gonderilen = S(k.usd);
        bakiye += gelen;
        usdKarsilik += gonderilen;
        girenUsd += gonderilen;
        girenTumen += gelen;
        satir = {
          tarih: k.tarih, tur: 'Döviz transferi',
          aciklama: (k.not || '') || (gonderilen.toLocaleString('tr-TR') + ' USD bozduruldu'),
          giren: gelen, cikan: 0, usd: gonderilen,
          kur: gonderilen > 0 ? gelen / gonderilen : 0
        };

      } else if (o.tur === 'parti') {
        // Maliyet TAM tutardır; kasadan çıkan ise sadece fiilen ÖDENEN
        // kısımdır. Borçlu kaldığın para hâlâ cebinde — kasa bunu bilir.
        var tutar = S(k.tutar);

      } else if (o.tur === 'masraf') {

        '<span><i style="background:#2f7d55"></i>8mm üstü ' + kgTam(o.ustKg) + '</span>' +
        '<span><i style="background:#b78a3c"></i>8mm altı ' + kgTam(o.altKg) + '</span>' +
        '<span><i style="background:#9a948a"></i>fire ' + kgTam(o.fireKg) + '</span>' +
      '</div>';
  }

  function uyariSeridi(veri, kasa) {
    var u = [];
    if (kasa.kursuzHarcama) {
      u.push({ kotu: true, b: 'Kur bilgisi eksik',
        m: 'Bazı harcamalar, kasaya hiç döviz girmeden yapılmış görünüyor. USD karşılıkları hesaplanamadı. ' +
           '<b data-form="transfer" style="color:var(--vurgu);cursor:pointer">Döviz transferi ekle →</b>' });
    }
    if (kasa.bakiye < 0) {
      u.push({ kotu: true, b: 'Kasa eksiye düşmüş',
        m: 'Kasa bakiyesi ' + Tk(kasa.bakiye) + '. Muhtemelen kaydedilmemiş bir döviz transferi var.' });
    }
    var giderEksik = H.tumPartiler(veri).filter(function (o) {
      return o.giderDurumu && o.giderDurumu.eksikler.length;
    });
    if (giderEksik.length) {
      u.push({ kotu: true, b: giderEksik.length + ' partide zorunlu gider eksik',
        m: 'Nakliye, hammaliye, çuval gibi giderler girilmemiş — bu partilerin maliyeti ' +
           'olduğundan düşük görünüyor. ' +
           '<b data-git="partiler" style="color:var(--vurgu);cursor:pointer">Partilere bak →</b>' });
    }
    var sorunlu = (veri.elemeler || []).filter(function (e) {
      if (e.tamamlandi === false) return false;
      return H.elemeDenetim(e.girenKg, e.ustKg, e.altKg, e.fireKg).uyari;
    });
    if (sorunlu.length) {
      u.push({ b: sorunlu.length + ' eleme kaydında rakamlar tutmuyor',
        m: 'Giren kilo ile çıkan kiloların toplamı eşit değil. ' +
           '<b data-git="elemeler" style="color:var(--vurgu);cursor:pointer">Kayıtlara bak →</b>' });
    }
    if (!u.length) return '';
    return u.map(function (x) {
      return '<div class="uyari-serit' + (x.kotu ? ' kotu' : '') + '">' +
        '<span class="simge">' + (x.kotu ? '⚠️' : '❕') + '</span>' +
        '<div><b>' + x.b + '</b>' + x.m + '</div></div>';
    }).join('');
  }

  /* ============================================================
     ÖZET
     ============================================================ */
  function ekranOzet(veri) {
    var kasa = H.kasa(veri);
    var stok = H.stok(veri);
    var partiler = stok.partiler;
    var h = '<div class="sayfa">';

    h += uyariSeridi(veri, kasa);

    /* --- kasa --- */
    h += '<div class="kutular">' +
      kutu('Kasa (Tümen)', Tk(kasa.bakiye),
           kasa.bakiye > 0 ? '≈ ' + Uk(kasa.usdKarsilik) : 'boş') +
      kutu('Ortalama kur', kasa.ortKur ? n0(kasa.ortKur) : '—',
           kasa.ortKur ? 'Tümen / 1 USD' : 'henüz transfer yok') +
      (function () {
        var borc = H.toplamBorc(veri);
        return borc > 0
          ? '<div class="kutu genis" data-git="tuccarlar" style="cursor:pointer;' +
            'border-color:color-mix(in srgb,var(--eksi) 35%,var(--cizgi))">' +
            '<div class="etiket">Tüccarlara borç</div>' +
            '<div class="deger negatif">' + Tk(borc) + '</div>' +
            '<div class="alt">kime ne kadar → </div></div>'
          : '';
      })() +
      '</div>';

    /* --- stok şeridi --- */
    h += '<h2 class="bolum">Mal nerede</h2>';
    h += '<div class="stok-serit detay">' +
      [['Ham', stok.ham], ['Elemede', stok.elemede], ['8mm+', stok.ust],
       ['8mm−', stok.alt], ['Yüklendi', stok.yuklenen]].map(function (x) {
        return '<div><div class="s-etiket">' + x[0] + '</div>' +
               '<div class="s-deger"' + (x[1] > 0.5 ? '' : ' style="color:var(--metin3)"') + '>' +
               kgSerit(x[1]) + '</div></div>';
      }).join('') + '</div>';

    /* --- ortalama maliyet --- */
    var elenmisler = partiler.filter(function (p) { return p.ustKg > 0; });
    if (elenmisler.length) {
      var toplamUst = 0, toplamNetU = 0;
      elenmisler.forEach(function (p) { toplamUst += p.ustKg; toplamNetU += p.netUsd; });
      var ortUsdTon = toplamUst > 0 ? toplamNetU / toplamUst * 1000 : 0;
      var enUcuz = elenmisler.slice().sort(function (a, b) { return a.usdTon - b.usdTon; })[0];
      h += '<h2 class="bolum">Maliyet</h2>';
      h += '<div class="kutular">' +
        kutu('Ortalama 8mm+ maliyeti', U(ortUsdTon), 'USD / ton — ' + elenmisler.length + ' parti') +
        kutu('En ucuz parti', U(enUcuz.usdTon),
             kacir(enUcuz.parti.kod) + (enUcuz.parti.satici ? ' · ' + kacir(enUcuz.parti.satici) : '')) +
        '</div>';
    }

    /* --- son partiler --- */
    h += '<h2 class="bolum">Son partiler</h2>';
    if (!partiler.length) {
      h += bosDurum('📦',
        'Henüz parti yok.<br>İlk alımını kaydederek başla — programın geri kalanı buradan işler.',
        '<button class="dugme ana" data-form="parti">İlk alımı kaydet</button>');
    } else {
      var son = partiler.slice().sort(function (a, b) {
        return (b.parti.tarih || '').localeCompare(a.parti.tarih || '');
      }).slice(0, 6);
      h += '<div class="kart"><ul class="liste">' + son.map(partiSatiri).join('') + '</ul></div>';
      if (partiler.length > 6) {
        h += '<div class="bosluk"></div><button class="dugme tam" data-git="partiler">' +
             'Tüm partiler (' + partiler.length + ')</button>';
      }
    }
    return h + '</div>';
  }

  function partiSatiri(o) {
    var p = o.parti;
    var durum, sinif;
    if (o.elenmemisKg > 0.5) { durum = 'Elenmedi'; sinif = 'sonuk'; }
    else if (o.elemedeKg > 0.5) { durum = 'Elemede'; sinif = 'uyari'; }
    else if (o.ustStokKg > 0.5) { durum = 'Depoda'; sinif = 'arti'; }
    else if (o.yuklenenKg > 0.5) { durum = 'Yüklendi'; sinif = ''; }
    else { durum = '—'; sinif = 'sonuk'; }

    var eksikGider = o.giderDurumu ? o.giderDurumu.eksikler.length : 0;
    return '<li data-git="parti" data-param="' + p.id + '">' +
      '<div class="sol">' +
        '<div class="ana">' + kacir(p.kod) +
          ' <span class="rozet ' + sinif + '">' + durum + '</span>' +
          (eksikGider ? ' <span class="rozet eksi">' + eksikGider + ' gider eksik</span>' : '') +
          '</div>' +
        '<div class="yan">' + tarihGoster(p.tarih) +
          (p.satici ? ' · ' + kacir(p.satici) : '') +
          (p.bolge ? ' · ' + kacir(p.bolge) : '') +
          ' · ' + KG(o.hamKg) + '</div>' +
      '</div>' +
      '<div class="sag">' +
        (o.ustKg > 0
          ? '<div class="ana">' + U(o.usdTon) + '</div><div class="yan">USD/ton · rand. ' + yuzde(o.randiman, 0) + '</div>'
          : '<div class="ana sonuk">' + Tk(o.giderTumen) + '</div><div class="yan">eleme bekliyor</div>') +
      '</div>' +
      '<span class="ok">›</span></li>';
  }

  /* ============================================================
     PARTİLER
     ============================================================ */
  function ekranPartiler(veri) {
    var partiler = H.tumPartiler(veri);
    var h = '<div class="sayfa">';
    if (!partiler.length) {
      h += bosDurum('📦', 'Henüz parti yok.',
        '<button class="dugme ana" data-form="parti">İlk alımı kaydet</button>');
      return h + '</div>';
    }
    partiler.sort(function (a, b) { return (b.parti.tarih || '').localeCompare(a.parti.tarih || ''); });

    var toplamHam = 0, toplamUst = 0, toplamNetU = 0;
    partiler.forEach(function (p) { toplamHam += p.hamKg; toplamUst += p.ustKg; toplamNetU += p.netUsd; });

    h += '<div class="kutular">' +
      kutu('Toplam alım', KG(toplamHam), partiler.length + ' parti') +
      kutu('Elenmiş 8mm+', KG(toplamUst),
           toplamUst > 0 ? 'ort. ' + U(toplamNetU / toplamUst * 1000) + '/ton' : '—') +
      '</div>';
    h += '<div class="bosluk"></div>';
    h += '<div class="kart"><ul class="liste">' + partiler.map(partiSatiri).join('') + '</ul></div>';
    h += '<div class="bosluk"></div>' +
         '<button class="dugme tam" data-git="karsilastirma">📊 Partileri karşılaştır</button>';
    return h + '</div>';
  }

  /* ============================================================
     PARTİ MALİYET KARTI — programın en önemli ekranı
     ============================================================ */
  function ekranParti(veri, partiId) {
    var o = H.parti(veri, partiId);
    if (!o) return '<div class="sayfa">' + bosDurum('🔍', 'Parti bulunamadı.') + '</div>';
    var p = o.parti;
    var h = '<div class="sayfa">';

    /* başlık kartı */
    h += '<div class="kart"><div class="kart-ic">' +
      '<div class="satir-arasi">' +
        '<div><div style="font-size:20px;font-weight:680;letter-spacing:-.02em">' + kacir(p.kod) + '</div>' +
        '<div class="kucuk-yazi" style="margin-top:3px">' +
          (p.satici ? kacir(p.satici) : 'satıcı belirtilmemiş') +
          (p.bolge ? ' · ' + kacir(p.bolge) : '') + ' · ' + tarihGoster(p.tarih) + '</div></div>' +
        '<span class="rozet ' + (p.odemeDurumu === 'Ödendi' ? 'arti' :
          p.odemeDurumu === 'Borç' ? 'eksi' : 'uyari') + '">' +
          kacir(p.odemeDurumu || 'Ödendi') +
          (p.borc > 0 ? ' · ' + Tk(p.borc) : '') + '</span>' +
      '</div></div></div>';

    /* eksik zorunlu gider uyarısı — maliyet olduğundan düşük görünür */
    var gd = o.giderDurumu;
    if (gd && gd.eksikler.length) {
      h += '<div class="uyari-serit kotu"><span class="simge">⚠️</span><div>' +
        '<b>' + gd.eksikler.length + ' zorunlu gider girilmemiş</b>' +
        gd.eksikler.map(function (r) { return kacir(r.ad); }).join(', ') +
        ' eksik. Bu partinin maliyeti <b>olduğundan düşük</b> görünüyor — ' +
        'bu rakama bakıp fiyat verme. ' +
        '<b data-form="giderler" data-param="' + p.id + '" ' +
        'style="color:var(--vurgu);cursor:pointer">Giderleri gir →</b>' +
        '</div></div>';
    }

    /* maliyet dökümü */
    h += '<h2 class="bolum">Maliyet dökümü</h2>';
    h += '<div class="kart"><div class="kart-ic maliyet">';
    o.kalemler.forEach(function (k) {
      h += '<div class="satir"><div class="ad">' + kacir(k.ad) +
        (k.detay ? '<small>' + kacir(k.detay) + '</small>' : '') + '</div>' +
        '<div class="tutar">' + T(k.tumen) + '</div>' +
        '<div class="usd">' + Utam(k.usd) + '</div></div>';
    });
    h += '<div class="ayrac"></div>';
    h += '<div class="satir toplam"><div class="ad">Toplam gider</div>' +
      '<div class="tutar">' + T(o.giderTumen) + '</div>' +
      '<div class="usd">' + Utam(o.giderUsd) + '</div></div>';
    if (o.altGelirTumen > 0) {
      h += '<div class="satir mahsup"><div class="ad">(−) 8mm altı satışı' +
        '<small>' + kgTam(o.altSatilanKg) + ' satıldı</small></div>' +
        '<div class="tutar">−' + T(o.altGelirTumen) + '</div>' +
        '<div class="usd">−' + Utam(o.altGelirUsd) + '</div></div>';
    } else if (o.altStokKg > 0) {
      h += '<div class="satir"><div class="ad sonuk">8mm altı henüz satılmadı' +
        '<small>' + kgTam(o.altStokKg) + ' depoda — satılınca maliyet düşecek</small></div>' +
        '<div class="tutar sonuk">—</div><div class="usd"></div></div>';
    }
    h += '<div class="ayrac"></div>';
    h += '<div class="satir net"><div class="ad">NET MALİYET</div>' +
      '<div class="tutar">' + T(o.netTumen) + '</div>' +
      '<div class="usd">' + Utam(o.netUsd) + '</div></div>';
    h += '</div></div>';

    /* alım satırları — hangi tüccardan ne alındı */
    h += '<h2 class="bolum">Alımlar' +
      (p.saticiSayisi > 1 ? ' · ' + p.saticiSayisi + ' tüccar' : '') + '</h2>';
    h += '<div class="kart tablo-sar"><table class="alim-tablo"><thead><tr>' +
      '<th>Tüccar</th><th>kg</th><th>T/kg</th><th>Tutar</th><th>Ödeme</th>' +
      '</tr></thead><tbody>' +
      p.alimlar.map(function (a) {
        var borc = H.satirBorc(a);
        return '<tr>' +
          '<td><b>' + kacir(a.satici || '—') + '</b></td>' +
          '<td>' + n0(a.kg) + '</td>' +
          '<td>' + n0(a.birimFiyat) + '</td>' +
          '<td>' + n0(a.tutar) + '</td>' +
          '<td class="' + (borc > 0 ? 'borc' : '') + '">' +
            (borc > 0 ? kacir(a.odemeDurumu) + ' · ' + Tk(borc) : 'Ödendi') + '</td>' +
        '</tr>';
      }).join('') +
      (p.saticiSayisi > 1 ? '<tr style="font-weight:650;border-top:2px solid var(--cizgi)">' +
        '<td>Toplam</td><td>' + n0(p.hamKg) + '</td><td>' + n0(p.birimFiyat) + '</td>' +
        '<td>' + n0(p.tutar) + '</td>' +
        '<td class="' + (p.borc > 0 ? 'borc' : '') + '">' +
          (p.borc > 0 ? Tk(p.borc) : '—') + '</td></tr>' : '') +
      '</tbody></table></div>';
    if (p.saticiSayisi > 1) {
      h += '<p class="kucuk-yazi" style="margin-top:8px">T/kg sütunundaki toplam satırı ' +
        '<b>ağırlıklı ortalama</b> alım fiyatıdır. Mallar karışıp birlikte elendiği için ' +
        'randıman tüccar bazında ölçülemez — parti geneli için geçerlidir.</p>';
    }

    /* eleme sonucu */
    h += '<h2 class="bolum">Eleme sonucu</h2>';
    h += '<div class="kart"><div class="kart-ic">';
    if (o.elenenKg > 0) {
      h += '<div class="satir-arasi" style="margin-bottom:8px">' +
        '<span class="kucuk-yazi">Elenen ' + kgTam(o.elenenKg) + '</span>' +
        '<span class="rozet arti">randıman ' + yuzde(o.randiman) + '</span></div>';
      h += randimanCubuk(o);
    } else if (o.elemedeKg > 0) {
      h += '<p class="kucuk-yazi" style="margin:0">' + kgTam(o.elemedeKg) +
        ' elemede, sonuç bekleniyor. <b data-git="elemeler" style="color:var(--vurgu);cursor:pointer">Sonucu gir →</b></p>';
    } else {
      h += '<p class="kucuk-yazi" style="margin:0 0 12px">Bu parti henüz elenmedi. ' +
        'Maliyet, eleme sonucu girilince netleşir.</p>' +
        '<button class="dugme ana kucuk" data-form="eleme" data-param="' + p.id + '">Eleme kaydı gir</button>';
    }
    h += '</div></div>';

    /* SONUÇ */
    if (o.ustKg > 0) {
      h += '<div class="sonuc-kutu">' +
        '<div class="baslik">8mm üstü gerçek maliyeti</div>' +
        '<div class="buyuk">' + Uton(o.usdTon) + ' <span style="font-size:16px;font-weight:600">/ ton</span></div>' +
        '<div class="yan">' + n0(o.birimTumen) + ' Tümen / kg</div>' +
        '<div class="not">Kullanılan ortalama kur: 1 USD = ' + n0(o.kullanilanKur) + ' Tümen<br>' +
          'Fiyat verirken bakman gereken rakam budur.</div>' +
      '</div>';
    }

    /* stok durumu — parti detayında kilo tam gösterilir, tona yuvarlanmaz */
    h += '<h2 class="bolum">Bu partiden kalan</h2>';
    h += '<div class="stok-serit detay">' +
      [['Elenmemiş', o.elenmemisKg], ['Elemede', o.elemedeKg], ['8mm+ depo', o.ustStokKg],
       ['8mm− depo', o.altStokKg], ['Yüklendi', o.yuklenenKg]].map(function (x) {
        return '<div><div class="s-etiket">' + x[0] + '</div>' +
          '<div class="s-deger"' + (x[1] > 0.5 ? '' : ' style="color:var(--metin3)"') + '>' +
          kgSerit(x[1]) + '</div></div>';
      }).join('') + '</div>';

    /* satır satır döküm — hangi rakam nereden geliyor */
    h += '<div class="kart" style="margin-top:10px"><div class="kart-ic maliyet">' +
      [['Alınan ham mal', o.hamKg, ''],
       ['Elemeye giren', -o.girenKg, o.elemedeKg > 0.5 ? kgTam(o.elemedeKg) + '\'ı sonuç bekliyor' : ''],
       ['Elenmemiş kalan', o.elenmemisKg, 'depoda ham duruyor']]
        .filter(function (r) { return Math.abs(r[1]) > 0.5; })
        .map(function (r) {
          return '<div class="satir"><div class="ad">' + r[0] +
            (r[2] ? '<small>' + r[2] + '</small>' : '') + '</div>' +
            '<div class="tutar">' + (r[1] < 0 ? '−' : '') + kgTam(Math.abs(r[1])) + '</div></div>';
        }).join('') +
      (o.elenenKg > 0.5
        ? '<div class="ayrac"></div>' +
          [['8mm üstü çıktı', o.ustKg, ''],
           ['— yüklenen', -o.yuklenenKg, ''],
           ['8mm üstü depoda', o.ustStokKg, 'ihracata hazır'],
           ['8mm altı çıktı', o.altKg, ''],
           ['— satılan', -o.altSatilanKg, ''],
           ['8mm altı depoda', o.altStokKg, 'satılınca maliyet düşer'],
           ['Fire', o.fireKg, 'taş, toprak — değersiz']]
            .filter(function (r) { return Math.abs(r[1]) > 0.5; })
            .map(function (r) {
              var vurgu = r[0].indexOf('depoda') !== -1;
              return '<div class="satir"' + (vurgu ? ' style="font-weight:650"' : '') + '>' +
                '<div class="ad">' + r[0] +
                (r[2] ? '<small>' + r[2] + '</small>' : '') + '</div>' +
                '<div class="tutar">' + (r[1] < 0 ? '−' : '') + kgTam(Math.abs(r[1])) + '</div></div>';
            }).join('')
        : '') +
      '</div></div>';

    /* gider durumu — hangi kalem girildi, hangisi eksik */
    if (gd) {
      h += '<h2 class="bolum">Gider durumu</h2>';
      h += '<div class="kart"><div class="kart-ic">' +
        '<div class="gider-ozet">' +
        gd.satirlar.filter(function (r) { return r.zorunlu || r.durum === 'girildi'; })
          .map(function (r) {
            var sinif = r.durum === 'girildi' ? 'var'
                      : r.durum === 'eksik' ? 'yok'
                      : r.durum === 'beklemede' ? 'bekle' : '';
            var isaret = r.durum === 'girildi' ? '✓'
                       : r.durum === 'eksik' ? '✕' : '⏳';
            return '<span class="gider-etiket ' + sinif + '">' + isaret + ' ' +
              kacir(r.ad) + (r.durum === 'girildi' ? ' · ' + Tk(r.tumen) : '') + '</span>';
          }).join('') +
        '</div></div></div>';
    }

    /* işlemler */
    h += '<h2 class="bolum">İşlemler</h2>';
    var giderTamam = gd && gd.tamam;
    var girilenSayi = gd ? gd.satirlar.filter(function (r) { return r.durum === 'girildi'; }).length : 0;
    h += '<div class="islem-izgara">' +
      '<button class="islem-karo ' + (giderTamam ? 'tamam' : 'uyarili') + '" ' +
        'data-form="giderler" data-param="' + p.id + '">' +
        '<span class="nokta"></span>' +
        '<span class="simge">💸</span><span class="ad">Giderler</span>' +
        '<span class="aciklama">' +
          (giderTamam ? girilenSayi + ' kalem girildi'
                      : gd.eksikler.length + ' zorunlu gider eksik') +
        '</span></button>' +

      '<button class="islem-karo" data-form="eleme" data-param="' + p.id + '">' +
        '<span class="simge">⚙️</span><span class="ad">Eleme</span>' +
        '<span class="aciklama">' +
          (o.elenenKg > 0.5 ? 'randıman ' + yuzde(o.randiman, 0)
           : o.elemedeKg > 0.5 ? 'sonuç bekleniyor'
           : o.elenmemisKg > 0.5 ? kgTam(o.elenmemisKg) + ' hazır' : 'ham mal yok') +
        '</span></button>' +

      (o.altStokKg > 0.5
        ? '<button class="islem-karo" data-form="altSatis" data-param="' + p.id + '">' +
          '<span class="simge">🪙</span><span class="ad">8mm altı satışı</span>' +
          '<span class="aciklama">' + kgTam(o.altStokKg) + ' satılmayı bekliyor</span></button>'
        : '') +

      (o.ustStokKg > 0.5
        ? '<button class="islem-karo" data-form="sevkiyat">' +
          '<span class="simge">🚚</span><span class="ad">Sevkiyat</span>' +
          '<span class="aciklama">' + kgTam(o.ustStokKg) + ' yüklenebilir</span></button>'
        : '') +

      '<button class="islem-karo genis" data-form="parti" data-param="' + p.id + '">' +
        '<span class="simge">✏️</span><span class="ad">Partiyi ve alımları düzenle</span></button>' +
      '<button class="islem-karo genis" data-eylem="partiSil" data-param="' + p.id + '" ' +
        'style="color:var(--eksi)">' +
        '<span class="simge">🗑️</span><span class="ad">Partiyi sil</span></button>' +
      '</div>';

    if (p.not) {
      h += '<h2 class="bolum">Not</h2><div class="kart"><div class="kart-ic kucuk-yazi">' +
        kacir(p.not) + '</div></div>';
    }
    return h + '</div>';
  }

  /* ============================================================
     KASA
     ============================================================ */
  function ekranKasa(veri) {
    var kasa = H.kasa(veri);
    var h = '<div class="sayfa">';

    h += '<div class="kutular">' +
      kutu('Kasa bakiyesi', Tk(kasa.bakiye), kasa.bakiye ? '≈ ' + Uk(kasa.usdKarsilik) : 'boş', true) +
      kutu('Ortalama kur', kasa.ortKur ? n0(kasa.ortKur) : '—', 'Tümen / 1 USD') +
      kutu('Toplam bozdurulan', Uk(kasa.girenUsd), Tk(kasa.girenTumen)) +
      '</div>';

    h += '<div class="bosluk"></div>' +
      '<button class="dugme ana tam" data-form="transfer">💵 Döviz transferi ekle</button>';

    var tr = (veri.transferler || []).slice().sort(function (a, b) {
      return (b.tarih || '').localeCompare(a.tarih || '');
    });
    h += '<h2 class="bolum">Döviz transferleri</h2>';
    if (!tr.length) {
      h += bosDurum('💵', 'Henüz döviz transferi yok.<br>' +
        'Programın USD maliyet hesabı yapabilmesi için önce buradan dolar girişini kaydet.');
    } else {
      h += '<div class="kart"><ul class="liste">' + tr.map(function (t) {
        var kur = t.usd > 0 ? t.tumen / t.usd : 0;
        return '<li data-form="transfer" data-param="' + t.id + '">' +
          '<div class="sol"><div class="ana">' + U(t.usd) + ' → ' + Tk(t.tumen) + '</div>' +
          '<div class="yan">' + tarihGoster(t.tarih) + (t.not ? ' · ' + kacir(t.not) : '') + '</div></div>' +
          '<div class="sag"><div class="ana">' + n0(kur) + '</div>' +
          '<div class="yan">T / USD</div></div><span class="ok">›</span></li>';
      }).join('') + '</ul></div>';
    }

    h += '<div class="bosluk"></div>' +
      '<button class="dugme tam" data-git="defter">📒 Kasa defterini aç</button>';
    return h + '</div>';
  }

  /* ============================================================
     RAPORLAR
     ============================================================ */
  function ekranRapor(veri) {
    var stok = H.stok(veri);
    var h = '<div class="sayfa">';
    h += '<div class="secim-izgara">' +
      raporDugme('karsilastirma', '📊', 'Parti karşılaştırma', 'Hangi parti gerçekten ucuz') +
      raporDugme('tuccarlar', '🤝', 'Tüccarlar', 'Alım fiyatı ve kime ne kadar borç') +
      raporDugme('stok', '🏬', 'Stok raporu', 'Nerede ne kadar mal var') +
      raporDugme('sevkiyatlar', '🚚', 'Sevkiyatlar', 'Yüklenen mal, maliyet ve kâr') +
      raporDugme('defter', '📒', 'Kasa defteri', 'Tüm para giriş çıkışı') +
      raporDugme('masraflar', '💸', 'Tüm masraflar', 'Kategoriye göre döküm') +
      raporDugme('elemeler', '⚙️', 'Eleme kayıtları', 'Randıman geçmişi') +
      '</div>';
    h += '<h2 class="bolum">Program</h2>' +
      '<div class="secim-izgara">' +
      raporDugme('ayarlar', '💾', 'Yedek ve ayarlar', 'Veriyi indir, geri yükle') +
      '</div>';
    return h + '</div>';
  }
  function raporDugme(hedef, simge, ad, aciklama) {
    return '<button data-git="' + hedef + '"><span class="simge">' + simge + '</span>' +
      '<span class="ad">' + ad + '</span>' +
      '<span class="aciklama">' + aciklama + '</span></button>';
  }

  /* --- parti karşılaştırma --- */
  function ekranKarsilastirma(veri) {
    var partiler = H.tumPartiler(veri).filter(function (p) { return p.ustKg > 0; });
    var h = '<div class="sayfa">';
    if (!partiler.length) {
      return h + bosDurum('📊', 'Karşılaştırma için en az bir elenmiş parti gerekiyor.') + '</div>';
    }
    partiler.sort(function (a, b) { return a.usdTon - b.usdTon; });
    h += '<p class="kucuk-yazi" style="margin:0 0 10px">Ucuzdan pahalıya sıralı. ' +
      'Randıman düşükse maliyet yükselir — bu tabloda ikisini birlikte görürsün.</p>';
    h += '<div class="kart tablo-sar"><table><thead><tr>' +
      '<th>Parti</th><th>USD/ton</th><th>Randıman</th><th>Fire</th>' +
      '<th>8mm+ kg</th><th>Alım T/kg</th><th>Net maliyet</th>' +
      '</tr></thead><tbody>' +
      partiler.map(function (o, i) {
        return '<tr class="tiklanabilir" data-git="parti" data-param="' + o.parti.id + '">' +
          '<td><b>' + kacir(o.parti.kod) + '</b><br><span style="font-size:11.5px;color:var(--metin2)">' +
            kacir(o.parti.satici || '—') + (o.parti.bolge ? ' · ' + kacir(o.parti.bolge) : '') + '</span></td>' +
          '<td class="' + (i === 0 ? 'pozitif' : '') + '"><b>' + A.nAkilli(o.usdTon) + '</b></td>' +
          '<td>' + yuzde(o.randiman, 0) + '</td>' +
          '<td>' + yuzde(o.fireOran, 1) + '</td>' +
          '<td>' + n0(o.ustKg) + '</td>' +
          '<td>' + n0(o.parti.birimFiyat) + '</td>' +
          '<td>' + Tk(o.netTumen) + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';

    h += '<div class="bosluk"></div>' +
      '<button class="dugme tam" data-git="tuccarlar">🤝 Tüccar bazında alım fiyatları</button>';
    return h + '</div>';
  }

  /* --- tüccarlar --- */
  function ekranTuccarlar(veri) {
    var liste = H.tuccarlar(veri);
    var h = '<div class="sayfa">';
    if (!liste.length) {
      return h + bosDurum('🤝', 'Henüz alım kaydı yok.') + '</div>';
    }
    var toplamBorc = H.toplamBorc(veri);
    var toplamKg = 0, toplamTutar = 0;
    liste.forEach(function (t) { toplamKg += t.kg; toplamTutar += t.tutar; });

    h += '<div class="kutular">' +
      kutu('Toplam alım', KG(toplamKg), liste.length + ' tüccar') +
      kutu('Toplam borç', toplamBorc > 0 ? Tk(toplamBorc) : '—',
           toplamBorc > 0 ? 'ödenmemiş' : 'borç yok') +
      '</div>';

    if (toplamBorc > 0) {
      h += '<div class="bosluk"></div>';
      h += '<h2 class="bolum">Kime ne kadar borçlusun</h2>';
      h += '<div class="kart"><ul class="liste">' +
        liste.filter(function (t) { return t.borc > 0; })
          .sort(function (a, b) { return b.borc - a.borc; })
          .map(function (t) {
            return '<li style="cursor:default"><div class="sol">' +
              '<div class="ana">' + kacir(t.ad) + '</div>' +
              '<div class="yan">' + KG(t.kg) + ' aldın · toplam ' + Tk(t.tutar) + '</div></div>' +
              '<div class="sag"><div class="ana negatif">' + Tk(t.borc) + '</div>' +
              '<div class="yan">borç</div></div></li>';
          }).join('') + '</ul></div>';
    }

    h += '<h2 class="bolum">Alım fiyatına göre</h2>';
    h += '<p class="kucuk-yazi" style="margin:0 0 10px">Ucuzdan pahalıya. Mallar depoda ' +
      'karışıp birlikte elendiği için randıman tüccar bazında ölçülemez — burada ' +
      '<b>alım fiyatı</b> karşılaştırılır.</p>';
    h += '<div class="kart tablo-sar"><table><thead><tr>' +
      '<th>Tüccar</th><th>Ort. T/kg</th><th>Toplam kg</th><th>Tutar</th><th>Alım</th><th>Borç</th>' +
      '</tr></thead><tbody>' +
      liste.slice().sort(function (a, b) { return a.ortFiyat - b.ortFiyat; })
        .map(function (t, i) {
          return '<tr>' +
            '<td><b>' + kacir(t.ad) + '</b></td>' +
            '<td class="' + (i === 0 ? 'pozitif' : '') + '"><b>' + n0(t.ortFiyat) + '</b></td>' +
            '<td>' + n0(t.kg) + '</td>' +
            '<td>' + Tk(t.tutar) + '</td>' +
            '<td>' + t.alimSayisi + '</td>' +
            '<td class="' + (t.borc > 0 ? 'negatif' : '') + '">' +
              (t.borc > 0 ? Tk(t.borc) : '—') + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>';
    return h + '</div>';
  }

  /* --- stok raporu --- */
  function ekranStok(veri) {
    var stok = H.stok(veri);
    var h = '<div class="sayfa">';
    h += '<div class="kutular">' +
      kutu('Ham (elenmemiş)', KG(stok.ham)) +
      kutu('Elemede', KG(stok.elemede)) +
      kutu('8mm+ depoda', KG(stok.ust)) +
      kutu('8mm− depoda', KG(stok.alt)) +
      kutu('Yüklendi', KG(stok.yuklenen)) +
      kutu('Toplam fire', KG(stok.fire)) +
      '</div>';

    var aktif = stok.partiler.filter(function (p) {
      return p.elenmemisKg > 0.5 || p.elemedeKg > 0.5 || p.ustStokKg > 0.5 || p.altStokKg > 0.5;
    });
    h += '<h2 class="bolum">Parti bazında elde kalan</h2>';
    if (!aktif.length) {
      h += bosDurum('🏬', 'Depoda mal görünmüyor.');
    } else {
      h += '<div class="kart tablo-sar"><table><thead><tr>' +
        '<th>Parti</th><th>Ham</th><th>Elemede</th><th>8mm+</th><th>8mm−</th><th>Değeri</th>' +
        '</tr></thead><tbody>' + aktif.map(function (o) {
          var deger = o.ustStokKg * o.birimUsd;
          return '<tr class="tiklanabilir" data-git="parti" data-param="' + o.parti.id + '">' +
            '<td><b>' + kacir(o.parti.kod) + '</b></td>' +
            '<td>' + (o.elenmemisKg > 0.5 ? n0(o.elenmemisKg) : '—') + '</td>' +
            '<td>' + (o.elemedeKg > 0.5 ? n0(o.elemedeKg) : '—') + '</td>' +
            '<td>' + (o.ustStokKg > 0.5 ? n0(o.ustStokKg) : '—') + '</td>' +
            '<td>' + (o.altStokKg > 0.5 ? n0(o.altStokKg) : '—') + '</td>' +
            '<td>' + (deger > 0 ? U(deger) : '—') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      h += '<p class="kucuk-yazi" style="margin-top:8px">Değer = depodaki 8mm+ malın maliyet karşılığı (USD).</p>';
    }
    return h + '</div>';
  }

  /* --- kasa defteri --- */
  function ekranDefter(veri) {
    var kasa = H.kasa(veri);
    var h = '<div class="sayfa">';
    if (!kasa.defter.length) {
      return h + bosDurum('📒', 'Henüz hareket yok.') + '</div>';
    }
    h += '<div class="kart tablo-sar"><table><thead><tr>' +
      '<th>Tarih</th><th>İşlem</th><th>Giren</th><th>Çıkan</th><th>Bakiye</th><th>Ort. kur</th>' +
      '</tr></thead><tbody>' +
      kasa.defter.slice().reverse().map(function (s) {
        return '<tr><td>' + tarihGoster(s.tarih) + '<br><span style="font-size:11.5px;color:var(--metin2)">' +
          kacir(s.tur) + '</span></td>' +
          '<td style="text-align:left;white-space:normal;max-width:200px">' + kacir(s.aciklama) + '</td>' +
          '<td class="' + (s.giren ? 'pozitif' : '') + '">' + (s.giren ? n0(s.giren) : '—') + '</td>' +
          '<td class="' + (s.cikan ? 'negatif' : '') + '">' + (s.cikan ? n0(s.cikan) : '—') + '</td>' +
          '<td>' + n0(s.bakiye) + '</td>' +
          '<td>' + (s.ortKur ? n0(s.ortKur) : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    h += '<p class="kucuk-yazi" style="margin-top:8px">Tutarlar Tümen. Ortalama kur, o andaki kasa ortalamasıdır — ' +
      'harcamaların USD karşılığı bu kurla hesaplanır.</p>';
    return h + '</div>';
  }

  /* --- sevkiyatlar --- */
  function ekranSevkiyatlar(veri) {
    var h = '<div class="sayfa">';
    h += '<button class="dugme ana tam" data-form="sevkiyat">🚚 Yeni sevkiyat</button><div class="bosluk"></div>';
    var liste = (veri.sevkiyatlar || []).slice().sort(function (a, b) {
      return (b.tarih || '').localeCompare(a.tarih || '');
    });
    if (!liste.length) {
      h += bosDurum('🚚', 'Henüz sevkiyat yok.');
      return h + '</div>';
    }
    h += '<div class="kart"><ul class="liste">' + liste.map(function (s) {
      var o = H.sevkiyat(veri, s.id);
      return '<li data-git="sevkiyat" data-param="' + s.id + '">' +
        '<div class="sol"><div class="ana">' + kacir(s.no || 'Sevkiyat') +
          ' <span class="rozet ' + (s.durum === 'Teslim edildi' ? 'arti' : 'uyari') + '">' +
          kacir(s.durum || 'Hazırlanıyor') + '</span></div>' +
        '<div class="yan">' + tarihGoster(s.tarih) + (s.plaka ? ' · ' + kacir(s.plaka) : '') +
          (s.alici ? ' · ' + kacir(s.alici) : '') + '</div></div>' +
        '<div class="sag"><div class="ana">' + KG(o.toplamKg) + '</div>' +
        '<div class="yan">' + U(o.maliyetUsdTon) + '/ton</div></div><span class="ok">›</span></li>';
    }).join('') + '</ul></div>';
    return h + '</div>';
  }

  function ekranSevkiyat(veri, id) {
    var o = H.sevkiyat(veri, id);
    if (!o) return '<div class="sayfa">' + bosDurum('🔍', 'Sevkiyat bulunamadı.') + '</div>';
    var s = o.sevkiyat;
    var h = '<div class="sayfa">';
    h += '<div class="kart"><div class="kart-ic">' +
      '<div style="font-size:19px;font-weight:670">' + kacir(s.no || 'Sevkiyat') + '</div>' +
      '<div class="kucuk-yazi" style="margin-top:4px">' + tarihGoster(s.tarih) +
      (s.plaka ? ' · ' + kacir(s.plaka) : '') + (s.sofor ? ' · ' + kacir(s.sofor) : '') +
      (s.alici ? '<br>Alıcı: ' + kacir(s.alici) : '') + '</div></div></div>';

    h += '<div class="kutular">' +
      kutu('Yüklenen', KG(o.toplamKg)) +
      kutu('Maliyet', Uton(o.maliyetUsdTon), 'USD / ton') +
      '</div>';

    if (o.satisUsd > 0) {
      h += '<div class="bosluk"></div><div class="kutular">' +
        kutu('Satış', U(s.satisUsdTon), 'USD / ton') +
        kutu('Kâr', (o.karUsd >= 0 ? '' : '−') + U(Math.abs(o.karUsd)),
             yuzde(o.karOran, 1) + ' · toplam') +
        '</div>';
    }

    h += '<h2 class="bolum">Yüklenen partiler</h2>';
    h += '<div class="kart tablo-sar"><table><thead><tr>' +
      '<th>Parti</th><th>kg</th><th>USD/ton</th><th>Maliyet</th></tr></thead><tbody>' +
      o.kalemler.map(function (k) {
        return '<tr class="tiklanabilir" data-git="parti" data-param="' + k.partiId + '">' +
          '<td><b>' + kacir(k.kod) + '</b><br><span style="font-size:11.5px;color:var(--metin2)">' +
          kacir(k.satici || '') + '</span></td>' +
          '<td>' + n0(k.kg) + '</td><td>' + A.nAkilli(k.usdTon) + '</td>' +
          '<td>' + U(k.maliyetUsd) + '</td></tr>';
      }).join('') + '</tbody></table></div>';

    h += '<div class="bosluk"></div><div class="dugmeler">' +
      '<button class="dugme" data-form="sevkiyat" data-param="' + s.id + '">✏️ Düzenle</button>' +
      '<button class="dugme tehlike" data-eylem="sevkiyatSil" data-param="' + s.id + '">Sil</button></div>';
    return h + '</div>';
  }

  /* --- masraflar --- */
  function ekranMasraflar(veri) {
    var kasa = H.kasa(veri);
    var h = '<div class="sayfa">';
    h += '<button class="dugme ana tam" data-form="masraf">💸 Masraf ekle</button><div class="bosluk"></div>';
    var liste = (veri.masraflar || []).slice().sort(function (a, b) {
      return (b.tarih || '').localeCompare(a.tarih || '');
    });
    if (!liste.length) { h += bosDurum('💸', 'Henüz masraf kaydı yok.'); return h + '</div>'; }

    var kat = {};
    liste.forEach(function (m) {
      var k = m.kategori || 'Diğer';
      kat[k] = (kat[k] || 0) + (kasa.usdDegeri['masraf:' + m.id] || 0);
    });
    h += '<div class="kart"><div class="kart-ic maliyet">' +
      Object.keys(kat).sort(function (a, b) { return kat[b] - kat[a]; }).map(function (k) {
        return '<div class="satir"><div class="ad">' + kacir(k) + '</div>' +
          '<div class="tutar">' + U(kat[k]) + '</div></div>';
      }).join('') + '</div></div>';

    h += '<h2 class="bolum">Kayıtlar</h2>';
    h += '<div class="kart"><ul class="liste">' + liste.map(function (m) {
      var kodlar = (m.partiIds || []).map(function (id) {
        var p = (veri.partiler || []).find(function (x) { return x.id === id; });
        return p ? p.kod : '?';
      }).join(', ');
      return '<li data-form="masraf" data-param="' + m.id + '">' +
        '<div class="sol"><div class="ana">' + kacir(m.kategori || 'Masraf') + '</div>' +
        '<div class="yan">' + tarihGoster(m.tarih) + (kodlar ? ' · ' + kacir(kodlar) : '') +
        (m.aciklama ? ' · ' + kacir(m.aciklama) : '') + '</div></div>' +
        '<div class="sag"><div class="ana">' +
        (m.paraBirimi === 'USD' ? U(m.tutar) : Tk(m.tutar)) + '</div>' +
        '<div class="yan">' + (m.paraBirimi === 'USD' ? 'USD' : U(kasa.usdDegeri['masraf:' + m.id] || 0)) +
        '</div></div><span class="ok">›</span></li>';
    }).join('') + '</ul></div>';
    return h + '</div>';
  }

  /* --- elemeler --- */
  function ekranElemeler(veri) {
    var h = '<div class="sayfa">';
    h += '<button class="dugme ana tam" data-form="eleme">⚙️ Eleme kaydı gir</button><div class="bosluk"></div>';
    var liste = (veri.elemeler || []).slice().sort(function (a, b) {
      return (b.tarih || '').localeCompare(a.tarih || '');
    });
    if (!liste.length) { h += bosDurum('⚙️', 'Henüz eleme kaydı yok.'); return h + '</div>'; }

    h += '<div class="kart"><ul class="liste">' + liste.map(function (e) {
      var p = (veri.partiler || []).find(function (x) { return x.id === e.partiId; });
      var d = H.elemeDenetim(e.girenKg, e.ustKg, e.altKg, e.fireKg);
      var bekliyor = e.tamamlandi === false;
      var rand = e.girenKg > 0 ? (e.ustKg || 0) / e.girenKg : 0;
      return '<li data-form="eleme" data-param="' + e.id + '">' +
        '<div class="sol"><div class="ana">' + kacir(p ? p.kod : 'Parti silinmiş') + ' ' +
          (bekliyor ? '<span class="rozet uyari">sonuç bekliyor</span>'
                    : (d.uyari ? '<span class="rozet eksi">rakamlar tutmuyor</span>' : '')) + '</div>' +
        '<div class="yan">' + tarihGoster(e.tarih) + ' · giren ' + kgTam(e.girenKg) +
          (bekliyor ? '' : ' · 8mm+ ' + kgTam(e.ustKg)) + '</div></div>' +
        '<div class="sag">' + (bekliyor ? '<div class="ana sonuk">—</div>' :
          '<div class="ana">' + yuzde(rand, 0) + '</div><div class="yan">randıman</div>') +
        '</div><span class="ok">›</span></li>';
    }).join('') + '</ul></div>';
    return h + '</div>';
  }

  /* --- ayarlar / yedek --- */
  function ekranAyarlar(veri) {
    var h = '<div class="sayfa">';
    h += '<div class="uyari-serit"><span class="simge">💾</span><div>' +
      '<b>Verilerin şu an sadece bu cihazda</b>' +
      'Tarayıcı verisi silinirse kayıtlar gider. Haftada bir yedek al — dosyayı kendine ' +
      'WhatsApp/e-posta ile gönder, orada durur.</div></div>';

    h += '<h2 class="bolum">Yedek</h2>';
    h += '<div class="kart"><div class="kart-ic">' +
