            .sort(function (a, b) { return b.borc - a.borc; })
            .map(function (t) {
              return [kacir(t.ad), n0(t.kg), n0(t.tutar), '<b>' + n0(t.borc) + '</b>'];
            }), ['l']);
      }
      g += '<h2>Alım fiyatına göre</h2>';
      g += '<p class="b-not">Mallar karışıp birlikte elendiği için randıman tüccar ' +
        'bazında ölçülemez — burada alım fiyatı karşılaştırılır.</p>';
      g += tablo(['Tüccar', 'Ort. T/kg', 'Toplam kg', 'Tutar', 'Alım', 'Borç'],
        liste.slice().sort(function (a, b) { return a.ortFiyat - b.ortFiyat; })
          .map(function (t) {
            return [kacir(t.ad), '<b>' + n0(t.ortFiyat) + '</b>', n0(t.kg), n0(t.tutar),
                    String(t.alimSayisi), t.borc > 0 ? n0(t.borc) : '—'];
          }), ['l']);
      return belge('Tüccar Raporu', liste.length + ' tüccar', g, aralik);
    },

    /* --- genel giderler --- */
    genelGiderler: function (veri, param, aralik) {
      var kasa = H.kasa(veri);
      var tam = H.genelGiderler(veri, kasa);
      var gg = donemeIndirge(tam, aralik);
      if (!gg.liste.length) return null;
      var g = kutucuk([
        ['Toplam', U(gg.toplamUsd), n0(gg.toplamTumen) + ' T'],
        ['Kayıt sayısı', String(gg.liste.length)]
      ]);
      g += '<div class="b-not">Bu tutarlar malın maliyetine dahil değildir. ' +
        'Kasadan düşerler ama hiçbir partiye dağıtılmazlar.</div>';
      var gercek = gg.geziler.filter(function (x) { return x.ad !== 'Belirtilmemiş'; });
      if (gercek.length) {
        g += '<h2>Geziye göre</h2>';
        g += tablo(['Gezi / dönem', 'Kayıt', 'Tümen', 'USD'],
          gg.geziler.map(function (x) {
            return [kacir(x.ad), String(x.adet), n0(x.tumen), Utam(x.usd)];
          }), ['l']);
      }
      g += '<h2>Kategoriye göre</h2>';
      g += tablo(['Kategori', 'USD'],
        gg.kategoriler.map(function (x) { return [kacir(x.ad), Utam(x.usd)]; })
          .concat([['<b>TOPLAM</b>', '<b>' + Utam(gg.toplamUsd) + '</b>']]), ['l']);
      g += '<h2>Kayıtlar</h2>';
      g += tablo(['Tarih', 'Kategori', 'Gezi', 'Açıklama', 'Tutar'],
        gg.liste.slice().sort(function (a, b) {
          return (b.kayit.tarih || '').localeCompare(a.kayit.tarih || '');
        }).map(function (x) {
          var r = x.kayit;
          return [tarihGoster(r.tarih), kacir(r.kategori || ''), kacir(r.gezi || '—'),
                  kacir(r.aciklama || '—'),
                  r.paraBirimi === 'USD' ? U(r.tutar) : n0(r.tutar) + ' T'];
        }), ['l', 'l', 'l', 'l']);
      return belge('Genel Giderler', 'Seyahat ve işletme masrafları', g, aralik);
    },

    /* --- kasa defteri --- */
    defter: function (veri, param, aralik) {
      var kasa = H.kasa(veri);
      if (!kasa.defter.length) return null;

      /* Dönem başındaki DEVİR bakiyesi: aralıktan önceki son satırın
         bakiyesi. Muhasebede doğrusu budur — dönem kendi başına okunur. */
      var devir = 0, oncekiVar = false;
      kasa.defter.forEach(function (s) {
        if (aralik && aralik.bas && String(s.tarih || '').slice(0, 10) < aralik.bas) {
          devir = s.bakiye; oncekiVar = true;
        }
      });

      var donemSatirlari = kasa.defter.filter(function (s) {
        return aralikta(s.tarih, aralik);
      });
      if (!donemSatirlari.length) return null;

      var girenT = 0, cikanT = 0;
      donemSatirlari.forEach(function (s) { girenT += s.giren; cikanT += s.cikan; });
      var kapanis = donemSatirlari[donemSatirlari.length - 1].bakiye;

      var g = kutucuk([
        ['Devir bakiye', oncekiVar ? n0(devir) + ' T' : '—'],
        ['Dönemde giren', n0(girenT) + ' T'],
        ['Dönemde çıkan', n0(cikanT) + ' T'],
        ['Kapanış bakiye', n0(kapanis) + ' T']
      ]);
      g += '<div class="b-not">Bugünkü bakiye: ' + n0(kasa.bakiye) + ' T · ' +
        'ortalama kur ' + n0(kasa.ortKur) + ' T/USD</div>';

      g += '<h2>Hareketler</h2>';
      var satirlar = donemSatirlari.slice().reverse().map(function (s) {
        return [tarihGoster(s.tarih), kacir(s.tur), kacir(s.aciklama),
                s.giren ? n0(s.giren) : '—', s.cikan ? n0(s.cikan) : '—', n0(s.bakiye)];
      });
      if (oncekiVar) {
        satirlar.push(['—', '<b>Devir</b>', '<b>Dönem başı bakiye</b>', '—', '—',
                       '<b>' + n0(devir) + '</b>']);
      }
      g += tablo(['Tarih', 'İşlem', 'Açıklama', 'Giren', 'Çıkan', 'Bakiye'],
        satirlar, ['l', 'l', 'l']);
      return belge('Kasa Defteri', 'Para giriş ve çıkışı (Tümen)', g, aralik);
    },

    /* --- sevkiyat --- */
    sevkiyat: function (veri, id) {
      var o = H.sevkiyat(veri, id);
      if (!o) return null;
      var s = o.sevkiyat;
      var g = kutucuk([
        ['Yüklenen', kgTam(o.toplamKg)],
        ['Maliyet', Uton(o.maliyetUsdTon) + '/ton', U(o.maliyetUsd) + ' toplam']
      ].concat(o.satisUsd > 0
        ? [['Satış', U(s.satisUsdTon) + '/ton'],
           ['Kâr', U(o.karUsd), yuzde(o.karOran, 1)]] : []));
      g += '<h2>Yüklenen partiler</h2>';
      g += tablo(['Parti', 'Satıcı', 'kg', 'USD/ton', 'Maliyet'],
        o.kalemler.map(function (k) {
          return [kacir(k.kod), kacir(k.satici || '—'), n0(k.kg),
                  A.n2(k.usdTon), Utam(k.maliyetUsd)];
        }), ['l', 'l']);
      return belge('Sevkiyat — ' + (s.no || ''),
        tarihGoster(s.tarih) + (s.plaka ? ' · ' + kacir(s.plaka) : '') +
        (s.alici ? ' · ' + kacir(s.alici) : '') + ' · ' + kacir(s.durum || ''), g);
    },

    /* --- genel özet --- */
    ozet: function (veri, param, aralik) {
      var kasa = H.kasa(veri);
      var st = H.stok(veri);
      var partiler = st.partiler.filter(function (p) {
        return aralikta(p.parti.tarih, aralik);
      });
      var elenmis = partiler.filter(function (p) { return p.ustKg > 0; });
      var toplamUst = 0, toplamNetU = 0;
      elenmis.forEach(function (p) { toplamUst += p.ustKg; toplamNetU += p.netUsd; });
      var gg = donemeIndirge(H.genelGiderler(veri, kasa), aralik);

      var g = kutucuk([
        ['Kasa (bugün)', n0(kasa.bakiye) + ' T', '≈ ' + U(kasa.usdKarsilik)],
        ['Ortalama kur', n0(kasa.ortKur), 'T / 1 USD'],
        ['Tüccarlara borç', n0(H.toplamBorc(veri)) + ' T'],
        ['Dönemde alınan parti', String(partiler.length)]
      ]);
      if (toplamUst > 0) {
        g += '<div class="b-not">Dönemdeki partilerin ortalama 8mm+ maliyeti: <b>' +
          Uton(toplamNetU / toplamUst * 1000) + ' / ton</b></div>';
      }

      g += '<h2>Stok — bugün itibarıyla</h2>';
      g += tablo(['Durum', 'kg'], [
        ['Ham (elenmemiş)', n0(st.ham)], ['Elemede', n0(st.elemede)],
        ['8mm+ depoda', n0(st.ust)], ['8mm− depoda', n0(st.alt)],
        ['Yüklendi', n0(st.yuklenen)], ['Fire', n0(st.fire)]
      ], ['l']);

      if (partiler.length) {
        g += '<h2>Partiler — dönemde alınan</h2>';
        g += tablo(['Parti', 'Tarih', 'Satıcı', 'Alınan kg', '8mm+ kg', 'USD/ton'],
          partiler.slice().sort(function (a, b) {
            return (b.parti.tarih || '').localeCompare(a.parti.tarih || '');
          }).map(function (o) {
            return [kacir(o.parti.kod), tarihGoster(o.parti.tarih),
                    kacir(o.parti.satici || '—'), n0(o.hamKg),
                    o.ustKg > 0 ? n0(o.ustKg) : '—',
                    o.ustKg > 0 ? A.n2(o.usdTon) : '—'];
          }), ['l', 'l', 'l']);
      }

      if (gg.toplamUsd > 0) {
        g += '<h2>Genel giderler — dönemde (mala dahil değil)</h2>';
        g += tablo(['Kategori', 'USD'],
          gg.kategoriler.map(function (x) { return [kacir(x.ad), Utam(x.usd)]; })
            .concat([['<b>TOPLAM</b>', '<b>' + Utam(gg.toplamUsd) + '</b>']]), ['l']);
      }

      return belge('Genel Özet', 'Kasa, stok, partiler ve maliyetler', g, aralik);
    }
  };

  /* ============================================================
     YAZDIRMA
     ============================================================ */

  /* Dönem seçimi: dönemli raporlarda önce tarih aralığı sorulur */
  var sonAralik = null;

  function yazdir(tur, param) {
    if (!URETICILER[tur]) return A.bildir('Bu rapor bulunamadı');
    if (!DONEMLI[tur]) return uret(tur, param, null);
    donemSor(tur, param);
  }

  function donemSor(tur, param) {
    var d = donemler();
    var secili = sonAralik || d[d.length - 1];   // varsayılan: Tümü

    var govde =
      '<p class="kucuk-yazi" style="margin:0 0 12px">Hangi dönemin raporunu ' +
        'almak istiyorsun?</p>' +
      '<div class="donem-izgara">' +
        d.map(function (x) {
          return '<button type="button" class="donem-dugme" data-bas="' + x.bas +
            '" data-bit="' + x.bit + '">' + x.ad + '</button>';
        }).join('') +
      '</div>' +
      '<h2 class="bolum">Kendin seç</h2>' +
      '<div class="ikili">' +
        '<div class="alan"><label for="d_bas">Başlangıç</label>' +
          '<input type="date" id="d_bas" value="' + (secili.bas || '') + '"></div>' +
        '<div class="alan"><label for="d_bit">Bitiş</label>' +
          '<input type="date" id="d_bit" value="' + (secili.bit || '') + '"></div>' +
      '</div>' +
      '<div class="ipucu" id="d_ozet"></div>';

    var p = A.panelAc('Rapor dönemi', govde,
      '<button class="dugme" type="button" data-iptal>Vazgeç</button>' +
      '<button class="dugme ana" type="button" data-tamam>📄 PDF oluştur</button>');

    function guncelle() {
      var bas = A.el('d_bas').value, bit = A.el('d_bit').value;
      var o = A.el('d_ozet');
      if (bas && bit && bas > bit) {
        o.className = 'ipucu hata';
        o.textContent = 'Başlangıç, bitişten sonra olamaz.';
      } else {
        o.className = 'ipucu vurgulu';
        o.textContent = donemYazisi({ bas: bas, bit: bit });
      }
    }
    A.el('d_bas').onchange = guncelle;
    A.el('d_bit').onchange = guncelle;
    guncelle();

    Array.prototype.forEach.call(p.querySelectorAll('.donem-dugme'), function (b) {
      b.onclick = function () {
        A.el('d_bas').value = b.dataset.bas;
        A.el('d_bit').value = b.dataset.bit;
        guncelle();
        Array.prototype.forEach.call(p.querySelectorAll('.donem-dugme'), function (x) {
          x.classList.remove('secili');
        });
        b.classList.add('secili');
      };
    });

    A.$('[data-iptal]', p).onclick = A.panelKapat;
    A.$('[data-tamam]', p).onclick = function () {
      var bas = A.el('d_bas').value, bit = A.el('d_bit').value;
      if (bas && bit && bas > bit) return A.bildir('Tarih aralığı ters');
      sonAralik = { bas: bas, bit: bit };
      A.panelKapat();
      uret(tur, param, sonAralik);
    };
  }

  function uret(tur, param, aralik) {
    var uretici = URETICILER[tur];
    var html = uretici(V.hepsi(), param, aralik);
    if (!html) return A.bildir('Bu dönemde gösterilecek kayıt yok');

    var kap = document.getElementById('basim');
    if (!kap) {
      kap = document.createElement('div');
      kap.id = 'basim';
      document.body.appendChild(kap);
    }
    kap.innerHTML = html;
    document.body.classList.add('basiliyor');

    function bitir() {
      document.body.classList.remove('basiliyor');
      window.removeEventListener('afterprint', bitir);
    }
    window.addEventListener('afterprint', bitir);
    setTimeout(function () { window.print(); }, 60);
    setTimeout(bitir, 60000);   // güvenlik ağı
  }

  var DONEMLI = { ozet: 1, karsilastirma: 1, defter: 1, genelGiderler: 1, tuccarlar: 1 };

  window.Rapor = {
    yazdir: yazdir, ureticiler: URETICILER,
    donemler: donemler, donemli: DONEMLI, aralikta: aralikta, donemYazisi: donemYazisi
  };
})();
/* ============================================================
   guncelleme.js — Program güncellenince haber verir

   Program dosyası değiştiğinde (yeni sürüm derlendiğinde) açık
   duran pencere eski sürümü göstermeye devam eder. Bu, kişinin
   "güncellenmemiş gibi duruyor" demesine yol açar.

   Bu dosya, pencere her öne geldiğinde sunucuya sorar; dosya
   değişmişse üstte bir şerit çıkarır. Form açıkken kendiliğinden
   yenilemez — yazdığın kaybolmasın.
   ============================================================ */
(function () {
  'use strict';

  if (!/^https?:$/.test(location.protocol)) return;   // yalnızca sunucudan açıldığında

  var ilkSurum = null;
  var seritVar = false;

  function surumAl() {
    return fetch('/api/surum', { cache: 'no-store' })
      .then(function (y) { return y.ok ? y.json() : null; })
      .then(function (d) { return d && d.surum; })
      .catch(function () { return null; });
  }

  function serit() {
    if (seritVar) return;
    seritVar = true;
    var d = document.createElement('div');
    d.className = 'guncelleme-serit';
    d.innerHTML =
      '<span>Programın yeni sürümü hazır.</span>' +
      '<button type="button">Yenile</button>';
    d.querySelector('button').onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }

  function kontrol() {
    surumAl().then(function (s) {
      if (!s) return;
      if (ilkSurum === null) { ilkSurum = s; return; }
      if (s !== ilkSurum) serit();
    });
  }

  kontrol();
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) kontrol();
  });
  window.addEventListener('focus', kontrol);
})();
/* ============================================================
   baslat.js — Programı ayağa kaldırır
   ============================================================ */
(function () {
  'use strict';

  // Tema tercihini geri yükle
  try {
    var t = localStorage.getItem('nohut_tema');
    if (t && t !== 'sistem') document.documentElement.setAttribute('data-tema', t);
  } catch (e) { }

  function hataGoster(baslik, mesaj) {
    document.getElementById('uygulama').innerHTML =
      '<div class="sayfa"><div class="uyari-serit kotu"><span class="simge">⚠️</span>' +
      '<div><b>' + baslik + '</b>' + mesaj + '</div></div></div>';
  }

  function saltOkunurSerit() {
    if (!window.NOHUT_SALT_OKUNUR) return;
    var d = document.createElement('div');
    d.className = 'kopya-serit';
    var t = window.NOHUT_KOPYA_TARIHI || '';
    d.innerHTML = '<span>👁 Salt okunur kopya</span>' +
      (t ? '<b>' + t.slice(8, 10) + '.' + t.slice(5, 7) + '.' + t.slice(0, 4) +
           ' ' + t.slice(11, 16) + '</b>' : '');
    document.body.appendChild(d);
    document.body.classList.add('salt-okunur');
  }

  function programiBaslat() {
    if (window.Veri.motorSec) window.Veri.motorSec();
    saltOkunurSerit();
    // Gezinme
    Array.prototype.forEach.call(document.querySelectorAll('.gezinme [data-sekme]'), function (b) {
      b.onclick = function () { window.Git.sekme(b.dataset.sekme); };
    });
    document.getElementById('yeniKayit').onclick = function () { window.Formlar.yeniKayitSec(); };
    document.getElementById('geriDugme').onclick = function () { window.Git.geri(); };

    // Esc ile paneli kapat
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') window.panelKapat();
    });

    // Depolama çalışıyor mu?
    if (!window.Veri.motor.calisir()) {
      hataGoster('Tarayıcı veri deposuna yazamıyor',
        'Bu tarayıcıda kayıtlar saklanamaz. Gizli/özel sekmede açtıysan normal sekmede dene. ' +
        'Safari kullanıyorsan Ayarlar → Safari → “Tüm Çerezleri Engelle” kapalı olmalı.');
      return;
    }

    window.Veri.baslat().then(function () {
      window.Git.ciz();
    }).catch(function (e) {
      var m = String(e && e.message || e);
      if (window.Veri.motor.ad === 'bulut') {
        hataGoster('Kayıtlara ulaşılamadı',
          /fetch|network|Failed/i.test(m)
            ? 'İnternet bağlantısı yok. Kayıtların internette saklanıyor, ' +
              'bağlantı gelince açılacak.<br><br>Sayfayı yenilemeyi dene.'
            : m);
      } else {
        hataGoster('Veriler açılamadı', m);
      }
    });

    // Yazma hatası olursa kullanıcıyı uyar (ör. depo doldu)
    window.Veri.dinle(function () {
      if (window.Veri.sonHata) {
        window.bildir('⚠️ Kayıt yazılamadı — hemen yedek al');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    // Sıra: şifreli kopya kilidi → buluta giriş → program
    function devam() {
      if (window.Giris && window.Giris.gerekli()) {
        window.Giris.ekran(function () {
          if (window.Veri.motorSec) window.Veri.motorSec();
          programiBaslat();
        });
      } else {
        programiBaslat();
      }
    }
    if (window.Kilit && window.Kilit.gerekli()) window.Kilit.sor(devam);
    else devam();
  });
})();
</script>
