      var sr = satirlar().filter(function (r) { return r.kg > 0 || r.tutar > 0 || r.satici; });
      if (!sr.length) return hata('En az bir tüccar alımı gir');
      var eksik = sr.filter(function (r) { return !(r.kg > 0) || !(r.birimFiyat > 0); });
      if (eksik.length) return hata(eksik.length + ' satırda kilo veya fiyat eksik');

      var kayit = {
        tarih: deger('f_tarih') || bugun(),
        kod: deger('f_kod') || V.yeniPartiKodu(),
        bolge: deger('f_bolge'),
        not: deger('f_not'),
        alimlar: sr.map(function (r, n) {
          return {
            id: (id || 'a') + '-' + (n + 1),
            satici: r.satici, kg: r.kg, birimFiyat: r.birimFiyat, tutar: r.tutar,
            odemeDurumu: r.odemeDurumu, odenen: r.odenen
          };
        })
      };
      if (k) V.guncelle('partiler', id, kayit); else V.ekle('partiler', kayit);
      tamamla(k ? 'Parti güncellendi' : sr.length + ' alım kaydedildi');
    };

    var sb = $('[data-sil]', p);
    if (sb) sb.onclick = function () {
      A.onayla('Partiyi sil', 'Bu parti ve içindeki tüm alım satırları silinecek.', 'Sil', function () {
        V.sil('partiler', id); A.bildir('Silindi'); Git.ciz();
      }, true);
    };

    A.sayiAlanlariniBagla(p, ipuclari);
    tazele();

    // Yeni alımda imleç doğrudan ilk tüccar adına düşsün — hiç tıklamadan yazmaya başla
    if (!k) {
      var ilkSatir = el('satirlar').firstElementChild;
      if (ilkSatir) odakla('s_ad' + satirNo(ilkSatir));
    }
  }

  /* ============================================================
     MASRAF
     ============================================================ */
  function formMasraf(id, onSecili) {
    var k = id ? V.bul('masraflar', id) : null;
    var veri = V.hepsi();
    var kasa = H.kasa(veri);
    var partiler = H.partiListesi(veri).sort(function (a, b) {
      return (b.tarih || '').localeCompare(a.tarih || '');
    });
    if (!partiler.length) {
      return A.panelAc('Masraf', '<div class="bos-durum"><div class="simge">📦</div>' +
        '<p>Masraf ekleyebilmek için önce bir parti (alım) kaydetmelisin.<br>' +
        'Masraflar partilere dağıtılır — maliyet hesabı böyle çalışır.</p></div>');
    }
    var secili = k ? (k.partiIds || []) : (onSecili ? [onSecili] : []);

    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
        alan({ id: 'f_kategori', etiket: 'Kategori', tip: 'secim',
               secenekler: MASRAF_KATEGORILERI, deger: k ? k.kategori : 'Nakliye' }) +
      '</div>' +
      '<div class="alan"><label>Para birimi</label><div class="secim-satir">' +
        [['TMN', 'Tümen'], ['USD', 'Dolar']].map(function (d) {
          return '<label><input type="radio" name="pb" value="' + d[0] + '"' +
            ((k ? k.paraBirimi : 'TMN') === d[0] ? ' checked' : '') + '><span>' + d[1] + '</span></label>';
        }).join('') + '</div>' +
        '<div class="ipucu">Gümrük/navlun gibi doğrudan dolarla ödediğin masraflar için Dolar seç — ' +
        'Tümen kasasına dokunmaz.</div></div>' +
      alan({ id: 'f_tutar', etiket: 'Tutar', tip: 'sayi', deger: k ? k.tutar : '', yerTutucu: '80.000.000' }) +
      alan({ id: 'f_aciklama', etiket: 'Açıklama', deger: k ? k.aciklama : '',
             yerTutucu: 'örn. depodan elemeye kamyon' }) +
      '<div class="alan"><label>Hangi partiye ait?</label>' +
        '<div class="kart"><ul class="liste" id="partiListesi">' +
        partiler.map(function (pp) {
          return '<li style="cursor:pointer" data-secparti="' + pp.id + '">' +
            '<input type="checkbox" style="width:21px;height:21px;accent-color:var(--vurgu)" ' +
            'value="' + pp.id + '"' + (secili.indexOf(pp.id) !== -1 ? ' checked' : '') + '>' +
            '<div class="sol"><div class="ana">' + kacir(pp.kod) + '</div>' +
            '<div class="yan">' + A.tarihGoster(pp.tarih) + (pp.satici ? ' · ' + kacir(pp.satici) : '') +
            ' · ' + KG(pp.hamKg) + '</div></div></li>';
        }).join('') + '</ul></div>' +
        '<div class="ipucu" id="dagitimIpucu"></div></div>' +
      '<div class="alan" id="dagitimAlani" style="display:none"><label>Nasıl bölüşülsün?</label>' +
        '<div class="secim-satir">' +
        [['kg', 'Kilo oranına göre'], ['esit', 'Eşit böl']].map(function (d) {
          return '<label><input type="radio" name="dagitim" value="' + d[0] + '"' +
            ((k ? k.dagitim : 'kg') === d[0] ? ' checked' : '') + '><span>' + d[1] + '</span></label>';
        }).join('') + '</div></div>';

    var p = A.panelAc(k ? 'Masrafı düzenle' : 'Masraf ekle', govde, ayak(!!k));

    function secililer() {
      return Array.prototype.slice.call(p.querySelectorAll('#partiListesi input:checked'))
        .map(function (c) { return c.value; });
    }
    function tazele() {
      var s = secililer();
      el('dagitimAlani').style.display = s.length > 1 ? '' : 'none';
      var ip = el('dagitimIpucu');
      if (!s.length) { ip.className = 'ipucu hata'; ip.textContent = 'En az bir parti seç'; }
      else if (s.length === 1) { ip.className = 'ipucu'; ip.textContent = 'Masrafın tamamı bu partiye yazılacak.'; }
      else {
        ip.className = 'ipucu vurgulu';
        ip.textContent = s.length + ' parti seçildi — masraf aralarında bölüşülecek.';
      }
    }
    Array.prototype.forEach.call(p.querySelectorAll('[data-secparti]'), function (li) {
      li.onclick = function (e) {
        var c = li.querySelector('input');
        if (e.target !== c) c.checked = !c.checked;
        tazele();
      };
    });
    tazele();

    bagla(p, !!k, 'masraflar', id, function () {
      var tutar = sayi('f_tutar');
      var s = secililer();
      if (tutar <= 0) return hata('Tutarı gir');
      if (!s.length) return hata('En az bir parti seç');
      var kayit = {
        tarih: deger('f_tarih') || bugun(),
        kategori: deger('f_kategori'),
        paraBirimi: ($('input[name=pb]:checked', p) || {}).value || 'TMN',
        tutar: tutar,
        aciklama: deger('f_aciklama'),
        partiIds: s,
        dagitim: ($('input[name=dagitim]:checked', p) || {}).value || 'kg'
      };
      if (k) V.guncelle('masraflar', id, kayit); else V.ekle('masraflar', kayit);
      tamamla(k ? 'Masraf güncellendi' : 'Masraf eklendi');
    }, {
      __hepsi: function () {
        var t = sayi('f_tutar');
        var pb = ($('input[name=pb]:checked', p) || {}).value || 'TMN';
        var ip = el('f_tutar_ipucu');
        if (t > 0) {
          ip.className = 'ipucu vurgulu';
          ip.innerHTML = pb === 'USD' ? U(t)
            : Tk(t) + (kasa.ortKur > 0 ? ' ≈ ' + U(t / kasa.ortKur) : '');
        } else { ip.className = 'ipucu'; ip.innerHTML = ''; }
      }
    });
    Array.prototype.forEach.call(p.querySelectorAll('input[name=pb]'), function (r) {
      r.onchange = function () { A.sayiAlanlariniBagla(p, {}); el('f_tutar').dispatchEvent(new Event('input')); };
    });
  }

  /* ============================================================
     PARTİ GİDERLERİ — hepsi tek ekranda

     Nakliye, hammaliye, çuval her partide mutlaka oluşur. Tek tek
     masraf kaydı açmak yerine hepsini burada doldurursun; program
     eksik kalanı kırmızı gösterir.
     ============================================================ */
  function formGiderler(partiId) {
    var veri = V.hepsi();
    var kasa = H.kasa(veri);
    var o = H.parti(veri, partiId);
    if (!o) return;
    var gd = o.giderDurumu;
    var kalemAd = {};   // alan kimliği → satır

    function satirHtml(r, n) {
      var kimlik = 'g_' + n;
      kalemAd[kimlik] = r;

      var rozet = r.durum === 'girildi' ? '<span class="rozet arti">girildi</span>'
        : r.durum === 'eksik' ? '<span class="rozet eksi">eksik</span>'
        : r.durum === 'beklemede' ? '<span class="rozet uyari">eleme bekliyor</span>' : '';

      var giris;
      if (r.kaynak === 'eleme') {
        var birim = o.girenKg > 0 ? r.tumen / o.girenKg : 0;
        giris = '<div class="gider-sabit">' +
          (r.tumen > 0
            ? A.T(r.tumen) + (birim > 0
                ? '<span style="font-weight:500;color:var(--metin3)"> · ' +
                  n0(birim) + ' T/kg</span>' : '')
            : 'eleme kaydına girilir') +
          '</div>' +
          (r.tumen > 0 ? '' :
            '<button type="button" class="dugme kucuk" data-elemeye="1">Eleme kaydını aç</button>');
      } else if (!r.duzenlenebilir) {
        giris = '<div class="gider-sabit">' + A.T(r.tumen) + '</div>' +
          '<div class="ipucu">' +
            (r.paylasimli ? 'Birden çok partiye dağıtılmış — Masraflar ekranından düzenlenir.'
                          : r.adet + ' ayrı kayıt var — Masraflar ekranından düzenlenir.') +
          '</div>';
      } else {
        giris = '<div class="onek">' +
          '<input type="text" inputmode="decimal" data-sayi id="' + kimlik + '" ' +
            'placeholder="0" value="' + (r.tumen > 0 ? Math.round(r.tumen) : '') + '">' +
          '<span class="birim">T</span></div>' +
          '<div class="ipucu" id="' + kimlik + '_ipucu"></div>';
      }

      return '<div class="gider-satir' + (r.durum === 'eksik' ? ' eksik' : '') + '" data-kalem="' + n + '">' +
        '<div class="gider-tepe">' +
          '<span class="gider-simge">' + r.simge + '</span>' +
          '<span class="gider-ad">' + kacir(r.ad) +
            (r.zorunlu ? '<span class="gider-zorunlu">zorunlu</span>' : '') + '</span>' +
          rozet +
        '</div>' + giris + '</div>';
    }

    var zorunluSatirlar = gd.satirlar.filter(function (r) { return r.zorunlu; });
    var digerSatirlar = gd.satirlar.filter(function (r) { return !r.zorunlu; });
    var n = 0;

    var govde =
      '<div class="gider-baslik">' +
        '<div><b>' + kacir(o.parti.kod) + '</b> · ' + kgTam(o.hamKg) +
          (o.parti.bolge ? ' · ' + kacir(o.parti.bolge) : '') + '</div>' +
        '<div class="kucuk-yazi">Alım ' + A.T(o.parti.tutar) + '</div>' +
      '</div>' +
      '<h2 class="bolum">Zorunlu giderler</h2>' +
      zorunluSatirlar.map(function (r) { return satirHtml(r, n++); }).join('') +
      '<h2 class="bolum">Diğer giderler</h2>' +
      digerSatirlar.map(function (r) { return satirHtml(r, n++); }).join('') +
      '<div id="giderOzet"></div>';

    var p = A.panelAc('Parti giderleri', govde,
      '<button class="dugme ana" type="button" data-kaydet>Kaydet</button>');

    $('[data-elemeye]', p) && ($('[data-elemeye]', p).onclick = function () {
      A.panelKapat();
      ac('eleme', partiId);
    });

    function tazele() {
      var toplam = 0, eksikSayisi = 0, bekleyen = 0;
      Object.keys(kalemAd).forEach(function (kimlik) {
        var r = kalemAd[kimlik];
        var v = el(kimlik) ? sayi(kimlik) : r.tumen;
        toplam += v;
        var satir = p.querySelector('[data-kalem="' + kimlik.slice(2) + '"]');
        if (r.zorunlu && v <= 0 && r.durum === 'beklemede') bekleyen++;
        if (r.zorunlu && v <= 0 && r.durum !== 'beklemede') {
          eksikSayisi++;
          if (satir) satir.classList.add('eksik');
        } else if (satir) satir.classList.remove('eksik');
        var ip = el(kimlik + '_ipucu');
        if (ip) {
          ip.className = v > 0 ? 'ipucu vurgulu' : 'ipucu';
          ip.innerHTML = v > 0
            ? A.Tk(v) + (kasa.ortKur > 0 ? ' ≈ ' + A.U(v / kasa.ortKur) : '')
            : (r.zorunlu ? 'Girilmezse maliyet olduğundan düşük çıkar' : '');
        }
      });

      var alimT = o.parti.tutar;
      el('giderOzet').innerHTML =
        '<div class="sonuc-kutu" style="margin-top:16px">' +
        '<div class="baslik">Toplam gider</div>' +
        '<div class="buyuk" style="font-size:24px">' + A.Tk(toplam) + '</div>' +
        '<div class="yan">' + A.T(toplam) +
          (kasa.ortKur > 0 ? ' ≈ ' + A.U(toplam / kasa.ortKur) : '') + '</div>' +
        '<div class="not">' +
          (alimT > 0 ? 'Alımın <b>' + A.yuzde(toplam / alimT, 1) + '</b>\u0027i kadar gider' : '') +
          (eksikSayisi
            ? '<br><b style="color:var(--eksi)">' + eksikSayisi +
              ' zorunlu gider girilmedi — maliyet eksik hesaplanır</b>'
            : bekleyen
              ? '<br><b style="color:var(--uyari)">✓ Buradan girilecekler tamam · ' +
                'eleme ücreti, eleme kaydını girdiğinde eklenecek</b>'
              : '<br><b style="color:var(--arti)">✓ Tüm zorunlu giderler girildi</b>') +
        '</div></div>';
    }

    $('[data-kaydet]', p).onclick = function () {
      var eklendi = 0, silindi = 0, guncellendi = 0;
      Object.keys(kalemAd).forEach(function (kimlik) {
        var r = kalemAd[kimlik];
        if (!el(kimlik)) return;              // düzenlenemeyen satır
        var v = sayi(kimlik);
        if (v > 0 && r.kayitId) {
          if (Math.round(v) !== Math.round(r.tumen)) {
            V.guncelle('masraflar', r.kayitId, { tutar: v }); guncellendi++;
          }
        } else if (v > 0) {
          V.ekle('masraflar', {
            tarih: o.parti.tarih || bugun(), kategori: r.ad, paraBirimi: 'TMN',
            tutar: v, aciklama: '', partiIds: [partiId], dagitim: 'kg'
          });
          eklendi++;
        } else if (r.kayitId) {
          V.sil('masraflar', r.kayitId); silindi++;
        }
      });
      var mesaj = eklendi + guncellendi > 0
        ? 'Giderler kaydedildi'
        : (silindi ? silindi + ' gider silindi' : 'Değişiklik yok');
      tamamla(mesaj);
    };

    A.sayiAlanlariniBagla(p, { __hepsi: tazele });
    tazele();
  }

  /* ============================================================
     ELEME — programın en kritik girişi
     ============================================================ */
  function formEleme(id, onSecili) {
    var k = id ? V.bul('elemeler', id) : null;
    var veri = V.hepsi();
    var kasa2 = H.kasa(veri);
    var partiler = H.partiListesi(veri).sort(function (a, b) {
      return (b.tarih || '').localeCompare(a.tarih || '');
    });
    if (!partiler.length) {
      return A.panelAc('Eleme', '<div class="bos-durum"><div class="simge">📦</div>' +
        '<p>Önce bir parti (alım) kaydetmelisin.</p></div>');
    }
    /* Her partide elemeye gönderilmeyi bekleyen ham mal.
       Mevcut kayıt düzenleniyorsa kendi miktarı da tekrar kullanılabilir. */
    var kalanHam = {};
    H.tumPartiler(veri).forEach(function (o) {
      kalanHam[o.parti.id] = o.elenmemisKg +
        (k && k.partiId === o.parti.id ? (Number(k.girenKg) || 0) : 0);
    });

    // Elenecek malı olan parti varsa varsayılan olarak onu seç
    var haziOlan = partiler.filter(function (pp) { return (kalanHam[pp.id] || 0) > 0.5; });
    var secilenParti = k ? k.partiId
      : (onSecili || (haziOlan.length ? haziOlan[0].id : partiler[0].id));
    var tamamlandi = k ? k.tamamlandi !== false : true;

    /* Eleme genelde kilo başına fiyatlanır — varsayılan giriş şekli bu.
       Kayıtta toplam tutar saklanır, motor tarafı hiç değişmez. */
    var ucretTipi = k ? (k.ucretTipi || 'toplam') : 'kg';
    var ucretBaslangic = '';
    if (k) {
      if (ucretTipi === 'kg') {
        ucretBaslangic = Math.round(k.ucretBirim ||
          (Number(k.girenKg) > 0 ? Number(k.ucret) / Number(k.girenKg) : 0)) || '';
      } else {
        ucretBaslangic = Math.round(Number(k.ucret) || 0) || '';
      }
    }

    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
        alan({ id: 'f_parti', etiket: 'Parti', tip: 'secim', deger: secilenParti,
               secenekler: partiler.map(function (pp) {
                 var kalan = kalanHam[pp.id] || 0;
                 return { deger: pp.id,
                          ad: pp.kod + ' — ' + (kalan > 0.5 ? kgTam(kalan) + ' hazır' : 'ham mal yok') };
               }) }) +
      '</div>' +
      '<div class="alan">' +
        '<label for="f_giren">Elemeye giren miktar</label>' +
        '<div class="onek">' +
          '<input type="text" inputmode="decimal" data-sayi id="f_giren" autocomplete="off" ' +
            'placeholder="10.000" value="' + (k ? k.girenKg : '') + '">' +
          '<span class="birim">kg</span>' +
        '</div>' +
        '<button type="button" class="tumu-dugme" id="tumuGonder">' +
          '<span class="tumu-sol">Tümünü elemeye gönder</span>' +
          '<span class="tumu-kg" id="tumuKg">—</span>' +
        '</button>' +
        '<div class="ipucu" id="f_giren_ipucu"></div>' +
      '</div>' +
      '<div class="alan-grubu"><div class="onay-satir">' +
        '<input type="checkbox" id="f_tamam"' + (tamamlandi ? ' checked' : '') + '>' +
        '<label for="f_tamam">Eleme bitti, sonuçlar belli</label></div>' +
        '<div id="sonucAlanlari">' +
          alan({ id: 'f_ust', etiket: '8mm üstü (ihracatlık)', tip: 'sayi', birim: 'kg',
                 deger: k ? k.ustKg : '', yerTutucu: '8.200' }) +
          alan({ id: 'f_alt', etiket: '8mm altı (İran\'da satılacak)', tip: 'sayi', birim: 'kg',
                 deger: k ? k.altKg : '', yerTutucu: '1.400' }) +
          alan({ id: 'f_fire', etiket: 'Fire (taş, toprak — değersiz)', tip: 'sayi', birim: 'kg',
                 deger: k ? k.fireKg : '', yerTutucu: '400' }) +
        '</div>' +
      '</div>' +
      '<div id="denetim"></div>' +
      '<div class="alan">' +
        '<label>Eleme ücreti</label>' +
        '<div class="secim-satir" style="margin-bottom:9px">' +
          [['kg', 'Kilo başına'], ['toplam', 'Toplam tutar']].map(function (t) {
            return '<label><input type="radio" name="ucretTipi" value="' + t[0] + '"' +
              (ucretTipi === t[0] ? ' checked' : '') + '><span>' + t[1] + '</span></label>';
          }).join('') +
        '</div>' +
        '<div class="onek">' +
          '<input type="text" inputmode="decimal" data-sayi id="f_ucret" autocomplete="off" ' +
            'value="' + (ucretBaslangic || '') + '" placeholder="6.000">' +
          '<span class="birim" id="f_ucret_birim">T/kg</span>' +
        '</div>' +
        '<div class="ipucu" id="f_ucret_ipucu"></div>' +
      '</div>' +
      alan({ id: 'f_not', etiket: 'Not', deger: k ? k.not : '' });

    var p = A.panelAc(k ? 'Eleme kaydını düzenle' : 'Eleme kaydı', govde, ayak(!!k));

    function tamamMi() { return el('f_tamam').checked; }
    el('f_tamam').onchange = function () { tazele(); };

    function kalanKg() { return kalanHam[deger('f_parti')] || 0; }

    /* Tek dokunuşla o partide bekleyen tüm ham malı elemeye gönder */
    el('tumuGonder').onclick = function () {
      var kalan = kalanKg();
      if (kalan <= 0.5) return hata('Bu partide elenmemiş ham mal kalmamış');
      var g = el('f_giren');
      g.value = n0(kalan);
      g.dispatchEvent(new Event('input', { bubbles: true }));
      g.focus();
    };

    function tazele() {
      /* --- "tümü" düğmesi ve kalan ham mal bilgisi --- */
      var kalan = kalanKg();
      var girenSimdi = sayi('f_giren');
      el('tumuKg').textContent = kalan > 0.5 ? kgTam(kalan) : 'yok';
      el('tumuGonder').disabled = kalan <= 0.5;
      el('tumuGonder').classList.toggle('pasif', kalan <= 0.5);
      el('tumuGonder').classList.toggle('secili', kalan > 0.5 && Math.abs(girenSimdi - kalan) < 0.5);
      var gip = el('f_giren_ipucu');
      if (girenSimdi > kalan + 0.5) {
        gip.className = 'ipucu hata';
        gip.innerHTML = '⚠️ Bu partide elenmemiş sadece ' + kgTam(kalan) + ' ham mal var.';
      } else if (kalan <= 0.5) {
        gip.className = 'ipucu';
        gip.innerHTML = 'Bu partinin ham malının tamamı elemeye gönderilmiş.';
      } else {
        gip.className = 'ipucu';
        gip.innerHTML = 'Depoda ' + kgTam(kalan) + ' ham mal bekliyor' +
          (girenSimdi > 0.5 && kalan - girenSimdi > 0.5
            ? ' · bunu gönderirsen ' + kgTam(kalan - girenSimdi) + ' kalır' : '');
      }

      /* --- eleme ücreti: kilo başına ↔ toplam --- */
      var tip = (($('input[name=ucretTipi]:checked', p) || {}).value) || 'kg';
      var ucretGirilen = sayi('f_ucret');
      var girenKg = sayi('f_giren');
      var ucretToplam = tip === 'kg' ? ucretGirilen * girenKg : ucretGirilen;
      el('f_ucret_birim').textContent = tip === 'kg' ? 'T/kg' : 'T';
      var uip = el('f_ucret_ipucu');
      // Alım fiyatından pahalı eleme gerçekçi değil — büyük ihtimalle
      // toplam tutar yanlışlıkla "kilo başına" alanına yazılmıştır.
      var seciliP = partiler.find(function (x) { return x.id === deger('f_parti'); });
      var alimFiyat = seciliP ? seciliP.birimFiyat : 0;
      var sacma = tip === 'kg' && alimFiyat > 0 && ucretGirilen > alimFiyat;

      if (sacma) {
        uip.className = 'ipucu hata';
        uip.innerHTML = '⚠️ Kilo başına ' + n0(ucretGirilen) + ' T, nohudun alım fiyatından ' +
          '(' + n0(alimFiyat) + ' T/kg) pahalı. Toplam tutarı buraya yazmış olabilirsin — ' +
          'öyleyse yukarıdan <b>Toplam tutar</b>\u0027ı seç.';
      } else if (ucretGirilen > 0) {
        uip.className = 'ipucu vurgulu';
        if (tip === 'kg') {
          uip.innerHTML = girenKg > 0
            ? n0(ucretGirilen) + ' T/kg × ' + kgTam(girenKg) + ' = <b>' + A.T(ucretToplam) + '</b>' +
              (kasa2.ortKur > 0 ? ' ≈ ' + A.U(ucretToplam / kasa2.ortKur) : '')
            : 'Giren miktarı yaz, toplam kendiliğinden çıkar';
        } else {
          uip.innerHTML = A.Tk(ucretToplam) +
            (girenKg > 0 ? ' — kilo başına <b>' + n0(ucretToplam / girenKg) + ' T/kg</b>' : '') +
            (kasa2.ortKur > 0 ? ' ≈ ' + A.U(ucretToplam / kasa2.ortKur) : '');
        }
      } else {
        uip.className = 'ipucu';
        uip.innerHTML = tip === 'kg'
          ? 'Elemeciye kilo başına ödediğin fiyat'
          : 'Eleme için ödediğin toplam tutar';
      }

      var t = tamamMi();
      el('sonucAlanlari').style.display = t ? '' : 'none';
      var giren = sayi('f_giren'), ust = sayi('f_ust'), alt = sayi('f_alt'), fire = sayi('f_fire');
      var d = el('denetim');
      if (!t) {
        d.innerHTML = giren > 0
          ? '<div class="uyari-serit"><span class="simge">⏳</span><div>' +
            '<b>' + kgTam(giren) + ' elemede görünecek</b>' +
            'Sonuçlar gelince bu kaydı açıp rakamları yaz.</div></div>'
          : '';
        return;
      }
      if (giren <= 0 || (ust + alt + fire) <= 0) { d.innerHTML = ''; return; }
      var dn = H.elemeDenetim(giren, ust, alt, fire);
      var rand = ust / giren;
      var h = '';
      if (dn.uyari) {
        h += '<div class="uyari-serit kotu"><span class="simge">⚠️</span><div>' +
          '<b>Rakamlar tutmuyor</b>Giren ' + kgTam(giren) + ', çıkan toplam ' + kgTam(dn.cikan) +
          ' — arada <b>' + kgTam(Math.abs(dn.fark)) + '</b> ' +
          (dn.fark > 0 ? 'eksik' : 'fazla') + ' var.</div></div>';
      }
      h += '<div class="kart" style="margin-top:10px"><div class="kart-ic">' +
        '<div class="satir-arasi" style="margin-bottom:8px">' +
        '<span class="kucuk-yazi">Sonuç</span>' +
        '<span class="rozet ' + (rand >= 0.8 ? 'arti' : rand >= 0.7 ? 'uyari' : 'eksi') + '">randıman ' +
        yuzde(rand) + '</span></div>' +
        '<div class="randiman-cubuk">' +
          (ust > 0 ? '<div class="r-ust" style="flex:' + ust + '">' + (ust / dn.cikan > .12 ? yuzde(ust / dn.cikan, 0) : '') + '</div>' : '') +
          (alt > 0 ? '<div class="r-alt" style="flex:' + alt + '">' + (alt / dn.cikan > .12 ? yuzde(alt / dn.cikan, 0) : '') + '</div>' : '') +
          (fire > 0 ? '<div class="r-fire" style="flex:' + fire + '">' + (fire / dn.cikan > .12 ? yuzde(fire / dn.cikan, 0) : '') + '</div>' : '') +
        '</div>' +
        '<div class="randiman-aciklama">' +
          '<span><i style="background:#2f7d55"></i>8mm+ ' + kgTam(ust) + '</span>' +
          '<span><i style="background:#b78a3c"></i>8mm− ' + kgTam(alt) + '</span>' +
          '<span><i style="background:#9a948a"></i>fire ' + kgTam(fire) + '</span>' +
        '</div></div></div>';
      d.innerHTML = h;
    }

    bagla(p, !!k, 'elemeler', id, function () {
      var giren = sayi('f_giren');
      if (giren <= 0) return hata('Elemeye giren miktarı gir');
      var t = tamamMi();
      var kayit = {
        tarih: deger('f_tarih') || bugun(),
        partiId: deger('f_parti'),
        girenKg: giren,
        tamamlandi: t,
        ustKg: t ? sayi('f_ust') : 0,
        altKg: t ? sayi('f_alt') : 0,
        fireKg: t ? sayi('f_fire') : 0,
        ucretTipi: (($('input[name=ucretTipi]:checked', p) || {}).value) || 'kg',
        ucretBirim: 0,
        ucret: 0,
        not: deger('f_not')
      };
      if (kayit.ucretTipi === 'kg') {
        kayit.ucretBirim = sayi('f_ucret');
        kayit.ucret = kayit.ucretBirim * giren;
      } else {
        kayit.ucret = sayi('f_ucret');
        kayit.ucretBirim = giren > 0 ? kayit.ucret / giren : 0;
      }
      if (t && (kayit.ustKg + kayit.altKg + kayit.fireKg) <= 0) {
        return hata('Eleme sonuçlarını gir (ya da "eleme bitti" işaretini kaldır)');
      }
      if (k) V.guncelle('elemeler', id, kayit); else V.ekle('elemeler', kayit);
      tamamla(k ? 'Eleme güncellendi' : 'Eleme kaydedildi');
    }, { __hepsi: tazele });
  }

  /* ============================================================
     8MM ALTI SATIŞI
     ============================================================ */
  function formAltSatis(id, onSecili) {
    var k = id ? V.bul('altSatislar', id) : null;
    var veri = V.hepsi();
    var kasa = H.kasa(veri);
    var ozetler = H.tumPartiler(veri).filter(function (o) {
      return o.altStokKg > 0.5 || (k && k.partiId === o.parti.id);
    });
    if (!ozetler.length) {
      return A.panelAc('8mm altı satışı', '<div class="bos-durum"><div class="simge">🪙</div>' +
        '<p>Satılabilir 8mm altı nohut görünmüyor.<br>' +
        'Önce bir eleme kaydı gir — 8mm altı oradan depoya girer.</p></div>');
    }
    var secilen = k ? k.partiId : (onSecili || ozetler[0].parti.id);
    var stokHar = {};
    ozetler.forEach(function (o) { stokHar[o.parti.id] = o.altStokKg + (k && k.partiId === o.parti.id ? k.kg : 0); });

    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
        alan({ id: 'f_parti', etiket: 'Hangi partiden', tip: 'secim', deger: secilen,
               secenekler: ozetler.map(function (o) {
                 return { deger: o.parti.id, ad: o.parti.kod + ' — ' + kgTam(stokHar[o.parti.id]) + ' var' };
               }) }) +
      '</div>' +
      alan({ id: 'f_kg', etiket: 'Satılan miktar', tip: 'sayi', birim: 'kg',
             deger: k ? k.kg : '', yerTutucu: '1.400' }) +
      alan({ id: 'f_fiyat', etiket: 'Birim fiyat', tip: 'sayi', birim: 'T/kg',
             deger: k ? k.birimFiyat : '', yerTutucu: '250.000' }) +
      alan({ id: 'f_tutar', etiket: 'Toplam gelir', tip: 'sayi', birim: 'T', deger: k ? k.tutar : '' }) +
      alan({ id: 'f_alici', etiket: 'Alıcı', deger: k ? k.alici : '', yerTutucu: 'örn. Tahran alıcı' }) +
      '<div class="uyari-serit"><span class="simge">💡</span><div>' +
      '<b>Bu gelir maliyeti düşürür</b>Buraya girdiğin tutar, o partinin 8mm üstü malının ' +
      'maliyetinden otomatik düşülür — gerçek maliyet böyle çıkar.</div></div>';

    var p = A.panelAc(k ? '8mm altı satışını düzenle' : '8mm altı satışı', govde, ayak(!!k));

    var elleTutar = false;
    el('f_tutar').addEventListener('input', function () { elleTutar = true; });
    ['f_kg', 'f_fiyat'].forEach(function (a) {
      el(a).addEventListener('input', function () { elleTutar = false; });
    });

    bagla(p, !!k, 'altSatislar', id, function () {
      var kg = sayi('f_kg'), tutar = sayi('f_tutar');
      if (kg <= 0) return hata('Satılan miktarı gir');
      if (tutar <= 0) return hata('Toplam geliri gir');
      var kayit = {
        tarih: deger('f_tarih') || bugun(), partiId: deger('f_parti'),
        kg: kg, birimFiyat: sayi('f_fiyat') || (tutar / kg), tutar: tutar, alici: deger('f_alici')
      };
      if (k) V.guncelle('altSatislar', id, kayit); else V.ekle('altSatislar', kayit);
      tamamla(k ? 'Satış güncellendi' : 'Satış kaydedildi');
    }, {
      __hepsi: function () {
        var kg = sayi('f_kg'), fiyat = sayi('f_fiyat');
        if (!elleTutar && kg > 0 && fiyat > 0) el('f_tutar').value = n0(kg * fiyat);
        var tutar = sayi('f_tutar');
        var ip = el('f_tutar_ipucu');
        ip.innerHTML = tutar > 0 ? Tk(tutar) + (kasa.ortKur > 0 ? ' ≈ ' + U(tutar / kasa.ortKur) : '') : '';
        ip.className = tutar > 0 ? 'ipucu vurgulu' : 'ipucu';

        var stok = stokHar[deger('f_parti')] || 0;
        var ipk = el('f_kg_ipucu');
        if (kg > stok + 0.5) {
          ipk.className = 'ipucu hata';
          ipk.innerHTML = '⚠️ Bu partide sadece ' + kgTam(stok) + ' 8mm altı var.';
        } else {
          ipk.className = 'ipucu';
          ipk.innerHTML = 'Depoda ' + kgTam(stok) + ' var.';
        }
      }
    });
  }

  /* ============================================================
     SEVKİYAT
     ============================================================ */
  function formSevkiyat(id) {
    var k = id ? V.bul('sevkiyatlar', id) : null;
    var veri = V.hepsi();
    var mevcut = {};
    (k ? (k.kalemler || []) : []).forEach(function (kl) { mevcut[kl.partiId] = kl.kg; });

    var ozetler = H.tumPartiler(veri).filter(function (o) {
      return o.ustStokKg > 0.5 || mevcut[o.parti.id];
    });
    if (!ozetler.length) {
      return A.panelAc('Sevkiyat', '<div class="bos-durum"><div class="simge">🚚</div>' +
        '<p>Yüklenecek 8mm üstü mal görünmüyor.<br>Önce eleme kaydı gir.</p></div>');
    }

    var no = k ? k.no : 'SV-' + String((veri.sevkiyatlar || []).length + 1).padStart(3, '0');
    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_no', etiket: 'Sevkiyat no', deger: no }) +
        alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
      '</div>' +
      '<div class="ikili">' +
        alan({ id: 'f_plaka', etiket: 'Kamyon / plaka', deger: k ? k.plaka : '' }) +
        alan({ id: 'f_sofor', etiket: 'Şoför', deger: k ? k.sofor : '' }) +
      '</div>' +
      alan({ id: 'f_alici', etiket: 'Alıcı / varış', deger: k ? k.alici : '' }) +
      '<div class="alan"><label>Durum</label><div class="secim-satir">' +
        SEVKIYAT_DURUMLARI.map(function (d) {
          return '<label><input type="radio" name="durum" value="' + d + '"' +
            ((k ? k.durum : 'Hazırlanıyor') === d ? ' checked' : '') + '><span>' + d + '</span></label>';
        }).join('') + '</div></div>' +
      '<div class="alan"><label>Hangi partiden ne kadar yüklendi?</label>' +
        '<div class="ipucu" style="margin-bottom:8px">Yüklemediğin partileri boş bırak.</div>' +
        ozetler.map(function (o) {
          var stok = o.ustStokKg + (mevcut[o.parti.id] || 0);
          return '<div class="alan" style="margin-bottom:11px">' +
            '<label style="display:flex;justify-content:space-between">' +
            '<span>' + kacir(o.parti.kod) + (o.parti.satici ? ' · ' + kacir(o.parti.satici) : '') + '</span>' +
            '<span style="color:var(--metin3);font-weight:400">' + kgTam(stok) + ' var · ' +
            A.nAkilli(o.usdTon) + ' $/t</span></label>' +
            '<div class="onek"><input type="text" inputmode="decimal" data-sayi ' +
            'id="kl_' + o.parti.id + '" data-stok="' + stok + '" ' +
            'value="' + (mevcut[o.parti.id] || '') + '" placeholder="0">' +
            '<span class="birim">kg</span></div>' +
            '<div class="ipucu" id="kl_' + o.parti.id + '_ipucu"></div></div>';
        }).join('') +
      '</div>' +
      '<div id="sevkOzet"></div>' +
      alan({ id: 'f_satis', etiket: 'Satış fiyatı (varsa)', tip: 'sayi', birim: '$/t',
             deger: k ? k.satisUsdTon : '', ipucu: 'Girersen kâr hesaplanır.' });

    var p = A.panelAc(k ? 'Sevkiyatı düzenle' : 'Yeni sevkiyat', govde, ayak(!!k));

    function kalemler() {
      var s = [];
      ozetler.forEach(function (o) {
        var v = sayi('kl_' + o.parti.id);
        if (v > 0) s.push({ partiId: o.parti.id, kg: v, ozet: o });
      });
      return s;
    }

    function tazele() {
      var s = kalemler();
      var kg = 0, usd = 0, asim = false;
      s.forEach(function (x) {
        kg += x.kg; usd += x.ozet.birimUsd * x.kg;
        var stok = x.ozet.ustStokKg + (mevcut[x.partiId] || 0);
        var ip = el('kl_' + x.partiId + '_ipucu');
        if (x.kg > stok + 0.5) {
          asim = true;
          ip.className = 'ipucu hata';
          ip.innerHTML = '⚠️ Depoda sadece ' + kgTam(stok) + ' var.';
        } else {
          ip.className = 'ipucu';
          ip.innerHTML = A.U(x.ozet.birimUsd * x.kg) + ' maliyet';
        }
      });
      ozetler.forEach(function (o) {
        if (sayi('kl_' + o.parti.id) <= 0) {
          var ip = el('kl_' + o.parti.id + '_ipucu');
          if (ip) { ip.className = 'ipucu'; ip.innerHTML = ''; }
        }
      });
      var d = el('sevkOzet');
      if (!kg) { d.innerHTML = ''; return; }
      var satis = sayi('f_satis');
      var maliyetTon = usd / kg * 1000;
      d.innerHTML = '<div class="sonuc-kutu"><div class="baslik">Bu sevkiyat</div>' +
        '<div class="buyuk">' + KG(kg) + '</div>' +
        '<div class="yan">maliyet ' + A.Uton(maliyetTon) + ' / ton — toplam ' + A.U(usd) + '</div>' +
        (satis > 0 ? '<div class="not" style="font-size:14px;font-weight:600;color:' +
          (satis >= maliyetTon ? 'var(--arti)' : 'var(--eksi)') + '">Kâr: ' +
          A.U(satis * kg / 1000 - usd) + ' (' + yuzde((satis - maliyetTon) / maliyetTon, 1) + ')</div>' : '') +
        '</div>';
    }

    bagla(p, !!k, 'sevkiyatlar', id, function () {
      var s = kalemler();
      if (!s.length) return hata('En az bir partiden yükleme miktarı gir');
      var kayit = {
        no: deger('f_no'), tarih: deger('f_tarih') || bugun(),
        plaka: deger('f_plaka'), sofor: deger('f_sofor'), alici: deger('f_alici'),
        durum: ($('input[name=durum]:checked', p) || {}).value || 'Hazırlanıyor',
        kalemler: s.map(function (x) { return { partiId: x.partiId, kg: x.kg }; }),
        satisUsdTon: sayi('f_satis')
      };
      if (k) V.guncelle('sevkiyatlar', id, kayit); else V.ekle('sevkiyatlar', kayit);
      tamamla(k ? 'Sevkiyat güncellendi' : 'Sevkiyat kaydedildi');
    }, { __hepsi: tazele });
  }

  /* ============================================================
     YÖNLENDİRME
     ============================================================ */
  var FORMLAR = {
    transfer: formTransfer, parti: formParti, masraf: formMasraf,
    eleme: formEleme, altSatis: formAltSatis, sevkiyat: formSevkiyat,
    giderler: formGiderler
  };

  function ac(tur, param) {
    var f = FORMLAR[tur];
    if (!f) return;
    // param bir kayıt id'si mi yoksa "bu partiye ekle" mi?
    if (tur === 'giderler') return f(param);
    if ((tur === 'masraf' || tur === 'eleme' || tur === 'altSatis') && param) {
      var kendi = V.bul(tur === 'masraf' ? 'masraflar' : tur === 'eleme' ? 'elemeler' : 'altSatislar', param);
      if (kendi) f(param);
      else f(null, param);          // parti id'si geldi
      return;
    }
    f(param);
  }

  window.Formlar = { ac: ac, yeniKayitSec: yeniKayitSec };
})();
/* ============================================================
   baslat.js — Programı ayağa kaldırır
   ============================================================ */
(function () {
  'use strict';

  // Tema tercihini geri yükle
  try {
    var t = localStorage.getItem('nohut_tema');
    if (t && t !== 'sistem') document.documentElement.setAttribute('data-tema', t);
  } catch (e) { }

  function hataGoster(baslik, mesaj) {
    document.getElementById('uygulama').innerHTML =
      '<div class="sayfa"><div class="uyari-serit kotu"><span class="simge">⚠️</span>' +
      '<div><b>' + baslik + '</b>' + mesaj + '</div></div></div>';
  }

  function programiBaslat() {
    // Gezinme
    Array.prototype.forEach.call(document.querySelectorAll('.gezinme [data-sekme]'), function (b) {
      b.onclick = function () { window.Git.sekme(b.dataset.sekme); };
    });
    document.getElementById('yeniKayit').onclick = function () { window.Formlar.yeniKayitSec(); };
    document.getElementById('geriDugme').onclick = function () { window.Git.geri(); };

    // Esc ile paneli kapat
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') window.panelKapat();
    });

    // Depolama çalışıyor mu?
    if (!window.Veri.motor.calisir()) {
      hataGoster('Tarayıcı veri deposuna yazamıyor',
        'Bu tarayıcıda kayıtlar saklanamaz. Gizli/özel sekmede açtıysan normal sekmede dene. ' +
        'Safari kullanıyorsan Ayarlar → Safari → “Tüm Çerezleri Engelle” kapalı olmalı.');
      return;
    }

    window.Veri.baslat().then(function () {
      window.Git.ciz();
    }).catch(function (e) {
      hataGoster('Veriler açılamadı', String(e && e.message || e));
    });

    // Yazma hatası olursa kullanıcıyı uyar (ör. depo doldu)
    window.Veri.dinle(function () {
      if (window.Veri.sonHata) {
        window.bildir('⚠️ Kayıt yazılamadı — hemen yedek al');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.Kilit && window.Kilit.gerekli()) {
      window.Kilit.sor(programiBaslat);
    } else {
      programiBaslat();
    }
  });
})();
</script>
</body>
</html>
