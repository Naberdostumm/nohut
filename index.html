  var A = window.NohutArayuz, H = window.Hesap, V = window.Veri;
  var n0 = A.n0, T = A.T, Tk = A.Tk, U = A.U, KG = A.KG, kgTam = A.kgTam;
  var yuzde = A.yuzde, kacir = A.kacir, el = A.el, $ = A.$, alan = A.alan;
  var deger = A.deger, sayi = A.sayi, bugun = A.bugun;

  var MASRAF_KATEGORILERI = [
    'Nakliye', 'Hammaliye / işçilik', 'Çuval / big bag', 'Eleme ücreti',
    'Depo kirası', 'Gümrük / evrak', 'Fumigasyon', 'Komisyon / aracı', 'Diğer'
  ];
  var SEVKIYAT_DURUMLARI = ['Hazırlanıyor', 'Yolda', 'Gümrükte', 'Teslim edildi'];

  /* ---------- yeni kayıt seçimi ---------- */
  function yeniKayitSec() {
    var secenekler = [
      ['parti', '📦', 'Alım (Parti)', 'İran\'dan nohut satın aldın'],
      ['eleme', '⚙️', 'Eleme', 'Elemeye gönderdin ya da sonuç geldi'],
      ['masraf', '💸', 'Masraf', 'Nakliye, hammaliye, çuval, gümrük…'],
      ['altSatis', '🪙', '8mm altı satışı', 'İran\'da geri sattığın küçük nohut'],
      ['hamSatis', '🌾', 'Ham satış', 'Elemeden geçmeden sattığın mal'],
      ['transfer', '💵', 'Döviz transferi', 'Dolar gönderip Tümen aldın'],
      ['odeme', '💳', 'Tüccara ödeme', 'Borcunu kapatmak için ödediğin para'],
      ['genelGider', '✈️', 'Genel gider', 'Otel, uçak, yeme içme — mala binmez'],
      ['sevkiyat', '🚚', 'Sevkiyat', 'Kamyona yükleyip yola çıkardın']
    ];
    var p = A.panelAc('Ne kaydedeceksin?',
      '<div class="secim-izgara">' + secenekler.map(function (s) {
        return '<button data-yeni="' + s[0] + '"><span class="simge">' + s[1] + '</span>' +
          '<span class="ad">' + s[2] + '</span>' +
          '<span class="aciklama">' + s[3] + '</span></button>';
      }).join('') + '</div>');
    Array.prototype.forEach.call(p.querySelectorAll('[data-yeni]'), function (b) {
      b.onclick = function () { ac(b.dataset.yeni); };
    });
  }

  /* ---------- ortak: kaydet/sil ayağı ---------- */
  function ayak(duzenleme, silEylem) {
    return (duzenleme ? '<button class="dugme tehlike" type="button" data-sil>Sil</button>' : '') +
      '<button class="dugme ana" type="button" data-kaydet>Kaydet</button>';
  }

  function bagla(p, duzenleme, koleksiyon, id, kaydetFn, ipuclari) {
    A.sayiAlanlariniBagla(p, ipuclari || {});
    var kb = $('[data-kaydet]', p);
    if (kb) kb.onclick = kaydetFn;
    var sb = $('[data-sil]', p);
    if (sb) sb.onclick = function () {
      A.onayla('Kaydı sil', 'Bu kayıt silinecek.', 'Sil', function () {
        V.sil(koleksiyon, id);
        A.bildir('Silindi');
        Git.ciz();
      }, true);
    };
  }

  function tamamla(mesaj) {
    A.panelKapat();
    A.bildir(mesaj);
    Git.ciz();
  }

  function hata(mesaj) {
    A.bildir(mesaj);
  }

  /* ============================================================
     DÖVİZ TRANSFERİ
     ============================================================ */
  function formTransfer(id) {
    var k = id ? V.bul('transferler', id) : null;
    var govde =
      alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
      '<div class="ikili">' +
        alan({ id: 'f_usd', etiket: 'Gönderilen dolar', tip: 'sayi', birim: 'USD',
               deger: k ? k.usd : '', yerTutucu: '10.000' }) +
        alan({ id: 'f_kur', etiket: 'Kur (1 USD = ?)', tip: 'sayi', birim: 'T',
               deger: k && k.usd ? Math.round(k.tumen / k.usd) : '', yerTutucu: '500.000' }) +
      '</div>' +
      alan({ id: 'f_tumen', etiket: 'Eline geçen Tümen', tip: 'sayi', birim: 'T',
             deger: k ? k.tumen : '',
             ipucu: 'Otomatik hesaplanır. Sarraf komisyon kestiyse gerçek rakamı buraya yaz — kur kendiliğinden düzelir.' }) +
      alan({ id: 'f_not', etiket: 'Not (kim aracılığıyla)', deger: k ? k.not : '',
             yerTutucu: 'örn. Tebriz sarrafı' });

    var p = A.panelAc(k ? 'Döviz transferini düzenle' : 'Döviz transferi', govde, ayak(!!k));

    var elleTumen = false;
    el('f_tumen').addEventListener('input', function () { elleTumen = true; });
    ['f_usd', 'f_kur'].forEach(function (a) {
      el(a).addEventListener('input', function () { elleTumen = false; });
    });

    bagla(p, !!k, 'transferler', id, function () {
      var usd = sayi('f_usd'), tumen = sayi('f_tumen');
      if (usd <= 0) return hata('Gönderilen dolar tutarını gir');
      if (tumen <= 0) return hata('Eline geçen Tümen tutarını gir');
      var kayit = { tarih: deger('f_tarih') || bugun(), usd: usd, tumen: tumen, not: deger('f_not') };
      if (k) V.guncelle('transferler', id, kayit); else V.ekle('transferler', kayit);
      tamamla(k ? 'Transfer güncellendi' : 'Transfer kaydedildi');
    }, {
      __hepsi: function () {
        var usd = sayi('f_usd'), kur = sayi('f_kur');
        if (!elleTumen && usd > 0 && kur > 0) {
          el('f_tumen').value = n0(usd * kur);
        }
        var tumen = sayi('f_tumen');
        var ip = el('f_tumen_ipucu');
        if (usd > 0 && tumen > 0) {
          var gercek = tumen / usd;
          ip.className = 'ipucu vurgulu';
          ip.innerHTML = Tk(tumen) + ' — gerçek kur <b>' + n0(gercek) + '</b> T/USD';
        } else {
          ip.className = 'ipucu';
          ip.innerHTML = 'Otomatik hesaplanır. Sarraf komisyon kestiyse gerçek rakamı buraya yaz.';
        }
      }
    });
  }

  /* ============================================================
     ALIM (PARTİ) — çoklu tüccar girişi

     Aynı gün birden çok tüccardan alım yapılıyor ve mallar depoda
     karışıp birlikte eleniyor. Bu yüzden bir parti = bir günün
     alım listesi: her satır bir tüccar.
     ============================================================ */
  function formParti(id) {
    var k = id ? V.bul('partiler', id) : null;
    var kasa = H.kasa(V.hepsi());
    var mevcutSatirlar = k && k.alimlar && k.alimlar.length ? k.alimlar : [{ odemeDurumu: 'Ödendi' }];
    var adlar = V.tuccarAdlari();
    var sayac = 0;

    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
        alan({ id: 'f_kod', etiket: 'Parti kodu', deger: k ? k.kod : V.yeniPartiKodu() }) +
      '</div>' +
      alan({ id: 'f_bolge', etiket: 'Bölge / menşe (tümü için)', deger: k ? k.bolge : '',
             yerTutucu: 'örn. Kermanşah' }) +
      '<datalist id="tuccarListesi">' +
        adlar.map(function (a) { return '<option value="' + kacir(a) + '">'; }).join('') +
      '</datalist>' +
      '<h2 class="bolum" style="margin-top:18px">Alımlar</h2>' +
      '<div class="klavye-ipucu">' +
        '<span><kbd>Enter</kbd>sonraki alan</span>' +
        '<span><kbd>Enter</kbd>son alanda yeni satır</span>' +
        '<span><kbd>↑</kbd><kbd>↓</kbd>satırlar arası</span>' +
        '<span><kbd>⌘</kbd><kbd>Enter</kbd>kaydet</span>' +
      '</div>' +
      '<div id="satirlar"></div>' +
      '<button class="dugme tam" type="button" id="satirEkle">+ Tüccar ekle</button>' +
      '<div id="alimOzet"></div>' +
      alan({ id: 'f_not', etiket: 'Parti notu', tip: 'metinKutusu', deger: k ? k.not : '' });

    var p = A.panelAc(k ? 'Partiyi düzenle' : 'Yeni alım', govde,
      (k ? '<button class="dugme tehlike" type="button" data-sil>Sil</button>' : '') +
      '<button class="dugme ana" type="button" data-kaydet>Kaydet</button>');

    /* ---------- klavye gezinmesi ---------- */
    function odakla(kimlik) {
      var e = el(kimlik);
      if (!e) return false;
      e.focus();
      if (e.select) e.select();
      return true;
    }
    function satirNo(d) { return d ? d.dataset.satir : null; }

    // Enter: sıradaki alana. Son alanda: sonraki satır, yoksa yeni satır aç.
    function satirKlavye(d, i, ev) {
      if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) {
        ev.preventDefault();
        $('[data-kaydet]', p).click();
        return;
      }
      var t = ev.target;
      if (!t.id) return;
      var kismiAcik = el('s_ow' + i) && el('s_ow' + i).style.display !== 'none';

      if (ev.key === 'Enter') {
        ev.preventDefault();
        if (t.id === 's_ad' + i) return odakla('s_kg' + i);
        if (t.id === 's_kg' + i) return odakla('s_fi' + i);
        if (t.id === 's_fi' + i && kismiAcik) return odakla('s_od' + i);
        // satırın sonu → sonraki satır ya da yeni satır
        var sonraki = d.nextElementSibling;
        if (sonraki) return odakla('s_ad' + satirNo(sonraki));
        el('satirEkle').click();
        return;
      }

      // Yukarı/aşağı ok: aynı sütunda satırlar arası geçiş
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        var m = /^(s_(?:ad|kg|fi|od))(\d+)$/.exec(t.id);
        if (!m) return;
        var hedefSatir = ev.key === 'ArrowDown' ? d.nextElementSibling : d.previousElementSibling;
        if (!hedefSatir) return;
        ev.preventDefault();
        odakla(m[1] + satirNo(hedefSatir));
      }
    }

    /* ---------- bir alım satırı ---------- */
    function satirEkle(a, odaklan) {
      a = a || {};
      var i = ++sayac;
      var d = document.createElement('div');
      d.className = 'alim-satir';
      d.dataset.satir = i;
      d.innerHTML =
        '<div class="alim-tepe">' +
          '<span class="alim-no">' + i + '</span>' +
          '<input type="text" id="s_ad' + i + '" list="tuccarListesi" placeholder="Tüccar adı" ' +
            'autocomplete="off" value="' + kacir(a.satici || '') + '">' +
          '<button type="button" class="alim-sil" aria-label="Satırı sil">✕</button>' +
        '</div>' +
        '<div class="ikili">' +
          '<div class="onek"><input type="text" inputmode="decimal" data-sayi id="s_kg' + i + '" ' +
            'placeholder="kg" value="' + (a.kg || '') + '"><span class="birim">kg</span></div>' +
          '<div class="onek"><input type="text" inputmode="decimal" data-sayi id="s_fi' + i + '" ' +
            'placeholder="fiyat" value="' + (a.birimFiyat || '') + '"><span class="birim">T/kg</span></div>' +
        '</div>' +
        '<div class="alim-alt">' +
          '<span class="alim-tutar" id="s_tt' + i + '">—</span>' +
          '<div class="alim-odeme">' +
            ['Ödendi', 'Kısmi', 'Borç'].map(function (o) {
              return '<label><input type="radio" name="ode' + i + '" value="' + o + '"' +
                ((a.odemeDurumu || 'Ödendi') === o ? ' checked' : '') + '><span>' + o + '</span></label>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="alim-odenen" id="s_ow' + i + '" style="display:none">' +
          '<label for="s_od' + i + '">Bugün ödenen</label>' +
          '<div class="onek"><input type="text" inputmode="decimal" data-sayi id="s_od' + i + '" ' +
            'placeholder="0" value="' + (a.odenen || '') + '"><span class="birim">T</span></div>' +
        '</div>';
      el('satirlar').appendChild(d);

      $('.alim-sil', d).onclick = function () {
        if (el('satirlar').children.length <= 1) return hata('En az bir alım satırı olmalı');
        d.remove();
        numarala();
        tazele();
      };
      d.addEventListener('keydown', function (ev) { satirKlavye(d, i, ev); });

      A.sayiAlanlariniBagla(p, ipuclari);
      if (odaklan) odakla('s_ad' + i);
      tazele();
      return d;
    }

    function numarala() {
      Array.prototype.forEach.call(el('satirlar').children, function (d, n) {
        $('.alim-no', d).textContent = n + 1;
        $('.alim-sil', d).style.visibility = el('satirlar').children.length > 1 ? '' : 'hidden';
      });
    }

    /* ---------- satırları oku ---------- */
    function satirlar() {
      return Array.prototype.map.call(el('satirlar').children, function (d) {
        var i = d.dataset.satir;
        var kg = sayi('s_kg' + i), fi = sayi('s_fi' + i);
        var durum = ($('input[name=ode' + i + ']:checked', d) || {}).value || 'Ödendi';
        var tutar = kg * fi;
        return {
          eleman: d, satici: deger('s_ad' + i), kg: kg, birimFiyat: fi, tutar: tutar,
          odemeDurumu: durum,
          odenen: durum === 'Ödendi' ? tutar : durum === 'Borç' ? 0 : sayi('s_od' + i)
        };
      });
    }

    /* ---------- canlı toplam ---------- */
    function tazele() {
      var sr = satirlar();
      var kg = 0, tutar = 0, borc = 0, dolu = 0;
      sr.forEach(function (r) {
        var i = r.eleman.dataset.satir;
        el('s_tt' + i).textContent = r.tutar > 0 ? A.T(r.tutar) : '—';
        el('s_ow' + i).style.display = r.odemeDurumu === 'Kısmi' ? '' : 'none';
        r.eleman.classList.toggle('borclu', r.odemeDurumu !== 'Ödendi' && r.tutar > 0);
        kg += r.kg; tutar += r.tutar;
        borc += H.satirBorc(r);
        if (r.kg > 0 && r.birimFiyat > 0) dolu++;
      });
      numarala();

      var o = el('alimOzet');
      if (!tutar) { o.innerHTML = ''; guncelleKaydet(0); return; }
      o.innerHTML = '<div class="sonuc-kutu" style="margin:14px 0 4px">' +
        '<div class="baslik">' + dolu + ' tüccar · ' + A.KG(kg) + '</div>' +
        '<div class="buyuk" style="font-size:24px">' + A.Tk(tutar) + '</div>' +
        '<div class="yan">' + A.T(tutar) +
          (kasa.ortKur > 0 ? ' ≈ ' + A.U(tutar / kasa.ortKur) : '') + '</div>' +
        '<div class="not">Ortalama alım fiyatı: <b>' + n0(kg > 0 ? tutar / kg : 0) + ' T/kg</b>' +
          (borc > 0 ? '<br><b style="color:var(--eksi)">Borç kalan: ' + A.T(borc) + '</b>' : '') +
          (kasa.bakiye > 0 && (tutar - borc) > kasa.bakiye
            ? '<br><b style="color:var(--eksi)">⚠️ Kasada sadece ' + A.Tk(kasa.bakiye) + ' var</b>' : '') +
        '</div></div>';
      guncelleKaydet(tutar);
    }

    function guncelleKaydet(tutar) {
      var b = $('[data-kaydet]', p);
      if (b) b.textContent = tutar > 0 ? 'Kaydet · ' + A.Tk(tutar) : 'Kaydet';
    }

    var ipuclari = { __hepsi: tazele };

    el('satirEkle').onclick = function () { satirEkle(null, true); };
    mevcutSatirlar.forEach(function (a) { satirEkle(a, false); });

    /* Üst alanlarda Enter → ilk alım satırına atla (fare gerekmesin) */
    ['f_tarih', 'f_kod', 'f_bolge'].forEach(function (kimlik) {
      el(kimlik).addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter') return;
        ev.preventDefault();
        var ilk = el('satirlar').firstElementChild;
        if (ilk) odakla('s_ad' + satirNo(ilk));
      });
    });

    /* Panelin her yerinde ⌘/Ctrl+Enter kaydeder */
    p.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) {
        ev.preventDefault();
        $('[data-kaydet]', p).click();
      }
    });

    /* ---------- kaydet ---------- */
    $('[data-kaydet]', p).onclick = function () {
      var sr = satirlar().filter(function (r) { return r.kg > 0 || r.tutar > 0 || r.satici; });
      if (!sr.length) return hata('En az bir tüccar alımı gir');
      var eksik = sr.filter(function (r) { return !(r.kg > 0) || !(r.birimFiyat > 0); });
      if (eksik.length) return hata(eksik.length + ' satırda kilo veya fiyat eksik');

      var kayit = {
        tarih: deger('f_tarih') || bugun(),
        kod: deger('f_kod') || V.yeniPartiKodu(),
        bolge: deger('f_bolge'),
        not: deger('f_not'),
        alimlar: sr.map(function (r, n) {
          return {
            id: (id || 'a') + '-' + (n + 1),
            satici: r.satici, kg: r.kg, birimFiyat: r.birimFiyat, tutar: r.tutar,
            odemeDurumu: r.odemeDurumu, odenen: r.odenen
          };
        })
      };
      if (k) V.guncelle('partiler', id, kayit); else V.ekle('partiler', kayit);
      tamamla(k ? 'Parti güncellendi' : sr.length + ' alım kaydedildi');
    };

    var sb = $('[data-sil]', p);
    if (sb) sb.onclick = function () {
      A.onayla('Partiyi sil', 'Bu parti ve içindeki tüm alım satırları silinecek.', 'Sil', function () {
        V.sil('partiler', id); A.bildir('Silindi'); Git.ciz();
      }, true);
    };

    A.sayiAlanlariniBagla(p, ipuclari);
    tazele();

    // Yeni alımda imleç doğrudan ilk tüccar adına düşsün — hiç tıklamadan yazmaya başla
    if (!k) {
      var ilkSatir = el('satirlar').firstElementChild;
      if (ilkSatir) odakla('s_ad' + satirNo(ilkSatir));
    }
  }

  /* ============================================================
     MASRAF
     ============================================================ */
  function formMasraf(id, onSecili) {
    var k = id ? V.bul('masraflar', id) : null;
    var veri = V.hepsi();
    var kasa = H.kasa(veri);
    var partiler = H.partiListesi(veri).sort(function (a, b) {
      return (b.tarih || '').localeCompare(a.tarih || '');
    });
    if (!partiler.length) {
      return A.panelAc('Masraf', '<div class="bos-durum"><div class="simge">📦</div>' +
        '<p>Masraf ekleyebilmek için önce bir parti (alım) kaydetmelisin.<br>' +
        'Masraflar partilere dağıtılır — maliyet hesabı böyle çalışır.</p></div>');
    }
    var secili = k ? (k.partiIds || []) : (onSecili ? [onSecili] : []);

    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
        alan({ id: 'f_kategori', etiket: 'Kategori', tip: 'secim',
               secenekler: MASRAF_KATEGORILERI, deger: k ? k.kategori : 'Nakliye' }) +
      '</div>' +
      '<div class="alan"><label>Para birimi</label><div class="secim-satir">' +
        [['TMN', 'Tümen'], ['USD', 'Dolar']].map(function (d) {
          return '<label><input type="radio" name="pb" value="' + d[0] + '"' +
            ((k ? k.paraBirimi : 'TMN') === d[0] ? ' checked' : '') + '><span>' + d[1] + '</span></label>';
        }).join('') + '</div>' +
        '<div class="ipucu">Gümrük/navlun gibi doğrudan dolarla ödediğin masraflar için Dolar seç — ' +
        'Tümen kasasına dokunmaz.</div></div>' +
      alan({ id: 'f_tutar', etiket: 'Tutar', tip: 'sayi', deger: k ? k.tutar : '', yerTutucu: '80.000.000' }) +
      alan({ id: 'f_aciklama', etiket: 'Açıklama', deger: k ? k.aciklama : '',
             yerTutucu: 'örn. depodan elemeye kamyon' }) +
      '<div class="alan"><label>Hangi partiye ait?</label>' +
        '<div class="kart"><ul class="liste" id="partiListesi">' +
        partiler.map(function (pp) {
          return '<li style="cursor:pointer" data-secparti="' + pp.id + '">' +
            '<input type="checkbox" style="width:21px;height:21px;accent-color:var(--vurgu)" ' +
            'value="' + pp.id + '"' + (secili.indexOf(pp.id) !== -1 ? ' checked' : '') + '>' +
            '<div class="sol"><div class="ana">' + kacir(pp.kod) + '</div>' +
            '<div class="yan">' + A.tarihGoster(pp.tarih) + (pp.satici ? ' · ' + kacir(pp.satici) : '') +
            ' · ' + KG(pp.hamKg) + '</div></div></li>';
        }).join('') + '</ul></div>' +
        '<div class="ipucu" id="dagitimIpucu"></div></div>' +
      '<div class="alan" id="dagitimAlani" style="display:none"><label>Nasıl bölüşülsün?</label>' +
        '<div class="secim-satir">' +
        [['kg', 'Kilo oranına göre'], ['esit', 'Eşit böl']].map(function (d) {
          return '<label><input type="radio" name="dagitim" value="' + d[0] + '"' +
            ((k ? k.dagitim : 'kg') === d[0] ? ' checked' : '') + '><span>' + d[1] + '</span></label>';
        }).join('') + '</div></div>';

    var p = A.panelAc(k ? 'Masrafı düzenle' : 'Masraf ekle', govde, ayak(!!k));

    function secililer() {
      return Array.prototype.slice.call(p.querySelectorAll('#partiListesi input:checked'))
        .map(function (c) { return c.value; });
    }
    function tazele() {
      var s = secililer();
      el('dagitimAlani').style.display = s.length > 1 ? '' : 'none';
      var ip = el('dagitimIpucu');
      if (!s.length) { ip.className = 'ipucu hata'; ip.textContent = 'En az bir parti seç'; }
      else if (s.length === 1) { ip.className = 'ipucu'; ip.textContent = 'Masrafın tamamı bu partiye yazılacak.'; }
      else {
        ip.className = 'ipucu vurgulu';
        ip.textContent = s.length + ' parti seçildi — masraf aralarında bölüşülecek.';
      }
    }
    Array.prototype.forEach.call(p.querySelectorAll('[data-secparti]'), function (li) {
      li.onclick = function (e) {
        var c = li.querySelector('input');
        if (e.target !== c) c.checked = !c.checked;
        tazele();
      };
    });
    tazele();

    bagla(p, !!k, 'masraflar', id, function () {
      var tutar = sayi('f_tutar');
      var s = secililer();
      if (tutar <= 0) return hata('Tutarı gir');
      if (!s.length) return hata('En az bir parti seç');
      var kayit = {
        tarih: deger('f_tarih') || bugun(),
        kategori: deger('f_kategori'),
        paraBirimi: ($('input[name=pb]:checked', p) || {}).value || 'TMN',
        tutar: tutar,
        aciklama: deger('f_aciklama'),
        partiIds: s,
        dagitim: ($('input[name=dagitim]:checked', p) || {}).value || 'kg'
      };
      if (k) V.guncelle('masraflar', id, kayit); else V.ekle('masraflar', kayit);
      tamamla(k ? 'Masraf güncellendi' : 'Masraf eklendi');
    }, {
      __hepsi: function () {
        var t = sayi('f_tutar');
        var pb = ($('input[name=pb]:checked', p) || {}).value || 'TMN';
        var ip = el('f_tutar_ipucu');
        if (t > 0) {
          ip.className = 'ipucu vurgulu';
          ip.innerHTML = pb === 'USD' ? U(t)
            : Tk(t) + (kasa.ortKur > 0 ? ' ≈ ' + U(t / kasa.ortKur) : '');
        } else { ip.className = 'ipucu'; ip.innerHTML = ''; }
      }
    });
    Array.prototype.forEach.call(p.querySelectorAll('input[name=pb]'), function (r) {
      r.onchange = function () { A.sayiAlanlariniBagla(p, {}); el('f_tutar').dispatchEvent(new Event('input')); };
    });
  }

  /* ============================================================
     PARTİ GİDERLERİ — hepsi tek ekranda

     Nakliye, hammaliye, çuval her partide mutlaka oluşur. Tek tek
     masraf kaydı açmak yerine hepsini burada doldurursun; program
     eksik kalanı kırmızı gösterir.
     ============================================================ */
  function formGiderler(partiId) {
    var veri = V.hepsi();
    var kasa = H.kasa(veri);
    var o = H.parti(veri, partiId);
    if (!o) return;
    var gd = o.giderDurumu;
    var kalemAd = {};   // alan kimliği → satır

    function satirHtml(r, n) {
      var kimlik = 'g_' + n;
      kalemAd[kimlik] = r;

      var rozet = '<span class="rozet ' +
        (r.durum === 'girildi' ? 'arti' : r.durum === 'eksik' ? 'eksi'
         : r.durum === 'beklemede' ? 'uyari' : 'sonuk') +
        '" id="' + kimlik + '_rozet">' +
        (r.durum === 'girildi' ? 'girildi' : r.durum === 'eksik' ? 'eksik'
         : r.durum === 'beklemede' ? 'eleme bekliyor' : '') + '</span>';

      var giris;
      if (r.kaynak === 'eleme') {
        var birim = o.girenKg > 0 ? r.tumen / o.girenKg : 0;
        giris = '<div class="gider-sabit">' +
          (r.tumen > 0
            ? A.T(r.tumen) + (birim > 0
                ? '<span style="font-weight:500;color:var(--metin3)"> · ' +
                  n0(birim) + ' T/kg</span>' : '')
            : 'eleme kaydına girilir') +
          '</div>' +
          (r.tumen > 0 ? '' :
            '<button type="button" class="dugme kucuk" data-elemeye="1">Eleme kaydını aç</button>');
      } else if (!r.duzenlenebilir) {
        giris = '<div class="gider-sabit">' + A.T(r.tumen) + '</div>' +
          '<div class="ipucu">' +
            (r.paylasimli ? 'Birden çok partiye dağıtılmış — Masraflar ekranından düzenlenir.'
                          : r.adet + ' ayrı kayıt var — Masraflar ekranından düzenlenir.') +
          '</div>';
      } else {
        var tip = r.tutarTipi || 'goturu';
        var baslangic = r.tumen > 0
          ? Math.round(H.giderBirimi(tip, r.tumen, o.hamKg)) : '';
        giris =
          '<div class="gider-tip">' +
            H.GIDER_TIPLERI.map(function (t) {
              return '<label><input type="radio" name="tip' + n + '" value="' + t.deger + '"' +
                (tip === t.deger ? ' checked' : '') + '><span>' + t.ad + '</span></label>';
            }).join('') +
          '</div>' +
          '<div class="onek">' +
            '<input type="text" inputmode="decimal" data-sayi id="' + kimlik + '" ' +
              'placeholder="0" value="' + baslangic + '">' +
            '<span class="birim" id="' + kimlik + '_birim">' +
              H.giderBirimiAdi(tip) + '</span>' +
          '</div>' +
          '<div class="ipucu" id="' + kimlik + '_ipucu"></div>';
      }

      return '<div class="gider-satir' + (r.durum === 'eksik' ? ' eksik' : '') + '" data-kalem="' + n + '">' +
        '<div class="gider-tepe">' +
          '<span class="gider-simge">' + r.simge + '</span>' +
          '<span class="gider-ad">' + kacir(r.ad) +
            (r.zorunlu ? '<span class="gider-zorunlu">zorunlu</span>' : '') + '</span>' +
          rozet +
        '</div>' + giris + '</div>';
    }

    var zorunluSatirlar = gd.satirlar.filter(function (r) { return r.zorunlu; });
    var digerSatirlar = gd.satirlar.filter(function (r) { return !r.zorunlu; });
    var n = 0;

    var govde =
      '<div class="gider-baslik">' +
        '<div><b>' + kacir(o.parti.kod) + '</b> · ' + kgTam(o.hamKg) +
          (o.parti.bolge ? ' · ' + kacir(o.parti.bolge) : '') + '</div>' +
        '<div class="kucuk-yazi">Alım ' + A.T(o.parti.tutar) + '</div>' +
      '</div>' +
      '<h2 class="bolum">Zorunlu giderler</h2>' +
      zorunluSatirlar.map(function (r) { return satirHtml(r, n++); }).join('') +
      '<h2 class="bolum">Diğer giderler</h2>' +
      digerSatirlar.map(function (r) { return satirHtml(r, n++); }).join('') +
      '<div id="giderOzet"></div>';

    var p = A.panelAc('Parti giderleri', govde,
      '<button class="dugme ana" type="button" data-kaydet>Kaydet</button>');

    $('[data-elemeye]', p) && ($('[data-elemeye]', p).onclick = function () {
      A.panelKapat();
      ac('eleme', partiId);
    });

    function satirTipi(kimlik) {
      var n = kimlik.slice(2);
      var s = $('input[name="tip' + n + '"]:checked', p);
      return s ? s.value : 'goturu';
    }

    // Kayıt anında da aynı hesabı kullanmak için satır tutarını üretir
    function satirTutari(kimlik, r) {
      if (!el(kimlik)) return r.tumen;              // düzenlenemeyen satır
      return H.giderTutari(satirTipi(kimlik), sayi(kimlik), o.hamKg);
    }

    function tazele() {
      var toplam = 0, eksikSayisi = 0, bekleyen = 0;
      Object.keys(kalemAd).forEach(function (kimlik) {
        var r = kalemAd[kimlik];
        var v = satirTutari(kimlik, r);
        toplam += v;
        var satir = p.querySelector('[data-kalem="' + kimlik.slice(2) + '"]');
        if (r.zorunlu && v <= 0 && r.durum === 'beklemede') bekleyen++;
        if (r.zorunlu && v <= 0 && r.durum !== 'beklemede') {
          eksikSayisi++;
          if (satir) satir.classList.add('eksik');
        } else if (satir) satir.classList.remove('eksik');

        // rozeti yazdıkça güncelle — girilen kalem "eksik" görünmesin
        var rz = el(kimlik + '_rozet');
        if (rz && r.kaynak !== 'eleme') {
          if (v > 0) { rz.className = 'rozet arti'; rz.textContent = 'girildi'; }
          else if (r.zorunlu) { rz.className = 'rozet eksi'; rz.textContent = 'eksik'; }
          else { rz.className = 'rozet sonuk'; rz.textContent = ''; }
        }
        var ip = el(kimlik + '_ipucu');
        if (ip) {
          var tip = satirTipi(kimlik);
          var girilen = sayi(kimlik);
          var bl = el(kimlik + '_birim');
          if (bl) bl.textContent = H.giderBirimiAdi(tip);
          ip.className = v > 0 ? 'ipucu vurgulu' : 'ipucu';
          if (v > 0) {
            var carpim = tip === 'kg'
              ? n0(girilen) + ' T/kg × ' + kgTam(o.hamKg) + ' = '
              : tip === 'ton'
                ? n0(girilen) + ' T/ton × ' + n0(o.hamKg / 1000) + ' ton = '
                : '';
            ip.innerHTML = carpim + '<b>' + A.T(v) + '</b>' +
              (kasa.ortKur > 0 ? ' ≈ ' + A.U(v / kasa.ortKur) : '');
          } else {
            ip.innerHTML = r.zorunlu ? 'Girilmezse maliyet olduğundan düşük çıkar' : '';
          }
        }
      });

      var alimT = o.parti.tutar;
      el('giderOzet').innerHTML =
        '<div class="sonuc-kutu" style="margin-top:16px">' +
        '<div class="baslik">Toplam gider</div>' +
        '<div class="buyuk" style="font-size:24px">' + A.Tk(toplam) + '</div>' +
        '<div class="yan">' + A.T(toplam) +
          (kasa.ortKur > 0 ? ' ≈ ' + A.U(toplam / kasa.ortKur) : '') + '</div>' +
        '<div class="not">' +
          (alimT > 0 ? 'Alımın <b>' + A.yuzde(toplam / alimT, 1) + '</b>\u0027i kadar gider' : '') +
          (eksikSayisi
            ? '<br><b style="color:var(--eksi)">' + eksikSayisi +
              ' zorunlu gider girilmedi — maliyet eksik hesaplanır</b>'
            : bekleyen
              ? '<br><b style="color:var(--uyari)">✓ Buradan girilecekler tamam · ' +
                'eleme ücreti, eleme kaydını girdiğinde eklenecek</b>'
              : '<br><b style="color:var(--arti)">✓ Tüm zorunlu giderler girildi</b>') +
        '</div></div>';
    }

    $('[data-kaydet]', p).onclick = function () {
      var eklendi = 0, silindi = 0, guncellendi = 0;
      Object.keys(kalemAd).forEach(function (kimlik) {
        var r = kalemAd[kimlik];
        if (!el(kimlik)) return;              // düzenlenemeyen satır
        var tip = satirTipi(kimlik);
        var birim = sayi(kimlik);
        var v = H.giderTutari(tip, birim, o.hamKg);
        if (v > 0 && r.kayitId) {
          if (Math.round(v) !== Math.round(r.tumen) || tip !== r.tutarTipi) {
            V.guncelle('masraflar', r.kayitId,
              { tutar: v, tutarTipi: tip, birimFiyat: birim });
            guncellendi++;
          }
        } else if (v > 0) {
          V.ekle('masraflar', {
            tarih: o.parti.tarih || bugun(), kategori: r.ad, paraBirimi: 'TMN',
            tutar: v, tutarTipi: tip, birimFiyat: birim,
            aciklama: '', partiIds: [partiId], dagitim: 'kg'
          });
          eklendi++;
        } else if (r.kayitId) {
          V.sil('masraflar', r.kayitId); silindi++;
        }
      });
      var mesaj = eklendi + guncellendi > 0
        ? 'Giderler kaydedildi'
        : (silindi ? silindi + ' gider silindi' : 'Değişiklik yok');
      tamamla(mesaj);
    };

    A.sayiAlanlariniBagla(p, { __hepsi: tazele });
    tazele();
  }

  /* ============================================================
     ELEME — programın en kritik girişi
     ============================================================ */
  function formEleme(id, onSecili) {
    var k = id ? V.bul('elemeler', id) : null;
    var veri = V.hepsi();
    var kasa2 = H.kasa(veri);
    var partiler = H.partiListesi(veri).sort(function (a, b) {
      return (b.tarih || '').localeCompare(a.tarih || '');
    });
    if (!partiler.length) {
      return A.panelAc('Eleme', '<div class="bos-durum"><div class="simge">📦</div>' +
        '<p>Önce bir parti (alım) kaydetmelisin.</p></div>');
    }
    /* Her partide elemeye gönderilmeyi bekleyen ham mal.
       Mevcut kayıt düzenleniyorsa kendi miktarı da tekrar kullanılabilir. */
    var kalanHam = {};
    H.tumPartiler(veri).forEach(function (o) {
      kalanHam[o.parti.id] = o.elenmemisKg +
        (k && k.partiId === o.parti.id ? (Number(k.girenKg) || 0) : 0);
    });

    // Elenecek malı olan parti varsa varsayılan olarak onu seç
    var haziOlan = partiler.filter(function (pp) { return (kalanHam[pp.id] || 0) > 0.5; });
    var secilenParti = k ? k.partiId
      : (onSecili || (haziOlan.length ? haziOlan[0].id : partiler[0].id));
    var tamamlandi = k ? k.tamamlandi !== false : true;

    /* Eleme genelde kilo başına fiyatlanır — varsayılan giriş şekli bu.
       Kayıtta toplam tutar saklanır, motor tarafı hiç değişmez. */
    var ucretTipi = k ? (k.ucretTipi === 'toplam' ? 'goturu' : (k.ucretTipi || 'goturu')) : 'kg';
    var ucretBaslangic = '';
    if (k) {
      ucretBaslangic = Math.round(
        H.giderBirimi(ucretTipi, Number(k.ucret) || 0, Number(k.girenKg) || 0)) || '';
    }

    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
        alan({ id: 'f_kayitNo', etiket: 'Eleme no', deger: k ? (k.no || '') : '',
               yerTutucu: 'isteğe bağlı' }) +
      '</div>' +
      '<div class="alan">' +
        '<label>Elemeye giren partiler</label>' +
        '<div class="ipucu" style="margin-bottom:8px">Birkaç partiyi birlikte ' +
          'eletiyorsan hepsini yaz — çıktılar giren kilo oranında paylaştırılır.</div>' +
        '<div class="onek" style="margin-bottom:8px">' +
          '<input type="text" inputmode="decimal" data-sayi id="f_toplamGiren" ' +
            'placeholder="toplam kg"><span class="birim">kg</span></div>' +
        '<button type="button" class="tumu-dugme" id="tumuGonder">' +
          '<span class="tumu-sol">En eskiden başlayarak dağıt</span>' +
          '<span class="tumu-kg" id="tumuKg">—</span>' +
        '</button>' +
        '<div class="ipucu" id="f_giren_ipucu"></div>' +
        '<div class="bosluk"></div>' +
        '<div id="girdiler"></div>' +
      '</div>' +
      '<div class="alan-grubu"><div class="onay-satir">' +
        '<input type="checkbox" id="f_tamam"' + (tamamlandi ? ' checked' : '') + '>' +
        '<label for="f_tamam">Eleme bitti, sonuçlar belli</label></div>' +
        '<div id="sonucAlanlari">' +
          alan({ id: 'f_ust', etiket: '8mm üstü (ihracatlık)', tip: 'sayi', birim: 'kg',
                 deger: k ? k.ustKg : '', yerTutucu: '8.200' }) +
          '<div class="alan">' +
            '<label>8mm altı (İran\'da satılacak)</label>' +
            '<div id="altKaliteler"></div>' +
            '<button class="dugme kucuk" type="button" id="kaliteEkle">+ Kalite ayır</button>' +
            '<div class="ipucu" id="f_alt_ipucu"></div>' +
          '</div>' +
          alan({ id: 'f_fire', etiket: 'Fire (taş, toprak — değersiz)', tip: 'sayi', birim: 'kg',
                 deger: k ? k.fireKg : '', yerTutucu: '400' }) +
        '</div>' +
      '</div>' +
      '<div id="denetim"></div>' +
      '<datalist id="kaliteListesi">' +
        ['1. kalite', '2. kalite', '3. kalite', 'Kırık']
          .concat(V.kaliteAdlari())
          .filter(function (x, i, a) { return a.indexOf(x) === i; })
          .map(function (a) { return '<option value="' + kacir(a) + '">'; }).join('') +
      '</datalist>' +
      '<div class="alan">' +
        '<label>Eleme ücreti</label>' +
        '<div class="secim-satir" style="margin-bottom:9px">' +
          H.GIDER_TIPLERI.map(function (t) {
            return '<label><input type="radio" name="ucretTipi" value="' + t.deger + '"' +
              (ucretTipi === t.deger ? ' checked' : '') + '><span>' + t.ad + '</span></label>';
          }).join('') +
        '</div>' +
        '<div class="onek">' +
          '<input type="text" inputmode="decimal" data-sayi id="f_ucret" autocomplete="off" ' +
            'value="' + (ucretBaslangic || '') + '" placeholder="6.000">' +
          '<span class="birim" id="f_ucret_birim">' + H.giderBirimiAdi(ucretTipi) + '</span>' +
        '</div>' +
        '<div class="ipucu" id="f_ucret_ipucu"></div>' +
      '</div>' +
      alan({ id: 'f_not', etiket: 'Not', deger: k ? k.not : '' });

    var p = A.panelAc(k ? 'Eleme kaydını düzenle' : 'Eleme kaydı', govde, ayak(!!k));

    var ipuclari = { __hepsi: function () { tazele(); } };

    /* ---------- elemeye giren parti satırları ---------- */
    var hazirPartiler = partiler.filter(function (pp) {
      return (kalanHam[pp.id] || 0) > 0.5;
    }).sort(function (a, b) {
      return String(a.tarih || '').localeCompare(String(b.tarih || ''));   // eskiden yeniye
    });

    function girdiSatirlariniYaz() {
      var mevcut = k ? H.elemeGirdileri(k) : [];
      var harita = {};
      mevcut.forEach(function (x) { harita[x.partiId] = x.girenKg; });

      var gosterilecek = hazirPartiler.slice();
      function ekle(id) {
        if (!id) return;
        if (gosterilecek.some(function (pp) { return pp.id === id; })) return;
        var pp = partiler.find(function (y) { return y.id === id; });
        if (pp) gosterilecek.push(pp);
      }
      mevcut.forEach(function (x) { ekle(x.partiId); });
      // Parti kartından açıldıysa o parti stoğu bitmiş olsa da görünsün
      ekle(onSecili);
      gosterilecek.sort(function (a, b) {
        return String(a.tarih || '').localeCompare(String(b.tarih || ''));
      });

      el('girdiler').innerHTML = gosterilecek.map(function (pp) {
        var kalan = kalanHam[pp.id] || 0;
        return '<div class="alan" style="margin-bottom:10px">' +
          '<label style="display:flex;justify-content:space-between">' +
            '<span>' + kacir(pp.kod) + ' · ' + A.tarihGoster(pp.tarih) + '</span>' +
            '<span style="color:var(--metin3);font-weight:400">' + kgTam(kalan) + ' hazır</span>' +
          '</label>' +
          '<div class="onek"><input type="text" inputmode="decimal" data-sayi ' +
            'id="gi_' + pp.id + '" placeholder="0" value="' +
            (harita[pp.id] || '') + '"><span class="birim">kg</span></div>' +
          '<div class="ipucu" id="gi_' + pp.id + '_ipucu"></div>' +
        '</div>';
      }).join('');
      A.sayiAlanlariniBagla(p, ipuclari);
    }

    function girdiler() {
      var s = [];
      partiler.forEach(function (pp) {
        if (!el('gi_' + pp.id)) return;
        var v = sayi('gi_' + pp.id);
        if (v > 0) s.push({ partiId: pp.id, kod: pp.kod, girenKg: v });
      });
      return s;
    }
    function girenToplam() {
      return girdiler().reduce(function (t, x) { return t + x.girenKg; }, 0);
    }

    /* ---------- 8mm altı kalite satırları ---------- */
    var kaliteSayac = 0;
    var kaliteAdlari = V.kaliteAdlari();

    function kaliteSatiri(kalem, ilk) {
      var i = ++kaliteSayac;
      var d = document.createElement('div');
      d.className = 'kalite-satir';
      d.dataset.kalite = i;
      var varsayilanAd = (kalem && kalem.ad && kalem.ad !== H.KALITESIZ) ? kalem.ad : '';
      d.innerHTML =
        '<input type="text" class="kalite-ad" id="ka' + i + '" list="kaliteListesi" ' +
          'placeholder="' + (ilk ? 'Kalite adı (boş bırakılabilir)' : (kaliteSayac + '. kalite')) + '" ' +
          'autocomplete="off" value="' + kacir(varsayilanAd) + '">' +
        '<div class="onek kalite-kg">' +
          '<input type="text" inputmode="decimal" data-sayi id="kk' + i + '" ' +
            'placeholder="0" value="' + (kalem && kalem.kg ? kalem.kg : '') + '">' +
          '<span class="birim">kg</span></div>' +
        '<button type="button" class="alim-sil kalite-sil" aria-label="Kaldır">✕</button>';
      el('altKaliteler').appendChild(d);
      $('.kalite-sil', d).onclick = function () {
        if (el('altKaliteler').children.length <= 1) return hata('En az bir satır olmalı');
        d.remove(); tazele();
      };
      A.sayiAlanlariniBagla(p, ipuclari);
      return d;
    }

    function kaliteler() {
      return Array.prototype.map.call(el('altKaliteler').children, function (d) {
        var i = d.dataset.kalite;
        return { ad: deger('ka' + i) || H.KALITESIZ, kg: sayi('kk' + i) };
      });
    }
    function altToplam() {
      return kaliteler().reduce(function (t, x) { return t + x.kg; }, 0);
    }

    function tumu() {
      var s = kaliteler();
      var g = el('altKaliteler').children;
      for (var j = 0; j < g.length; j++) {
        $('.kalite-sil', g[j]).style.visibility = g.length > 1 ? '' : 'hidden';
      }
      return s;
    }

    function tamamMi() { return el('f_tamam').checked; }
    el('f_tamam').onchange = function () { tazele(); };

    function havuzToplam() {
      var t = 0;
      hazirPartiler.forEach(function (pp) { t += kalanHam[pp.id] || 0; });
      return t;
    }

    /* İstenen toplamı en eski partiden başlayarak partilere böler */
    el('tumuGonder').onclick = function () {
      var hv = havuzToplam();
      if (hv <= 0.5) return hata('Elenmemiş ham mal kalmamış');
      var istenen = sayi('f_toplamGiren');
      if (istenen <= 0) {
        istenen = hv;                       // miktar yazılmadıysa tamamı
        el('f_toplamGiren').value = n0(hv);
      }
      var kalan = istenen, kullanilan = 0;
      hazirPartiler.forEach(function (pp) {
        var alan = el('gi_' + pp.id);
        if (!alan) return;
        var al = Math.min(kalan, kalanHam[pp.id] || 0);
        alan.value = al > 0.0001 ? n0(al) : '';
        if (al > 0.0001) { kalan -= al; kullanilan++; }
      });
      tazele();
      if (kalan > 0.5) A.bildir('Depoda ' + kgTam(hv) + ' var — ' + kgTam(kalan) + ' eksik');
      else A.bildir(kullanilan + ' partiden dağıtıldı');
    };

    function tazele() {
      /* --- parti girdileri --- */
      var hv = havuzToplam();
      el('tumuKg').textContent = hv > 0.5 ? kgTam(hv) : 'yok';
      el('tumuGonder').disabled = hv <= 0.5;
      el('tumuGonder').classList.toggle('pasif', hv <= 0.5);

      var gr = girdiler();
      var girenSimdi = girenToplam();
      var asim = false;
      partiler.forEach(function (pp) {
        var ip = el('gi_' + pp.id + '_ipucu');
        if (!ip) return;
        var v = sayi('gi_' + pp.id);
        var kalan = kalanHam[pp.id] || 0;
        if (v > kalan + 0.5) {
          asim = true;
          ip.className = 'ipucu hata';
          ip.innerHTML = '⚠️ Bu partide sadece ' + kgTam(kalan) + ' var';
        } else if (v > 0) {
          ip.className = 'ipucu vurgulu';
          ip.innerHTML = kalan - v > 0.5 ? kgTam(kalan - v) + ' kalacak' : 'tamamı gidiyor';
        } else { ip.className = 'ipucu'; ip.innerHTML = ''; }
      });

      var gip = el('f_giren_ipucu');
      if (asim) {
        gip.className = 'ipucu hata';
        gip.innerHTML = 'Bir partide stoktan fazla miktar var.';
      } else if (gr.length > 1) {
        gip.className = 'ipucu vurgulu';
        gip.innerHTML = '<b>' + gr.length + ' parti · toplam ' + kgTam(girenSimdi) + '</b> — ' +
          'çıktılar giren kilo oranında paylaştırılacak (' +
          gr.map(function (x) {
            return kacir(x.kod) + ' %' + Math.round(x.girenKg / girenSimdi * 100);
          }).join(' · ') + ')';
      } else if (girenSimdi > 0) {
        gip.className = 'ipucu vurgulu';
        gip.innerHTML = 'Toplam ' + kgTam(girenSimdi);
      } else {
        gip.className = 'ipucu';
        gip.innerHTML = 'Depoda ' + kgTam(hv) + ' ham mal bekliyor.';
      }

      /* --- eleme ücreti: kilo başına ↔ toplam --- */
      var tip = (($('input[name=ucretTipi]:checked', p) || {}).value) || 'kg';
      var ucretGirilen = sayi('f_ucret');
      var girenKg = girenToplam();
      var ucretToplam = H.giderTutari(tip, ucretGirilen, girenKg);
      el('f_ucret_birim').textContent = H.giderBirimiAdi(tip);
      var uip = el('f_ucret_ipucu');
      // Alım fiyatından pahalı eleme gerçekçi değil — büyük ihtimalle
      // toplam tutar yanlışlıkla "kilo başına" alanına yazılmıştır.
      // Birden çok parti varsa ağırlıklı ortalama alım fiyatı
      var alimFiyat = 0, agirlik = 0;
      girdiler().forEach(function (x) {
        var pp = partiler.find(function (y) { return y.id === x.partiId; });
        if (!pp) return;
        alimFiyat += (pp.birimFiyat || 0) * x.girenKg;
        agirlik += x.girenKg;
      });
      alimFiyat = agirlik > 0 ? alimFiyat / agirlik : 0;
      // Kilo başına düşen eleme ücreti, nohudun kilo fiyatını geçemez
      var etkinKg = girenKg > 0 ? ucretToplam / girenKg : 0;
      var sacma = tip !== 'goturu' && alimFiyat > 0 && etkinKg > alimFiyat;

      if (sacma) {
        uip.className = 'ipucu hata';
        uip.innerHTML = '⚠️ Kilo başına ' + n0(etkinKg) + ' T düşüyor; nohudun alım fiyatı ' +
          n0(alimFiyat) + ' T/kg. Eleme nohuttan pahalı olamaz — ' +
          'birim yanlış olabilir, <b>Götürü</b>\u0027yü dene.';
      } else if (ucretGirilen > 0) {
        uip.className = 'ipucu vurgulu';
        if (tip === 'goturu') {
          uip.innerHTML = A.T(ucretToplam) +
            (girenKg > 0 ? ' — kilo başına <b>' + n0(etkinKg) + ' T/kg</b>' : '') +
            (kasa2.ortKur > 0 ? ' ≈ ' + A.U(ucretToplam / kasa2.ortKur) : '');
        } else if (girenKg > 0) {
          uip.innerHTML = n0(ucretGirilen) + ' ' + H.giderBirimiAdi(tip) + ' × ' +
            (tip === 'ton' ? n0(girenKg / 1000) + ' ton' : kgTam(girenKg)) +
            ' = <b>' + A.T(ucretToplam) + '</b>' +
            (kasa2.ortKur > 0 ? ' ≈ ' + A.U(ucretToplam / kasa2.ortKur) : '');
        } else {
          uip.innerHTML = 'Giren miktarı yaz, toplam kendiliğinden çıkar';
        }
      } else {
        uip.className = 'ipucu';
        uip.innerHTML = tip === 'goturu'
          ? 'Eleme işinin tamamı için anlaştığın tutar'
          : 'Elemeciye ' + (tip === 'ton' ? 'ton' : 'kilo') + ' başına ödediğin fiyat';
      }

      tumu();
      var altT = altToplam();
      var kaliteSayisi = kaliteler().filter(function (x) { return x.kg > 0; }).length;
      var aip = el('f_alt_ipucu');
      if (aip) {
        aip.className = altT > 0 ? 'ipucu vurgulu' : 'ipucu';
        aip.innerHTML = altT > 0
          ? 'Toplam <b>' + kgTam(altT) + '</b>' +
            (kaliteSayisi > 1 ? ' · ' + kaliteSayisi + ' kalite' : '')
          : 'Farklı fiyattan satılacaksa kaliteleri ayır — her biri kendi fiyatıyla satılır.';
      }

      var t = tamamMi();
      el('sonucAlanlari').style.display = t ? '' : 'none';
      var giren = girenToplam(), ust = sayi('f_ust'), alt = altToplam(), fire = sayi('f_fire');
      var d = el('denetim');
      if (!t) {
        d.innerHTML = giren > 0
          ? '<div class="uyari-serit"><span class="simge">⏳</span><div>' +
            '<b>' + kgTam(giren) + ' elemede görünecek</b>' +
            'Sonuçlar gelince bu kaydı açıp rakamları yaz.</div></div>'
          : '';
        return;
      }
      if (giren <= 0 || (ust + alt + fire) <= 0) { d.innerHTML = ''; return; }
      var dn = H.elemeDenetim(giren, ust, alt, fire);
      var rand = ust / giren;
      var h = '';
      if (dn.uyari) {
        h += '<div class="uyari-serit kotu"><span class="simge">⚠️</span><div>' +
          '<b>Rakamlar tutmuyor</b>Giren ' + kgTam(giren) + ', çıkan toplam ' + kgTam(dn.cikan) +
          ' — arada <b>' + kgTam(Math.abs(dn.fark)) + '</b> ' +
          (dn.fark > 0 ? 'eksik' : 'fazla') + ' var.</div></div>';
      }
      h += '<div class="kart" style="margin-top:10px"><div class="kart-ic">' +
        '<div class="satir-arasi" style="margin-bottom:8px">' +
        '<span class="kucuk-yazi">Sonuç</span>' +
        '<span class="rozet ' + (rand >= 0.8 ? 'arti' : rand >= 0.7 ? 'uyari' : 'eksi') + '">randıman ' +
        yuzde(rand) + '</span></div>' +
        '<div class="randiman-cubuk">' +
          (ust > 0 ? '<div class="r-ust" style="flex:' + ust + '">' + (ust / dn.cikan > .12 ? yuzde(ust / dn.cikan, 0) : '') + '</div>' : '') +
          (alt > 0 ? '<div class="r-alt" style="flex:' + alt + '">' + (alt / dn.cikan > .12 ? yuzde(alt / dn.cikan, 0) : '') + '</div>' : '') +
          (fire > 0 ? '<div class="r-fire" style="flex:' + fire + '">' + (fire / dn.cikan > .12 ? yuzde(fire / dn.cikan, 0) : '') + '</div>' : '') +
        '</div>' +
        '<div class="randiman-aciklama">' +
          '<span><i style="background:#2f7d55"></i>8mm+ ' + kgTam(ust) + '</span>' +
          '<span><i style="background:#b78a3c"></i>8mm− ' + kgTam(alt) + '</span>' +
          '<span><i style="background:#9a948a"></i>fire ' + kgTam(fire) + '</span>' +
        '</div></div></div>';
      d.innerHTML = h;
    }

    girdiSatirlariniYaz();
    if (!k && onSecili && el('gi_' + onSecili)) {
      el('gi_' + onSecili).value = n0(kalanHam[onSecili] || 0);
    }

    (function () {
      var mevcut = k ? H.altKalemleri(k) : [];
      if (!mevcut.length) mevcut = [{}];
      mevcut.forEach(function (kl, n) { kaliteSatiri(kl, n === 0); });
    })();
    el('kaliteEkle').onclick = function () {
      var d = kaliteSatiri({}, false);
      $('.kalite-ad', d).focus();
      tazele();
    };

    bagla(p, !!k, 'elemeler', id, function () {
      var gr = girdiler();
      var giren = girenToplam();
      if (giren <= 0) return hata('En az bir partiden giren miktarı gir');
      var t = tamamMi();
      var kayit = {
        tarih: deger('f_tarih') || bugun(),
        no: deger('f_kayitNo'),
        partiler: gr.map(function (x) { return { partiId: x.partiId, girenKg: x.girenKg }; }),
        partiId: gr[0].partiId,          // eski uyumluluk
        girenKg: giren,
        tamamlandi: t,
        ustKg: t ? sayi('f_ust') : 0,
        altKg: t ? altToplam() : 0,
        altKalemler: t ? kaliteler().filter(function (x) { return x.kg > 0; }) : [],
        fireKg: t ? sayi('f_fire') : 0,
        ucretTipi: (($('input[name=ucretTipi]:checked', p) || {}).value) || 'goturu',
        ucretBirim: 0,
        ucret: 0,
        not: deger('f_not')
      };
      kayit.ucretBirim = sayi('f_ucret');
      kayit.ucret = H.giderTutari(kayit.ucretTipi, kayit.ucretBirim, giren);
      if (t && (kayit.ustKg + kayit.altKg + kayit.fireKg) <= 0) {
        return hata('Eleme sonuçlarını gir (ya da "eleme bitti" işaretini kaldır)');
      }
      if (k) V.guncelle('elemeler', id, kayit); else V.ekle('elemeler', kayit);
      tamamla(k ? 'Eleme güncellendi' : 'Eleme kaydedildi');
    }, ipuclari);
  }

  /* ============================================================
     8MM ALTI SATIŞI — birden çok partiden, tek kayıtta

     Elek altı genelde parti parti değil, toplu satılır. Kalite adına
     göre bütün partilerin stoğu havuzda toplanır; satış eskiden yeniye
     (FIFO) dağıtılır. Hangi partiden ne kadar düştüğü kaydedilir —
     çünkü bu gelir o partinin 8mm+ maliyetinden mahsup edilir.
     ============================================================ */
  function formAltSatis(id, onSecili) {
    var k = id ? V.bul('altSatislar', id) : null;
    var veri = V.hepsi();
    var kasa = H.kasa(veri);
    var havuz = H.altStokHavuzu(veri, k ? k.id : null);

    if (!havuz.length) {
      return A.panelAc('8mm altı satışı', '<div class="bos-durum"><div class="simge">🪙</div>' +
        '<p>Satılabilir 8mm altı nohut görünmüyor.<br>' +
        'Önce bir eleme kaydı gir — 8mm altı oradan depoya girer.</p></div>');
    }

    var govde =
      alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
      '<h2 class="bolum" style="margin-top:4px">Satılan kaliteler</h2>' +
      '<div class="ipucu" style="margin:-4px 0 10px">Stok, bütün partilerden toplanır. ' +
      'Satış en eski partiden başlayarak düşülür.</div>' +
      '<div id="satirlar"></div>' +
      '<button class="dugme tam" type="button" id="kaliteEkleD">+ Kalite ekle</button>' +
      '<div id="satisOzet"></div>' +
      '<div id="dagilimKutu"></div>' +
      alan({ id: 'f_alici', etiket: 'Alıcı', deger: k ? k.alici : '', yerTutucu: 'örn. Tahran alıcı' });

    var p = A.panelAc(k ? '8mm altı satışını düzenle' : '8mm altı satışı', govde, ayak(!!k));

    var sayac = 0;

    function satirYaz(kalem) {
      var i = ++sayac;
      var secim = kalem && kalem.ad ? kalem.ad : havuz[0].ad;
      var d = document.createElement('div');
      d.className = 'alim-satir';
      d.dataset.satir = i;
      d.innerHTML =
        '<div class="alim-tepe">' +
          '<span class="alim-no">' + i + '</span>' +
          '<select id="sk' + i + '" class="kalite-sec">' +
            havuz.map(function (x) {
              return '<option value="' + kacir(x.ad) + '"' + (x.ad === secim ? ' selected' : '') +
                '>' + kacir(x.ad) + ' — ' + kgTam(x.kalanKg) + ' var (' +
                x.partiler.length + ' parti)</option>';
            }).join('') +
          '</select>' +
          '<button type="button" class="alim-sil" aria-label="Kaldır">✕</button>' +
        '</div>' +
        '<div class="ikili">' +
          '<div class="onek"><input type="text" inputmode="decimal" data-sayi id="sg' + i + '" ' +
            'placeholder="kg" value="' + (kalem && kalem.kg ? kalem.kg : '') + '">' +
            '<span class="birim">kg</span></div>' +
          '<div class="onek"><input type="text" inputmode="decimal" data-sayi id="sf' + i + '" ' +
            'placeholder="fiyat" value="' + (kalem && kalem.birimFiyat ? kalem.birimFiyat : '') + '">' +
            '<span class="birim">T/kg</span></div>' +
        '</div>' +
        '<div class="alim-alt"><span class="alim-tutar" id="st' + i + '">—</span>' +
          '<button type="button" class="dugme kucuk" data-tumu="' + i + '">Tümü</button></div>' +
        '<div class="ipucu" id="su' + i + '"></div>';
      el('satirlar').appendChild(d);

      $('.alim-sil', d).onclick = function () {
        if (el('satirlar').children.length <= 1) return hata('En az bir satır olmalı');
        d.remove(); tazele();
      };
      $('[data-tumu]', d).onclick = function () {
        var ad = deger('sk' + i);
        var h = havuz.find(function (x) { return x.ad === ad; });
        if (!h) return;
        // aynı kaliteyi başka satır da kullanıyorsa onu düş
        var baska = 0;
        satirlar().forEach(function (r) { if (r.no !== String(i) && r.ad === ad) baska += r.kg; });
        el('sg' + i).value = n0(Math.max(0, h.kalanKg - baska));
        el('sg' + i).dispatchEvent(new Event('input', { bubbles: true }));
      };
      A.sayiAlanlariniBagla(p, ipuclari);
      return d;
    }

    function satirlar() {
      return Array.prototype.map.call(el('satirlar').children, function (d) {
        var i = d.dataset.satir;
        var kg = sayi('sg' + i), fi = sayi('sf' + i);
        return { no: i, ad: deger('sk' + i), kg: kg, birimFiyat: fi, tutar: kg * fi };
      });
    }

    /* Her kalite için FIFO dağılımı — satırlar aynı kaliteyi paylaşabilir */
    function dagit() {
      var istenen = {};
      satirlar().forEach(function (r) {
        if (r.kg > 0) istenen[r.ad] = (istenen[r.ad] || 0) + r.kg;
      });
      var sonuc = {}, eksikler = [];
      Object.keys(istenen).forEach(function (ad) {
        var d = H.altDagit(havuz, ad, istenen[ad]);
        sonuc[ad] = d.dagilim;
        if (d.eksik > 0.5) eksikler.push({ ad: ad, eksik: d.eksik });
      });
      return { sonuc: sonuc, eksikler: eksikler, istenen: istenen };
    }

    function tazele() {
      var sr = satirlar();
      var g = el('satirlar').children;
      for (var j = 0; j < g.length; j++) {
        $('.alim-sil', g[j]).style.visibility = g.length > 1 ? '' : 'hidden';
      }

      var d = dagit();
      var toplamKg = 0, toplamT = 0;
      sr.forEach(function (r) {
        el('st' + r.no).textContent = r.tutar > 0 ? A.T(r.tutar) : '—';
        var h = havuz.find(function (x) { return x.ad === r.ad; });
        var kalan = h ? h.kalanKg : 0;
        var u = el('su' + r.no);
        var eks = d.eksikler.find(function (x) { return x.ad === r.ad; });
        if (eks) {
          u.className = 'ipucu hata';
          u.innerHTML = '⚠️ ' + kacir(r.ad) + ' stoğu yetmiyor — toplam ' + kgTam(kalan) + ' var';
        } else {
          u.className = 'ipucu';
          u.innerHTML = kalan > 0.5 ? 'Havuzda ' + kgTam(kalan) : '';
        }
        toplamKg += r.kg; toplamT += r.tutar;
      });

      el('satisOzet').innerHTML = toplamT > 0
        ? '<div class="sonuc-kutu" style="margin:12px 0 4px">' +
          '<div class="baslik">' + sr.filter(function (x) { return x.kg > 0; }).length +
            ' kalite · ' + kgTam(toplamKg) + '</div>' +
          '<div class="buyuk" style="font-size:24px">' + A.Tk(toplamT) + '</div>' +
          '<div class="yan">' + A.T(toplamT) +
            (kasa.ortKur > 0 ? ' ≈ ' + A.U(toplamT / kasa.ortKur) : '') + '</div>' +
          '<div class="not">Ortalama ' + n0(toplamKg > 0 ? toplamT / toplamKg : 0) + ' T/kg' +
            (d.eksikler.length ? '<br><b style="color:var(--eksi)">⚠️ Stoktan fazla satış var</b>' : '') +
          '</div></div>'
        : '';

      /* hangi partiden ne kadar düşecek — kullanıcı kaydetmeden görsün */
      var satirlarHtml = [];
      Object.keys(d.sonuc).forEach(function (ad) {
        d.sonuc[ad].forEach(function (x) {
          satirlarHtml.push('<div class="dagilim-satir">' +
            '<span class="d-parti">' + kacir(x.kod) + '</span>' +
            '<span class="d-kalite">' + kacir(ad) + '</span>' +
            '<span class="d-kg">' + kgTam(x.kg) + '</span></div>');
        });
      });
      el('dagilimKutu').innerHTML = satirlarHtml.length
        ? '<div class="kart" style="margin-top:10px"><div class="kart-ic">' +
          '<div class="kucuk-yazi" style="margin-bottom:8px">' +
          '<b>Hangi partiden düşecek</b> — en eskiden başlayarak</div>' +
          satirlarHtml.join('') + '</div></div>'
        : '';
    }

    var ipuclari = { __hepsi: tazele };

    el('kaliteEkleD').onclick = function () { satirYaz(null); tazele(); };

    (function () {
      var mevcut = k ? H.satisKalemleri(k) : [];
      if (mevcut.length) {
        // düzenlemede kaliteye göre topla (parti dağılımı yeniden hesaplanacak)
        var topla = {};
        mevcut.forEach(function (x) {
          if (!topla[x.ad]) topla[x.ad] = { ad: x.ad, kg: 0, birimFiyat: x.birimFiyat };
          topla[x.ad].kg += x.kg;
        });
        Object.keys(topla).forEach(function (a) { satirYaz(topla[a]); });
      } else {
        satirYaz(null);
      }
    })();

    bagla(p, !!k, 'altSatislar', id, function () {
      var sr = satirlar().filter(function (r) { return r.kg > 0; });
      if (!sr.length) return hata('En az bir kalite için miktar gir');
      var eksikFiyat = sr.filter(function (r) { return !(r.birimFiyat > 0); });
      if (eksikFiyat.length) return hata(eksikFiyat.length + ' satırda fiyat eksik');

      var d = dagit();
      if (d.eksikler.length) {
        return hata(d.eksikler[0].ad + ' stoğu yetmiyor');
      }

      /* Kaliteye göre FIFO dağılımını partili kalemlere aç */
      var kalemler = [];
      var fiyatlar = {};
      sr.forEach(function (r) { fiyatlar[r.ad] = r.birimFiyat; });
      Object.keys(d.sonuc).forEach(function (ad) {
        d.sonuc[ad].forEach(function (x) {
          kalemler.push({
            partiId: x.partiId, ad: ad, kg: x.kg,
            birimFiyat: fiyatlar[ad], tutar: x.kg * fiyatlar[ad]
          });
        });
      });

      var toplamKg = 0, toplamT = 0;
      kalemler.forEach(function (x) { toplamKg += x.kg; toplamT += x.tutar; });

      var partiIds = [];
      kalemler.forEach(function (x) {
        if (partiIds.indexOf(x.partiId) === -1) partiIds.push(x.partiId);
      });

      var kayit = {
        tarih: deger('f_tarih') || bugun(),
        kalemler: kalemler,
        partiId: partiIds[0] || null,     // eski uyumluluk
        partiIds: partiIds,
        kg: toplamKg, tutar: toplamT,
        birimFiyat: toplamKg > 0 ? toplamT / toplamKg : 0,
        alici: deger('f_alici')
      };
      if (k) V.guncelle('altSatislar', id, kayit); else V.ekle('altSatislar', kayit);
      tamamla((k ? 'Satış güncellendi' : 'Satış kaydedildi') +
              (partiIds.length > 1 ? ' · ' + partiIds.length + ' partiden' : ''));
    }, ipuclari);

    tazele();
  }

  /* ============================================================
     TÜCCARA ÖDEME — sonradan yapılan borç ödemesi

     Ödeme tüccara yapılır, o tüccarın EN ESKİ borcundan başlayarak
     düşülür. Kasadan ödeme tarihinde çıkar (alım tarihinde değil).
     ============================================================ */
  function formOdeme(id, onSecili) {
    var k = id ? V.bul('odemeler', id) : null;
    var veri = V.hepsi();
    var kasa = H.kasa(veri);
    var dagilim = H.borcDagilimi(veri);

    var borclular = Object.keys(dagilim.tuccar)
      .map(function (ad) { return dagilim.tuccar[ad]; })
      .filter(function (t) { return t.kalanBorc > 0.5 || (k && k.satici === t.ad); })
      .sort(function (a, b) { return b.kalanBorc - a.kalanBorc; });

    if (!borclular.length && !k) {
      return A.panelAc('Tüccara ödeme', '<div class="bos-durum"><div class="simge">💳</div>' +
        '<p>Ödenmemiş borç görünmüyor.<br>' +
        'Alım kaydında bir satırı <b>Borç</b> ya da <b>Kısmi</b> işaretlersen burada çıkar.</p></div>');
    }

    var secili = k ? k.satici : (onSecili || borclular[0].ad);

    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_tarih', etiket: 'Ödeme tarihi', tip: 'date', deger: k ? k.tarih : bugun() }) +
        alan({ id: 'f_satici', etiket: 'Kime ödendi', tip: 'secim', deger: secili,
               secenekler: borclular.map(function (t) {
                 return { deger: t.ad, ad: t.ad + ' — ' + A.Tk(t.kalanBorc) + ' borç' };
               }) }) +
      '</div>' +
      '<div class="alan">' +
        '<label for="f_tutar">Ödenen tutar</label>' +
        '<div class="onek">' +
          '<input type="text" inputmode="decimal" data-sayi id="f_tutar" autocomplete="off" ' +
            'value="' + (k ? k.tutar : '') + '" placeholder="0"><span class="birim">T</span>' +
        '</div>' +
        '<button type="button" class="tumu-dugme" id="tumuOde">' +
          '<span class="tumu-sol">Borcun tamamını öde</span>' +
          '<span class="tumu-kg" id="tumuBorc">—</span></button>' +
        '<div class="ipucu" id="f_tutar_ipucu"></div>' +
      '</div>' +
      alan({ id: 'f_aciklama', etiket: 'Açıklama', deger: k ? k.aciklama : '',
             yerTutucu: 'örn. nakit, havale' }) +
      '<div id="odemeDagilim"></div>';

    var p = A.panelAc(k ? 'Ödemeyi düzenle' : 'Tüccara ödeme', govde, ayak(!!k));

    function seciliTuccar() {
      var ad = deger('f_satici');
      return dagilim.tuccar[ad] || null;
    }
    function kalanBorc() {
      var t = seciliTuccar();
      if (!t) return 0;
      // düzenlemede kendi tutarını geri say
      return t.kalanBorc + (k && k.satici === t.ad ? (Number(k.tutar) || 0) : 0);
    }

    el('tumuOde').onclick = function () {
      var b = kalanBorc();
      if (b <= 0.5) return hata('Bu tüccara borç görünmüyor');
      el('f_tutar').value = n0(b);
      el('f_tutar').dispatchEvent(new Event('input', { bubbles: true }));
    };

    bagla(p, !!k, 'odemeler', id, function () {
      var tutar = sayi('f_tutar');
      if (tutar <= 0) return hata('Ödenen tutarı gir');
      var kayit = {
        tarih: deger('f_tarih') || bugun(),
        satici: deger('f_satici'),
        tutar: tutar,
        aciklama: deger('f_aciklama')
      };
      if (k) V.guncelle('odemeler', id, kayit); else V.ekle('odemeler', kayit);
      tamamla(k ? 'Ödeme güncellendi' : 'Ödeme kaydedildi');
    }, {
      __hepsi: function () {
        var t = seciliTuccar();
        var borc = kalanBorc();
        var tutar = sayi('f_tutar');

        el('tumuBorc').textContent = borc > 0.5 ? A.T(borc) : 'yok';
        el('tumuOde').disabled = borc <= 0.5;
        el('tumuOde').classList.toggle('pasif', borc <= 0.5);
        el('tumuOde').classList.toggle('secili', borc > 0.5 && Math.abs(tutar - borc) < 0.5);

        var ip = el('f_tutar_ipucu');
        if (tutar > borc + 0.5) {
          ip.className = 'ipucu hata';
          ip.innerHTML = '⚠️ Borçtan fazla: bu tüccara ' + A.T(borc) + ' borcun var.';
        } else if (tutar > 0) {
          ip.className = 'ipucu vurgulu';
          ip.innerHTML = A.Tk(tutar) +
            (kasa.ortKur > 0 ? ' ≈ ' + A.U(tutar / kasa.ortKur) : '') +
            ' · ödeme sonrası kalan borç <b>' + A.T(Math.max(0, borc - tutar)) + '</b>';
        } else {
          ip.className = 'ipucu';
          ip.innerHTML = borc > 0.5 ? 'Bu tüccara ' + A.T(borc) + ' borcun var.' : '';
        }

        // hangi partilerin borcu kapanacak
        var d = el('odemeDagilim');
        if (!t || tutar <= 0) { d.innerHTML = ''; return; }
        var kalan = tutar, satirlar = [];
        t.satirlar.forEach(function (x) {
          var acik = x.borc - x.odenen + (k && k.satici === t.ad ? 0 : 0);
          if (kalan <= 0.0001 || acik <= 0.0001) return;
          var al = Math.min(kalan, acik);
          satirlar.push('<div class="dagilim-satir">' +
            '<span class="d-parti">' + kacir(x.kod) + '</span>' +
            '<span class="d-kalite">' + A.tarihGoster(x.tarih) + '</span>' +
            '<span class="d-kg">' + A.T(al) + '</span></div>');
          kalan -= al;
        });
        d.innerHTML = satirlar.length
          ? '<div class="kart" style="margin-top:10px"><div class="kart-ic">' +
            '<div class="kucuk-yazi" style="margin-bottom:8px"><b>Hangi partinin borcu kapanacak</b>' +
            ' — en eskiden başlayarak</div>' + satirlar.join('') +
            (kalan > 0.5 ? '<div class="ipucu hata" style="margin-top:8px">' +
              A.T(kalan) + ' karşılıksız kalıyor</div>' : '') +
            '</div></div>'
          : '';
      }
    });
  }

  /* ============================================================
     GENEL GİDER — seyahat ve işletme masrafları

     maliyetine binmez. Bu ayrım önemli: karıştırılırsa USD/ton
     maliyet rakamı bozulur ve yanlış fiyat verilir.

  function formGenelGider(id) {

    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
        alan({ id: 'f_kategori', etiket: 'Kategori', tip: 'secim',
               secenekler: H.GENEL_GIDER_KATEGORILERI.map(function (x) {
                 return { deger: x.ad, ad: x.simge + '  ' + x.ad };
               }), deger: k ? k.kategori : 'Otel / konaklama' }) +
      '</div>' +
      '<div class="alan"><label>Para birimi</label><div class="secim-satir">' +
        [['TMN', 'Tümen'], ['USD', 'Dolar']].map(function (d) {
          return '<label><input type="radio" name="pb" value="' + d[0] + '"' +
            ((k ? k.paraBirimi : 'TMN') === d[0] ? ' checked' : '') + '><span>' + d[1] + '</span></label>';
        }).join('') + '</div></div>' +
      alan({ id: 'f_tutar', etiket: 'Tutar', tip: 'sayi', deger: k ? k.tutar : '' }) +
      '<div class="alan">' +
        '<label for="f_gezi">Gezi / dönem</label>' +
        '<input type="text" id="f_gezi" list="geziListesi" autocomplete="off" ' +
          'placeholder="örn. Ağustos 2026 İran" value="' + kacir(k ? (k.gezi || '') : '') + '">' +
        '<datalist id="geziListesi">' +
          geziler.map(function (a) { return '<option value="' + kacir(a) + '">'; }).join('') +
        '</datalist>' +
        '<div class="ipucu">Aynı adı kullanırsan o gezinin toplam masrafını raporda görürsün.</div>' +
      '</div>' +
      alan({ id: 'f_aciklama', etiket: 'Açıklama', deger: k ? k.aciklama : '',
             yerTutucu: 'örn. Tahran 3 gece' }) +
      '<div class="uyari-serit"><span class="simge">ℹ️</span><div>' +
      '<b>Bu gider mala binmez</b>Kasadan düşer ama hiçbir partinin maliyetine ' +
      'eklenmez. Nohudun USD/ton maliyeti bundan etkilenmez.</div></div>';

    var p = A.panelAc(k ? 'Genel gideri düzenle' : 'Genel gider', govde, ayak(!!k));

    bagla(p, !!k, 'genelGiderler', id, function () {
      var tutar = sayi('f_tutar');
      if (tutar <= 0) return hata('Tutarı gir');
      var kayit = {
        tarih: deger('f_tarih') || bugun(),
        kategori: deger('f_kategori'),
        paraBirimi: ($('input[name=pb]:checked', p) || {}).value || 'TMN',
        tutar: tutar,
        gezi: deger('f_gezi'),
        aciklama: deger('f_aciklama')
      };
      if (k) V.guncelle('genelGiderler', id, kayit); else V.ekle('genelGiderler', kayit);
      tamamla(k ? 'Gider güncellendi' : 'Genel gider kaydedildi');
    }, {
      __hepsi: function () {
        var t = sayi('f_tutar');
        var pb = ($('input[name=pb]:checked', p) || {}).value || 'TMN';
        var ip = el('f_tutar_ipucu');
        ip.className = t > 0 ? 'ipucu vurgulu' : 'ipucu';
        ip.innerHTML = t > 0
          ? (pb === 'USD' ? A.U(t)
             : A.T(t) + (kasa.ortKur > 0 ? ' ≈ ' + A.U(t / kasa.ortKur) : ''))
          : '';
      }
    });
    Array.prototype.forEach.call(p.querySelectorAll('input[name=pb]'), function (r) {
      r.onchange = function () { el('f_tutar').dispatchEvent(new Event('input')); };
    });
  }

  /* ============================================================
     HAM SATIŞ — elenmeden İran içinde satılan mal

     Maliyet kiloya göre paylaştırılır: satılan hamın payı partiden
     düşer, kalan pay elenen mala biner. Böylece hem ham satışın kârı
     görünür hem de 8mm+ maliyeti şişmez.
     ============================================================ */
  function formHamSatis(id, onSecili) {
    var k = id ? V.bul('hamSatislar', id) : null;
    var veri = V.hepsi();
    var kasa = H.kasa(veri);

    var ozetler = H.tumPartiler(veri).filter(function (o) {
      return o.elenmemisKg > 0.5 || (k && k.partiId === o.parti.id);
    });
    if (!ozetler.length) {
      return A.panelAc('Ham satış', '<div class="bos-durum"><div class="simge">🌾</div>' +
        '<p>Satılabilir elenmemiş ham mal görünmüyor.<br>' +
        'Partinin tamamı elenmiş ya da zaten satılmış.</p></div>');
    }

    var stok = {};
    ozetler.forEach(function (o) {
      stok[o.parti.id] = o.elenmemisKg + (k && k.partiId === o.parti.id ? (Number(k.kg) || 0) : 0);
    });
    var secilen = k ? k.partiId : (onSecili && stok[onSecili] ? onSecili : ozetler[0].parti.id);

    var govde =
      '<div class="ikili">' +
        alan({ id: 'f_tarih', etiket: 'Tarih', tip: 'date', deger: k ? k.tarih : bugun() }) +
        alan({ id: 'f_parti', etiket: 'Hangi partiden', tip: 'secim', deger: secilen,
               secenekler: ozetler.map(function (o) {
                 return { deger: o.parti.id,
                          ad: o.parti.kod + ' — ' + kgTam(stok[o.parti.id]) + ' ham var' };
               }) }) +
      '</div>' +
      '<div class="alan">' +
        '<label for="f_kg">Satılan miktar</label>' +
        '<div class="onek">' +
          '<input type="text" inputmode="decimal" data-sayi id="f_kg" autocomplete="off" ' +
            'placeholder="5.000" value="' + (k ? k.kg : '') + '">' +
          '<span class="birim">kg</span></div>' +
        '<button type="button" class="tumu-dugme" id="tumuGonder">' +
          '<span class="tumu-sol">Kalan ham malın tamamı</span>' +
          '<span class="tumu-kg" id="tumuKg">—</span></button>' +
        '<div class="ipucu" id="f_kg_ipucu"></div>' +
      '</div>' +
      alan({ id: 'f_fiyat', etiket: 'Satış fiyatı', tip: 'sayi', birim: 'T/kg',
             deger: k ? k.birimFiyat : '', yerTutucu: '520.000' }) +
      alan({ id: 'f_tutar', etiket: 'Toplam gelir', tip: 'sayi', birim: 'T',
             deger: k ? k.tutar : '' }) +
      alan({ id: 'f_alici', etiket: 'Alıcı', deger: k ? k.alici : '', yerTutucu: 'örn. Tebriz alıcı' }) +
      '<div id="hamOzet"></div>';

    var p = A.panelAc(k ? 'Ham satışı düzenle' : 'Ham satış', govde, ayak(!!k));

    function kalanKg() { return stok[deger('f_parti')] || 0; }
    function seciliOzet() {
      var pid = deger('f_parti');
      return ozetler.find(function (o) { return o.parti.id === pid; });
    }

    el('tumuGonder').onclick = function () {
      var kalan = kalanKg();
      if (kalan <= 0.5) return hata('Bu partide elenmemiş ham mal kalmamış');
      el('f_kg').value = n0(kalan);
      el('f_kg').dispatchEvent(new Event('input', { bubbles: true }));
      el('f_kg').focus();
    };

    var elleTutar = false;
    el('f_tutar').addEventListener('input', function () { elleTutar = true; });
    ['f_kg', 'f_fiyat'].forEach(function (a) {
      el(a).addEventListener('input', function () { elleTutar = false; });
    });

    bagla(p, !!k, 'hamSatislar', id, function () {
      var kg = sayi('f_kg'), tutar = sayi('f_tutar');
      if (kg <= 0) return hata('Satılan miktarı gir');
      if (tutar <= 0) return hata('Toplam geliri gir');
      var kayit = {
        tarih: deger('f_tarih') || bugun(), partiId: deger('f_parti'),
        kg: kg, birimFiyat: sayi('f_fiyat') || (tutar / kg),
        tutar: tutar, alici: deger('f_alici')
      };
      if (k) V.guncelle('hamSatislar', id, kayit); else V.ekle('hamSatislar', kayit);
      tamamla(k ? 'Ham satış güncellendi' : 'Ham satış kaydedildi');
    }, {
      __hepsi: function () {
        var kalan = kalanKg(), kg = sayi('f_kg'), fiyat = sayi('f_fiyat');
        if (!elleTutar && kg > 0 && fiyat > 0) el('f_tutar').value = n0(kg * fiyat);
        var tutar = sayi('f_tutar');

        el('tumuKg').textContent = kalan > 0.5 ? kgTam(kalan) : 'yok';
        el('tumuGonder').disabled = kalan <= 0.5;
        el('tumuGonder').classList.toggle('pasif', kalan <= 0.5);
        el('tumuGonder').classList.toggle('secili', kalan > 0.5 && Math.abs(kg - kalan) < 0.5);

        var ipk = el('f_kg_ipucu');
        if (kg > kalan + 0.5) {
          ipk.className = 'ipucu hata';
          ipk.innerHTML = '⚠️ Bu partide elenmemiş sadece ' + kgTam(kalan) + ' var.';
        } else {
          ipk.className = 'ipucu';
          ipk.innerHTML = 'Elenmemiş ' + kgTam(kalan) + ' bekliyor.';
        }

        var ipt = el('f_tutar_ipucu');
        ipt.className = tutar > 0 ? 'ipucu vurgulu' : 'ipucu';
        ipt.innerHTML = tutar > 0
          ? A.Tk(tutar) + (kasa.ortKur > 0 ? ' ≈ ' + A.U(tutar / kasa.ortKur) : '') : '';

        // kâr önizlemesi: bu malın partiden taşıdığı maliyet
        var o = seciliOzet();
        var d = el('hamOzet');
        if (!o || kg <= 0 || tutar <= 0 || o.hamKg <= 0) { d.innerHTML = ''; return; }
        var birimMaliyet = o.genelGiderTumen / o.hamKg;
        var maliyet = birimMaliyet * kg;
        var kar = tutar - maliyet;
        d.innerHTML = '<div class="sonuc-kutu" style="margin-top:14px">' +
          '<div class="baslik">Bu satışın kârı</div>' +
          '<div class="buyuk" style="font-size:24px;color:' +
            (kar >= 0 ? 'var(--arti)' : 'var(--eksi)') + '">' +
            (kar < 0 ? '−' : '') + A.T(Math.abs(kar)) + '</div>' +
          '<div class="yan">satış ' + A.T(tutar) + ' − maliyet ' + A.T(maliyet) + '</div>' +
          '<div class="not">Bu malın partiden taşıdığı maliyet ' + n0(birimMaliyet) +
            ' T/kg. Satılan kısmın payı partiden düşülür, kalan pay elenen mala biner — ' +
            '8mm+ maliyeti bu satıştan etkilenmez.</div></div>';
      }
    });
  }

  /* ============================================================
     SEVKİYAT
     ============================================================ */
  function formSevkiyat(id) {
    var k = id ? V.bul('sevkiyatlar', id) : null;
    var veri = V.hepsi();

      '</div>' +
      '<div class="ikili">' +
        alan({ id: 'f_plaka', etiket: 'Kamyon / plaka', deger: k ? k.plaka : '' }) +
        alan({ id: 'f_sofor', etiket: 'Şoför', deger: k ? k.sofor : '' }) +
      '</div>' +
      alan({ id: 'f_alici', etiket: 'Alıcı / varış', deger: k ? k.alici : '' }) +
      '<div class="alan"><label>Durum</label><div class="secim-satir">' +
        SEVKIYAT_DURUMLARI.map(function (d) {
          return '<label><input type="radio" name="durum" value="' + d + '"' +

        }).join('') + '</div></div>' +
      '<div class="alan"><label>Toplam yüklenecek miktar</label>' +
        '<div class="onek">' +
          '<input type="text" inputmode="decimal" data-sayi id="f_toplam" placeholder="0">' +
          '<span class="birim">kg</span></div>' +
        '<button type="button" class="tumu-dugme" id="dagitDugme">' +
          '<span class="tumu-sol">En eski partiden başlayarak dağıt</span>' +
          '<span class="tumu-kg" id="havuzKg">—</span></button>' +
        '<div class="ipucu" id="f_toplam_ipucu">Miktarı yaz ve dağıt — ' +
          'aşağıdaki satırlar kendiliğinden dolar. İstersen elle de düzeltebilirsin.</div>' +
      '</div>' +
      '<div class="alan"><label>Hangi partiden ne kadar yüklendi?</label>' +
        '<div class="ipucu" style="margin-bottom:8px">Yüklemediğin partileri boş bırak.</div>' +
        ozetler.map(function (o) {
          var stok = o.ustStokKg + (mevcut[o.parti.id] || 0);
          return '<div class="alan" style="margin-bottom:11px">' +
            '<label style="display:flex;justify-content:space-between">' +
            '<span>' + kacir(o.parti.kod) + ' · ' + A.tarihGoster(o.parti.tarih) + '</span>' +
            '<span style="color:var(--metin3);font-weight:400">' + kgTam(stok) + ' var · ' +
            A.nAkilli(o.usdTon) + ' $/t</span></label>' +
            '<div class="onek"><input type="text" inputmode="decimal" data-sayi ' +
            'id="kl_' + o.parti.id + '" data-stok="' + stok + '" ' +
            'value="' + (mevcut[o.parti.id] || '') + '" placeholder="0">' +
            '<span class="birim">kg</span></div>' +
            '<div class="ipucu" id="kl_' + o.parti.id + '_ipucu"></div></div>';
        }).join('') +
      '</div>' +
      '<div id="sevkOzet"></div>' +
      alan({ id: 'f_satis', etiket: 'Satış fiyatı (varsa)', tip: 'sayi', birim: '$/t',
             deger: k ? k.satisUsdTon : '', ipucu: 'Girersen kâr hesaplanır.' });

    var p = A.panelAc(k ? 'Sevkiyatı düzenle' : 'Yeni sevkiyat', govde, ayak(!!k));

    function kalemler() {
      var s = [];
      ozetler.forEach(function (o) {
        var v = sayi('kl_' + o.parti.id);
        if (v > 0) s.push({ partiId: o.parti.id, kg: v, ozet: o });
      });
      return s;
