<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nohut">
<title>Nohut İthalat Takip</title>
<style>
/* Nohut İthalat Takip — telefon öncelikli arayüz */

:root {
  --zemin:      #f4f2ee;
  --kart:       #ffffff;
  --kart2:      #faf9f6;
  --cizgi:      #e2ded6;
  --cizgi2:     #eeebe4;
  --metin:      #1f1d1a;
  --metin2:     #6b665d;
  --metin3:     #9a948a;
  --vurgu:      #8a6d3b;
  --vurgu-ac:   #f0e7d6;
  --arti:       #2f7d55;
  --arti-ac:    #e3f2e9;
  --eksi:       #b3402f;
  --eksi-ac:    #fbe8e5;
  --uyari:      #9a6a05;
  --uyari-ac:   #fdf2d9;
  --golge:      0 1px 2px rgba(31,29,26,.06), 0 4px 12px rgba(31,29,26,.05);
  --golge-buyuk:0 8px 40px rgba(31,29,26,.18);
  --yuvarlak:   14px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="acik"]) {
    --zemin:    #16150f;
    --kart:     #211f19;
    --kart2:    #1a1913;
    --cizgi:    #34322a;
    --cizgi2:   #2a2821;
    --metin:    #f0ede5;
    --metin2:   #a8a294;
    --metin3:   #78735F;
    --vurgu:    #d4b27a;
    --vurgu-ac: #33291a;
    --arti:     #5fbe8a;
    --arti-ac:  #17301f;
    --eksi:     #e8836f;
    --eksi-ac:  #331c18;
    --uyari:    #d9ac4a;
    --uyari-ac: #302716;
    --golge:    0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    --golge-buyuk: 0 8px 40px rgba(0,0,0,.6);
  }
}

[data-tema="koyu"] {
  --zemin:#16150f; --kart:#211f19; --kart2:#1a1913; --cizgi:#34322a; --cizgi2:#2a2821;
  --metin:#f0ede5; --metin2:#a8a294; --metin3:#78735F;
  --vurgu:#d4b27a; --vurgu-ac:#33291a;
  --arti:#5fbe8a; --arti-ac:#17301f; --eksi:#e8836f; --eksi-ac:#331c18;
  --uyari:#d9ac4a; --uyari-ac:#302716;
  --golge:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  --golge-buyuk:0 8px 40px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--zemin);
  color: var(--metin);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}

.rakam, table, .tutar { font-variant-numeric: tabular-nums; }

/* ---------- başlık ---------- */
.tepe {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--zemin) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--cizgi);
  padding: 10px 16px calc(10px + env(safe-area-inset-top)) 16px;
  padding-top: max(10px, env(safe-area-inset-top));
  display: flex; align-items: center; gap: 10px;
}
.tepe h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; flex: 1; }
.tepe .geri {
  background: none; border: 0; color: var(--vurgu); font-size: 16px;
  padding: 6px 4px 6px 0; cursor: pointer; font-weight: 500;
}

/* ---------- sayfa ---------- */
.sayfa { padding: 14px 14px 20px; max-width: 900px; margin: 0 auto; }
.sayfa > * + * { margin-top: 12px; }

h2.bolum {
  font-size: 12px; font-weight: 650; text-transform: uppercase;
  letter-spacing: .07em; color: var(--metin3); margin: 22px 0 8px 2px;
}

/* ---------- kart ---------- */
.kart {
  background: var(--kart); border: 1px solid var(--cizgi);
  border-radius: var(--yuvarlak); box-shadow: var(--golge);
  overflow: hidden;
}
.kart-ic { padding: 14px 16px; }
.kart + .kart { margin-top: 12px; }

/* ---------- özet kutuları ---------- */
.kutular { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kutu {
  background: var(--kart); border: 1px solid var(--cizgi);
  border-radius: var(--yuvarlak); padding: 13px 14px; box-shadow: var(--golge);
}
.kutu .etiket { font-size: 11.5px; color: var(--metin2); font-weight: 550;
  text-transform: uppercase; letter-spacing: .04em; }
.kutu .deger { font-size: 21px; font-weight: 660; margin-top: 5px; letter-spacing: -.02em; }
.kutu .alt { font-size: 12.5px; color: var(--metin2); margin-top: 3px; }
.kutu.genis { grid-column: 1 / -1; }

/* ---------- stok şeridi ---------- */
.stok-serit { display: flex; gap: 1px; background: var(--cizgi); border-radius: var(--yuvarlak);
  overflow: hidden; border: 1px solid var(--cizgi); box-shadow: var(--golge); }
.stok-serit > div { flex: 1; background: var(--kart); padding: 11px 6px; text-align: center; min-width: 0; }
.stok-serit .s-etiket { font-size: 10.5px; color: var(--metin2); font-weight: 550;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stok-serit .s-deger { font-size: 15px; font-weight: 650; margin-top: 3px; }

/* ---------- liste ---------- */
.liste { list-style: none; margin: 0; padding: 0; }
.liste li {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-bottom: 1px solid var(--cizgi2);
  cursor: pointer; min-height: 56px;
}
.liste li:last-child { border-bottom: 0; }
.liste li:active { background: var(--kart2); }
.liste .sol { flex: 1; min-width: 0; }
.liste .ana { font-weight: 570; font-size: 15px; }
.liste .yan { font-size: 12.5px; color: var(--metin2); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.liste .sag { text-align: right; white-space: nowrap; }
.liste .sag .ana { font-weight: 620; }
.liste .ok { color: var(--metin3); font-size: 18px; margin-left: -4px; }

/* ---------- rozet ---------- */
.rozet {
  display: inline-block; font-size: 11px; font-weight: 620; padding: 2.5px 8px;
  border-radius: 100px; background: var(--vurgu-ac); color: var(--vurgu);
  letter-spacing: .01em; white-space: nowrap;
}
.rozet.arti  { background: var(--arti-ac);  color: var(--arti); }
.rozet.eksi  { background: var(--eksi-ac);  color: var(--eksi); }
.rozet.uyari { background: var(--uyari-ac); color: var(--uyari); }
.rozet.sonuk { background: var(--cizgi2); color: var(--metin2); }

/* ---------- düğmeler ---------- */
.dugme {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 46px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--cizgi);
  background: var(--kart); color: var(--metin); font-size: 15px; font-weight: 570;
  cursor: pointer; font-family: inherit; text-decoration: none;
}
.dugme:active { transform: scale(.985); }
.dugme.ana { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
[data-tema="koyu"] .dugme.ana { color: #16150f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="acik"]) .dugme.ana { color: #16150f; }
}
.dugme.tehlike { color: var(--eksi); border-color: color-mix(in srgb, var(--eksi) 35%, var(--cizgi)); }
.dugme.tam { width: 100%; }
.dugme.kucuk { min-height: 38px; padding: 0 13px; font-size: 14px; }
.dugmeler { display: flex; gap: 9px; flex-wrap: wrap; }
.dugmeler .dugme { flex: 1; min-width: 130px; }

/* ---------- alt gezinme ---------- */
.gezinme {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; background: color-mix(in srgb, var(--kart) 94%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--cizgi);
  padding-bottom: env(safe-area-inset-bottom);
}
.gezinme button {
  flex: 1; border: 0; background: none; cursor: pointer; font-family: inherit;
  padding: 8px 2px 9px; color: var(--metin3); font-size: 10.5px; font-weight: 570;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.gezinme button .simge { font-size: 19px; line-height: 1; }
.gezinme button.etkin { color: var(--vurgu); }
.gezinme .orta { flex: 0 0 62px; }
.gezinme .orta .yuvarlak-dugme {
  width: 46px; height: 46px; border-radius: 50%; background: var(--vurgu);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 300; margin-top: -14px; box-shadow: var(--golge-buyuk);
  line-height: 1;
}
[data-tema="koyu"] .gezinme .orta .yuvarlak-dugme { color: #16150f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="acik"]) .gezinme .orta .yuvarlak-dugme { color: #16150f; }
}

/* ---------- sayfa üstü panel (form / seçim) ---------- */
.perde {
  position: fixed; inset: 0; z-index: 100; background: rgba(20,18,14,.45);
  display: flex; align-items: flex-end; justify-content: center;
  animation: sol .16s ease;
}
@keyframes sol { from { opacity: 0 } to { opacity: 1 } }
.panel {
  background: var(--zemin); width: 100%; max-width: 560px;
  border-radius: 20px 20px 0 0; max-height: 92vh; display: flex; flex-direction: column;
  animation: yukari .22s cubic-bezier(.32,.72,0,1);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes yukari { from { transform: translateY(20px) } to { transform: translateY(0) } }
.panel-tepe {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border-bottom: 1px solid var(--cizgi); flex: 0 0 auto;
}
.panel-tepe h3 { margin: 0; font-size: 16.5px; font-weight: 650; flex: 1; letter-spacing: -.01em; }
.panel-tepe .kapat {
  background: var(--cizgi2); border: 0; width: 30px; height: 30px; border-radius: 50%;
  color: var(--metin2); font-size: 17px; cursor: pointer; line-height: 1;
}
.panel-govde { overflow-y: auto; padding: 16px; flex: 1; -webkit-overflow-scrolling: touch; }
.panel-alt {
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--cizgi); display: flex; gap: 9px; flex: 0 0 auto;
  background: var(--kart);
}
.panel-alt .dugme { flex: 1; }

@media (min-width: 620px) {
  .perde { align-items: center; }
  .panel { border-radius: 18px; max-height: 86vh; }
}

/* ---------- form ---------- */
.alan { margin-bottom: 15px; }
.alan > label {
  display: block; font-size: 13px; font-weight: 570; color: var(--metin2); margin-bottom: 6px;
}
.alan input, .alan select, .alan textarea {
  width: 100%; padding: 12px 13px; border: 1px solid var(--cizgi); border-radius: 11px;
  background: var(--kart); color: var(--metin); font-size: 16px; font-family: inherit;
  min-height: 46px;
}
.alan textarea { min-height: 74px; resize: vertical; }
.alan input:focus, .alan select:focus, .alan textarea:focus {
  outline: none; border-color: var(--vurgu);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--vurgu) 18%, transparent);
}
.alan .ipucu { font-size: 12.5px; color: var(--metin3); margin-top: 5px; }
.alan .ipucu.vurgulu { color: var(--vurgu); font-weight: 550; }
.alan .ipucu.hata { color: var(--eksi); font-weight: 550; }
.ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.alan-grubu { background: var(--kart); border: 1px solid var(--cizgi); border-radius: var(--yuvarlak);
  padding: 14px 14px 1px; margin-bottom: 15px; }
.onek { position: relative; }
.onek input { padding-right: 46px; }
.onek .birim {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 13px; color: var(--metin3); font-weight: 560; pointer-events: none;
}
.secim-satir { display: flex; gap: 8px; flex-wrap: wrap; }
.secim-satir label {
  flex: 1; min-width: 92px; display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 11px 8px; border: 1px solid var(--cizgi); border-radius: 11px;
  background: var(--kart); cursor: pointer; font-size: 14px; font-weight: 550;
}
/* Gizli ama klavyeyle erişilebilir: display:none olsaydı Tab atlardı */
.secim-satir input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.secim-satir label:focus-within {
  border-color: var(--vurgu);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--vurgu) 25%, transparent);
}
.secim-satir input:checked + span { color: var(--vurgu); }
.secim-satir label:has(input:checked) {
  border-color: var(--vurgu); background: var(--vurgu-ac);
}
.onay-satir { display: flex; align-items: center; gap: 10px; padding: 11px 0; }
.onay-satir input { width: 21px; height: 21px; accent-color: var(--vurgu); }
.onay-satir label { font-size: 15px; font-weight: 540; }

/* ---------- maliyet kartı ---------- */
.maliyet { font-variant-numeric: tabular-nums; }
.maliyet .satir {
  display: flex; align-items: baseline; gap: 10px; padding: 8px 0;
  border-bottom: 1px dashed var(--cizgi2);
}
.maliyet .satir:last-child { border-bottom: 0; }
.maliyet .ad { flex: 1; min-width: 0; }
.maliyet .ad small { display: block; color: var(--metin3); font-size: 12px; font-weight: 400; }
.maliyet .tutar { font-weight: 570; white-space: nowrap; }
.maliyet .usd { color: var(--metin3); font-size: 12.5px; width: 78px; text-align: right;
  white-space: nowrap; }
.maliyet .ayrac { border-top: 1.5px solid var(--metin3); margin: 4px 0; opacity: .45; }
.maliyet .toplam { font-weight: 650; }
.maliyet .mahsup .tutar, .maliyet .mahsup .ad { color: var(--arti); }
.maliyet .net { font-weight: 700; font-size: 16px; padding-top: 10px; }

/* Dar telefonlarda Tümen rakamları geniş — satırı sıkıştırmak yerine küçült */
@media (max-width: 400px) {
  .maliyet { font-size: 13.5px; }
  .maliyet .satir { gap: 7px; }
  .maliyet .usd { width: 60px; font-size: 11.5px; }
  .maliyet .ad small { font-size: 11px; }
  .maliyet .net { font-size: 15px; }
  .kart-ic { padding: 13px 13px; }
}

.sonuc-kutu {
  background: var(--vurgu-ac); border: 1px solid color-mix(in srgb, var(--vurgu) 30%, transparent);
  border-radius: var(--yuvarlak); padding: 15px 16px; margin-top: 14px;
}
.sonuc-kutu .baslik { font-size: 11.5px; font-weight: 650; color: var(--vurgu);
  text-transform: uppercase; letter-spacing: .06em; }
.sonuc-kutu .buyuk { font-size: 28px; font-weight: 700; margin-top: 6px; letter-spacing: -.025em;
  color: var(--metin); }
.sonuc-kutu .yan { font-size: 14px; color: var(--metin2); margin-top: 3px; font-weight: 550; }
.sonuc-kutu .not { font-size: 12px; color: var(--metin3); margin-top: 9px; }

/* ---------- randıman çubuğu ---------- */
.randiman-cubuk { display: flex; height: 30px; border-radius: 9px; overflow: hidden;
  border: 1px solid var(--cizgi); margin: 4px 0 9px; }
.randiman-cubuk > div { display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 650; color: #fff; min-width: 0; overflow: hidden; }
.randiman-cubuk .r-ust  { background: #2f7d55; }
.randiman-cubuk .r-alt  { background: #b78a3c; }
.randiman-cubuk .r-fire { background: #9a948a; }
.randiman-aciklama { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--metin2); }
.randiman-aciklama i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; }

/* ---------- tablo ---------- */
.tablo-sar { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 10px 11px; text-align: right; white-space: nowrap;
  border-bottom: 1px solid var(--cizgi2); }
th { font-size: 11.5px; font-weight: 620; color: var(--metin2); text-transform: uppercase;
  letter-spacing: .04em; background: var(--kart2); position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0;
  background: var(--kart); }
th:first-child { background: var(--kart2); z-index: 2; }
tbody tr:active td { background: var(--kart2); }
tbody tr.tiklanabilir { cursor: pointer; }
td.pozitif { color: var(--arti); font-weight: 570; }
td.negatif { color: var(--eksi); font-weight: 570; }

/* ---------- uyarı şeridi ---------- */
.uyari-serit {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--uyari-ac); border: 1px solid color-mix(in srgb, var(--uyari) 30%, transparent);
  color: var(--metin); border-radius: var(--yuvarlak); padding: 12px 14px; font-size: 13.5px;
}
.uyari-serit.kotu { background: var(--eksi-ac);
  border-color: color-mix(in srgb, var(--eksi) 30%, transparent); }
.uyari-serit .simge { font-size: 16px; line-height: 1.2; }
.uyari-serit b { display: block; margin-bottom: 2px; }

/* ---------- boş durum ---------- */
.bos-durum { text-align: center; padding: 46px 22px; color: var(--metin2); }
.bos-durum .simge { font-size: 40px; opacity: .5; }
.bos-durum p { margin: 12px 0 18px; font-size: 14.5px; line-height: 1.6; }

/* ---------- bildirim ---------- */
.bildirim {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 200;
  background: var(--metin); color: var(--zemin); padding: 11px 18px; border-radius: 100px;
  font-size: 14px; font-weight: 560; box-shadow: var(--golge-buyuk);
  animation: sol .18s ease; max-width: 90vw; text-align: center;
}

/* ---------- seçim ızgarası (yeni kayıt) ---------- */
.secim-izgara { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.secim-izgara button {
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  padding: 15px 14px; border: 1px solid var(--cizgi); border-radius: var(--yuvarlak);
  background: var(--kart); cursor: pointer; font-family: inherit; text-align: left;
  color: var(--metin); min-height: 92px;
}
.secim-izgara button:active { background: var(--kart2); }
.secim-izgara .simge { font-size: 22px; line-height: 1; }
.secim-izgara .ad { font-size: 14.5px; font-weight: 610; }
.secim-izgara .aciklama { font-size: 12px; color: var(--metin2); line-height: 1.35; font-weight: 400; }

/* ---------- yardımcılar ---------- */
.sag { text-align: right; }
.orta { text-align: center; }
.sonuk { color: var(--metin2); }
.kucuk-yazi { font-size: 12.5px; color: var(--metin2); line-height: 1.55; }
.bosluk { height: 10px; }
.satir-arasi { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pozitif { color: var(--arti); }
.negatif { color: var(--eksi); }

/* ---------- çoklu tüccar alım satırları ---------- */
.alim-satir {
  background: var(--kart); border: 1px solid var(--cizgi); border-radius: var(--yuvarlak);
  padding: 12px 13px; margin-bottom: 10px;
}
.alim-satir.borclu { border-color: color-mix(in srgb, var(--eksi) 40%, var(--cizgi)); }
.alim-tepe { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.alim-no {
  flex: 0 0 22px; height: 22px; border-radius: 50%; background: var(--vurgu-ac);
  color: var(--vurgu); font-size: 11.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.alim-tepe input {
  flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--cizgi);
  border-radius: 10px; background: var(--kart2); color: var(--metin);
  font-size: 16px; font-family: inherit; min-height: 44px; font-weight: 550;
}
.alim-tepe input:focus {
  outline: none; border-color: var(--vurgu);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--vurgu) 18%, transparent);
}
.alim-sil {
  flex: 0 0 32px; height: 32px; border: 0; border-radius: 50%; background: var(--cizgi2);
  color: var(--metin2); font-size: 14px; cursor: pointer; line-height: 1;
}
.alim-satir .ikili { gap: 9px; }
.alim-satir .onek input {
  width: 100%; padding: 10px 40px 10px 12px; border: 1px solid var(--cizgi);
  border-radius: 10px; background: var(--kart2); color: var(--metin);
  font-size: 16px; font-family: inherit; min-height: 44px;
}
.alim-satir .onek input:focus {

.alim-alt {

}
.alim-tutar { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
.alim-odeme { display: flex; gap: 3px; background: var(--cizgi2); padding: 3px; border-radius: 9px; }

.alim-odeme input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }

.alim-odeme span {

/* alım satırları tablosu (parti kartında) */

/* parti detayında stok şeridi: tam kilo gösterir, dar ekranda sığması için küçültülür */
.stok-serit.detay .s-deger { font-size: 14px; letter-spacing: -.01em; }

/* ---------- "tümünü elemeye gönder" — tek dokunuşluk büyük hedef ---------- */
.tumu-dugme {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; min-height: 52px; margin-top: 9px; padding: 0 16px;
  border: 1.5px solid color-mix(in srgb, var(--vurgu) 45%, var(--cizgi));
  border-radius: 12px; background: var(--vurgu-ac); color: var(--metin);

}

  font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;
  letter-spacing: -.02em; white-space: nowrap;
}

.tumu-dugme.secili { background: var(--arti-ac); border-color: var(--arti); }
.tumu-dugme.secili .tumu-sol { color: var(--arti); }

/* elenecek mal kalmadıysa */
.tumu-dugme.pasif {
  background: var(--kart2); border-color: var(--cizgi); border-style: dashed;
  cursor: not-allowed; opacity: .55;
}
.tumu-dugme.pasif .tumu-sol { color: var(--metin3); }
.tumu-dugme.pasif .tumu-kg { color: var(--metin3); font-size: 15px; }

/* Klavyeyle gezerken hangi satırda olduğun belli olsun */
.alim-satir:focus-within { border-color: var(--vurgu); }

/* Klavye kısayolu şeridi (dar ekranda gizlenir — orada zaten dokunmatik) */
.klavye-ipucu {
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  font-size: 12px; color: var(--metin2); padding: 9px 12px; margin-bottom: 12px;
  background: var(--kart2); border: 1px solid var(--cizgi); border-radius: 10px;
}
.klavye-ipucu kbd {
  font: inherit; font-weight: 650; background: var(--kart); color: var(--metin);
  border: 1px solid var(--cizgi); border-bottom-width: 2px; border-radius: 5px;
  padding: 1px 6px; margin-right: 3px;
}
@media (max-width: 520px) { .klavye-ipucu { display: none; } }

/* ---------- parti giderleri ekranı ---------- */
.gider-baslik {
  background: var(--kart); border: 1px solid var(--cizgi); border-radius: var(--yuvarlak);
  padding: 12px 14px; margin-bottom: 4px;
}

  padding: 13px 14px; margin-bottom: 10px;
}
.gider-satir.eksik {
  border-color: color-mix(in srgb, var(--eksi) 45%, var(--cizgi));

}

.gider-satir .onek input {

}

}
.gider-sabit {
  font-size: 15px; font-weight: 620; font-variant-numeric: tabular-nums;
  padding: 11px 12px; background: var(--kart2); border: 1px dashed var(--cizgi);
  border-radius: 10px; color: var(--metin2);
}

/* ---------- parti kartı: modern işlem karoları ---------- */
.islem-izgara { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.islem-karo {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  padding: 14px; border: 1px solid var(--cizgi); border-radius: var(--yuvarlak);
  background: var(--kart); cursor: pointer; font-family: inherit; text-align: left;

}
.islem-karo:active { background: var(--kart2); transform: scale(.99); }

}

/* gider durumu özeti (parti kartında) */
.gider-ozet { display: flex; flex-wrap: wrap; gap: 7px; }

/* ---------- gider giriş şekli (kg / ton / götürü) ---------- */

}

/* ---------- yeni sürüm şeridi ---------- */
.guncelleme-serit {

select.kalite-sec {

                              (bu gelirin faydası parti maliyet kartında
                               mahsup olarak zaten sayılıyor; kura da
                               yansıtılsa çifte sayım olurdu)

     ortKur = bakiye / usdKarsilik   (1 USD kaç Tümen)
     ============================================================ */

  Hesap.kasa = function (veri) {
    var olaylar = [];

    dizi(veri.transferler).forEach(function (t) {
      olaylar.push({ tur: 'transfer', tarih: t.tarih, kayit: t });
    });
    Hesap.partiListesi(veri).forEach(function (p) {
      olaylar.push({ tur: 'parti', tarih: p.tarih, kayit: p });
    });
    dizi(veri.masraflar).forEach(function (m) {
      olaylar.push({ tur: 'masraf', tarih: m.tarih, kayit: m });
    });
    dizi(veri.elemeler).forEach(function (e) {
      if (S(e.ucret) > 0) olaylar.push({ tur: 'eleme', tarih: e.tarih, kayit: e });
    });
    dizi(veri.altSatislar).forEach(function (a) {
      olaylar.push({ tur: 'altSatis', tarih: a.tarih, kayit: a });
    });
    dizi(veri.hamSatislar).forEach(function (a) {
      olaylar.push({ tur: 'hamSatis', tarih: a.tarih, kayit: a });
    });
    dizi(veri.genelGiderler).forEach(function (g) {
      olaylar.push({ tur: 'genelGider', tarih: g.tarih, kayit: g });
    });
    dizi(veri.odemeler).forEach(function (o) {
      olaylar.push({ tur: 'odeme', tarih: o.tarih, kayit: o });
    });

    olaylar = tariheGore(olaylar);

    var bakiye = 0;        // Tümen
    var usdKarsilik = 0;   // bu bakiyenin USD karşılığı
    var girenUsd = 0, girenTumen = 0;
    var defter = [];
    var usdDegeri = {};    // "tur:id" -> USD tutarı
    /* Kur nereden gelir:
         1) O anda kasada para varsa: bakiye / USD karşılığı
         2) Kasa boşalmış ya da EKSİYE düşmüşse: son bilinen kur
            (program durmaz, hesaplamaya devam eder)
         3) Henüz hiç transfer olmamışsa: kayıtlardaki İLK transferin
            kuru (ileriye bakış). Alımı transferden önce tarihlemek
            yaygın; bu olmadan maliyet 0 USD çıkıyordu.
         4) Hiç transfer yoksa: ayarlardaki varsayılan kur           */
    var ilkKur = 0;
    tariheGore(dizi(veri.transferler)).some(function (t) {
      if (S(t.usd) > 0 && S(t.tumen) > 0) { ilkKur = S(t.tumen) / S(t.usd); return true; }
      return false;
    });
    var sonKur = ilkKur || S((veri.ayarlar || {}).varsayilanKur);
    var kursuzHarcama = false;
    var eksiHarcama = false;

    function ortKur() {
      if (usdKarsilik > 0 && bakiye > 0) {
        sonKur = bakiye / usdKarsilik;
        return sonKur;
      }
      return sonKur;   // eksi bakiyede son bilinen kurla devam
    }

    function cikis(tumen) {
      var kur = ortKur();
      if (!(kur > 0)) kursuzHarcama = true;
      if (bakiye - tumen < 0) eksiHarcama = true;
      var usd = kur > 0 ? tumen / kur : 0;
      bakiye -= tumen;
      usdKarsilik -= usd;
      return { usd: usd, kur: kur };
    }

    olaylar.forEach(function (o) {
      var k = o.kayit, satir = null;

      if (o.tur === 'transfer') {
        var gelen = S(k.tumen);
        var gonderilen = S(k.usd);
        bakiye += gelen;
        usdKarsilik += gonderilen;
        girenUsd += gonderilen;
        girenTumen += gelen;
        satir = {
          tarih: k.tarih, tur: 'Döviz transferi',
          aciklama: (k.not || '') || (gonderilen.toLocaleString('tr-TR') + ' USD bozduruldu'),
          giren: gelen, cikan: 0, usd: gonderilen,
          kur: gonderilen > 0 ? gelen / gonderilen : 0
        };

      } else if (o.tur === 'parti') {
        // Maliyet TAM tutardır; kasadan çıkan ise sadece fiilen ÖDENEN
        // kısımdır. Borçlu kaldığın para hâlâ cebinde — kasa bunu bilir.
        var tutar = S(k.tutar);
        var odenen = S(k.odenen);
        var kurP = ortKur();
        if (!(kurP > 0)) kursuzHarcama = true;
        if (bakiye - odenen < 0) eksiHarcama = true;
        var odenenUsd = kurP > 0 ? odenen / kurP : 0;
        bakiye -= odenen;
        usdKarsilik -= odenenUsd;
        usdDegeri['parti:' + k.id] = kurP > 0 ? tutar / kurP : 0;
        satir = {
          tarih: k.tarih, tur: 'Alım',
          aciklama: k.kod + ' — ' + (k.satici || 'satıcı belirtilmemiş') +
                    (k.borc > 0 ? ' (' + Math.round(k.borc).toLocaleString('tr-TR') + ' T borç)' : ''),
          giren: 0, cikan: odenen, usd: -odenenUsd, kur: kurP
        };

      } else if (o.tur === 'masraf') {
        if (k.paraBirimi === 'USD') {
          // Doğrudan USD masrafı: Tümen kasasına dokunmaz
          usdDegeri['masraf:' + k.id] = S(k.tutar);
          satir = {
            tarih: k.tarih, tur: 'Masraf (USD)',
            aciklama: (k.kategori || 'Masraf') + (k.aciklama ? ' — ' + k.aciklama : ''),
            giren: 0, cikan: 0, usd: -S(k.tutar), kur: 0
          };
        } else {
          var mt = S(k.tutar);
          var rm = cikis(mt);
          usdDegeri['masraf:' + k.id] = rm.usd;
          satir = {
            tarih: k.tarih, tur: 'Masraf',
            aciklama: (k.kategori || 'Masraf') + (k.aciklama ? ' — ' + k.aciklama : ''),
            giren: 0, cikan: mt, usd: -rm.usd, kur: rm.kur
          };
        }

      } else if (o.tur === 'eleme') {
        var et = S(k.ucret);
        var re = cikis(et);
        usdDegeri['eleme:' + k.id] = re.usd;
        satir = {
          tarih: k.tarih, tur: 'Eleme ücreti',
          aciklama: 'Eleme — ' + (k.partiKod || ''),
          giren: 0, cikan: et, usd: -re.usd, kur: re.kur
        };

      } else if (o.tur === 'odeme') {
        // Tüccara sonradan yapılan ödeme: kasadan ÖDEME TARİHİNDE çıkar
        var ot = S(k.tutar);
        var ro = cikis(ot);
        usdDegeri['odeme:' + k.id] = ro.usd;
        satir = {
          tarih: k.tarih, tur: 'Tüccara ödeme',
          aciklama: (k.satici || 'tüccar') + (k.aciklama ? ' — ' + k.aciklama : ''),
          giren: 0, cikan: ot, usd: -ro.usd, kur: ro.kur
        };

      } else if (o.tur === 'genelGider') {
        // Seyahat/işletme gideri: kasadan çıkar ama HİÇBİR PARTİNİN
        // maliyetine binmez. Otel, uçak, yeme içme malın maliyeti değildir.
        if (k.paraBirimi === 'USD') {
          usdDegeri['genelGider:' + k.id] = S(k.tutar);
          satir = {
            tarih: k.tarih, tur: 'Genel gider (USD)',
            aciklama: (k.kategori || 'Genel gider') + (k.aciklama ? ' — ' + k.aciklama : ''),
            giren: 0, cikan: 0, usd: -S(k.tutar), kur: 0
          };
        } else {
          var gt = S(k.tutar);
          var rg = cikis(gt);
          usdDegeri['genelGider:' + k.id] = rg.usd;
          satir = {
            tarih: k.tarih, tur: 'Genel gider',
            aciklama: (k.kategori || 'Genel gider') + (k.aciklama ? ' — ' + k.aciklama : ''),
            giren: 0, cikan: gt, usd: -rg.usd, kur: rg.kur
          };
        }

      } else if (o.tur === 'hamSatis') {
        // Elenmemiş ham nohudun İran içinde satışı — Tümen kasaya geri girer
        var ht = S(k.tutar);
        var hkur = ortKur();
        var hUsd = hkur > 0 ? ht / hkur : 0;
        bakiye += ht;
        usdKarsilik += hUsd;
        usdDegeri['hamSatis:' + k.id] = hUsd;
        satir = {
          tarih: k.tarih, tur: 'Ham satış',
          aciklama: S(k.kg).toLocaleString('tr-TR') + ' kg elenmemiş' +
                    (k.alici ? ' — ' + k.alici : ''),
          giren: ht, cikan: 0, usd: hUsd, kur: hkur
        };

      } else if (o.tur === 'altSatis') {
        // Tümen geri girer; ortalama kur korunur
        var gt = S(k.tutar);
        var kur = ortKur();
        var usdEs = kur > 0 ? gt / kur : 0;
        bakiye += gt;
        usdKarsilik += usdEs;
        usdDegeri['altSatis:' + k.id] = usdEs;
        satir = {
          tarih: k.tarih, tur: '8mm altı satışı',
          aciklama: S(k.kg).toLocaleString('tr-TR') + ' kg' + (k.alici ? ' — ' + k.alici : ''),
          giren: gt, cikan: 0, usd: usdEs, kur: kur
        };
      }

      if (satir) {
        satir.bakiye = bakiye;
        satir.ortKur = ortKur();
        defter.push(satir);
      }
    });

    return {
      bakiye: bakiye,
      usdKarsilik: usdKarsilik,
      ortKur: ortKur(),
      kursuzHarcama: kursuzHarcama,
      eksiHarcama: eksiHarcama,
      ilkKur: ilkKur,
      girenUsd: girenUsd,
      girenTumen: girenTumen,
      genelOrtKur: girenUsd > 0 ? girenTumen / girenUsd : 0,
      defter: defter,
      usdDegeri: usdDegeri
    };
  };

  /* ============================================================
     MASRAF DAĞITIMI
     Bir masraf birden fazla partiye ait olabilir (bir kamyon üç parti
     taşıdı gibi). Dağıtım tabanı: ham kilo oranı veya eşit bölüşüm.
     ============================================================ */

  Hesap.masrafPayi = function (masraf, partiId, partiler) {
    var hedefler = dizi(masraf.partiIds);
    if (hedefler.indexOf(partiId) === -1) return 0;
    if (hedefler.length === 1) return 1;

    if (masraf.dagitim === 'esit') return 1 / hedefler.length;

    // varsayılan: ham kilo oranına göre
    var toplam = 0, bu = 0;
    hedefler.forEach(function (id) {
      var p = partiler.find(function (x) { return x.id === id; });
      var kg = p ? S(p.hamKg) : 0;
      toplam += kg;
      if (id === partiId) bu = kg;
    });
    if (toplam <= 0) return 1 / hedefler.length;
    return bu / toplam;
  };

  /* ============================================================
     PARTİ MALİYET KARTI
     ============================================================ */

  Hesap.parti = function (veri, partiId, kasa) {
    kasa = kasa || Hesap.kasa(veri);
    var partiler = Hesap.partiListesi(veri);
    var p = partiler.find(function (x) { return x.id === partiId; });
    if (!p) return null;

    var uD = kasa.usdDegeri;
    var kalemler = [];

    /* --- alım --- */
    var alimT = S(p.tutar);
    var alimU = S(uD['parti:' + p.id]);
    kalemler.push({
      ad: 'Alım',
      detay: S(p.hamKg).toLocaleString('tr-TR') + ' kg' +
             (p.saticiSayisi > 1
               ? ' · ' + p.saticiSayisi + ' tüccar · ort. ' +
                 Math.round(S(p.birimFiyat)).toLocaleString('tr-TR') + ' T/kg'
               : ' × ' + Math.round(S(p.birimFiyat)).toLocaleString('tr-TR') + ' T/kg'),
      tumen: alimT, usd: alimU
    });

    /* --- masraflar (kategoriye göre topla) --- */
    var katT = {}, katU = {};
    dizi(veri.masraflar).forEach(function (m) {
      var pay = Hesap.masrafPayi(m, p.id, partiler);
      if (pay <= 0) return;
      var kat = m.kategori || 'Diğer';
      var t = (m.paraBirimi === 'USD' ? 0 : S(m.tutar)) * pay;
      var u = S(uD['masraf:' + m.id]) * pay;
      katT[kat] = (katT[kat] || 0) + t;
      katU[kat] = (katU[kat] || 0) + u;
    });

    /* --- eleme ücretleri --- */
    var elemeler = Hesap.partiElemeleri(veri, p.id);
    var elemeUcretT = 0, elemeUcretU = 0;
    elemeler.forEach(function (e) {
      var pay = Hesap.elemePayi(e, p.id);
      elemeUcretT += S(e.ucret) * pay;
      elemeUcretU += S(uD['eleme:' + e.id]) * pay;
    });
    if (elemeUcretT > 0 || elemeUcretU > 0) {
      katT['Eleme ücreti'] = (katT['Eleme ücreti'] || 0) + elemeUcretT;
      katU['Eleme ücreti'] = (katU['Eleme ücreti'] || 0) + elemeUcretU;
    }

    Object.keys(katT).forEach(function (kat) {
      kalemler.push({ ad: kat, detay: '', tumen: katT[kat], usd: katU[kat] });
    });

    var giderT = alimT, giderU = alimU;
    Object.keys(katT).forEach(function (kat) { giderT += katT[kat]; giderU += katU[kat]; });

    /* --- eleme sonuçları --- */
    var girenKg = 0, ustKg = 0, altKg = 0, fireKg = 0, elemedeKg = 0;
    elemeler.forEach(function (e) {
      var pay = Hesap.elemePayi(e, p.id);
      // Bu partinin o elemeye koyduğu kilo (paylaştırma değil, gerçek)
      var bendenGiren = 0;
      Hesap.elemeGirdileri(e).forEach(function (x) {
        if (x.partiId === p.id) bendenGiren += x.girenKg;
      });
      girenKg += bendenGiren;
      if (e.tamamlandi === false) {
        elemedeKg += bendenGiren;
      } else {
        // Çıktılar giren kilo oranında paylaşılır — mallar karıştı
        ustKg += S(e.ustKg) * pay;
        altKg += S(e.altKg) * pay;
        fireKg += S(e.fireKg) * pay;
      }
    });

    /* --- ham satışlar: elenmeden İran'da satılan mal --- */
    var hamSatilanKg = 0, hamGelirT = 0, hamGelirU = 0;
    dizi(veri.hamSatislar).forEach(function (h) {
      if (h.partiId !== p.id) return;
      hamSatilanKg += S(h.kg);
      hamGelirT += S(h.tutar);
      hamGelirU += S(uD['hamSatis:' + h.id]);
    });

    /* --- 8mm altı satışları (mahsup) --- */
    var altSatilanKg = 0, altGelirT = 0, altGelirU = 0;
    dizi(veri.altSatislar).forEach(function (a) {
      var pay = Hesap.satisPayi(a, p.id);
      if (pay.kg <= 0 && pay.tutar <= 0) return;
      altSatilanKg += pay.kg;
      altGelirT += pay.tutar;
      // Kaydın USD karşılığı, partilere tutar oranında bölünür
      var kayitToplam = S(a.tutar);
      var oran = kayitToplam > 0 ? pay.tutar / kayitToplam : 0;
      altGelirU += S(uD['altSatis:' + a.id]) * oran;
    });

    var elenenKg = girenKg - elemedeKg;   // sonucu girilmiş, tamamlanan eleme

    /* ------------------------------------------------------------
       MALİYETİN PAYLAŞTIRILMASI

       Alım bedeli ve genel masraflar partinin TAMAMI için yapıldı.
       Bunları kiloya göre bölmek gerekir; yoksa:
         • ham satılan mal maliyetsiz görünür,
         • henüz elenmemiş mal da 8mm+ maliyetini şişirir.

       Eleme ücreti yalnızca elenen kısma, 8mm altı geliri de yalnızca
       elenen kısma aittir — onlar paylaştırılmaz.
       ------------------------------------------------------------ */
    var temelKg = S(p.hamKg);
    var pay = temelKg > 0 ? elenenKg / temelKg : (elenenKg > 0 ? 1 : 0);
    var hamPay = temelKg > 0 ? hamSatilanKg / temelKg : 0;

    // Paylaştırmaya girmeyen kalemler (yalnızca elenen kısma ait)
    var elemeT = katT['Eleme ücreti'] || 0;
    var elemeU = katU['Eleme ücreti'] || 0;
    var genelT = giderT - elemeT;      // alım + diğer masraflar
    var genelU = giderU - elemeU;

    var hamMaliyetT = genelT * hamPay;
    var hamMaliyetU = genelU * hamPay;

    var netT = genelT * pay + elemeT - altGelirT;
    var netU = genelU * pay + elemeU - altGelirU;

    // Elde kalan (satılmamış, elenmemiş) malın taşıdığı maliyet
    var kalanPay = Math.max(0, 1 - pay - hamPay);
    var kalanMaliyetT = genelT * kalanPay;

    /* --- sevkiyat --- */
    var yuklenenKg = 0;
    dizi(veri.sevkiyatlar).forEach(function (s) {
      dizi(s.kalemler).forEach(function (kl) {
        if (kl.partiId === p.id) yuklenenKg += S(kl.kg);
      });
    });

    /* --- birim maliyet --- */
    var birimT = ustKg > 0 ? netT / ustKg : 0;
    var birimU = ustKg > 0 ? netU / ustKg : 0;
    var usdTon = birimU * 1000;

    return {
      parti: p,
      kalemler: kalemler,
      giderTumen: giderT, giderUsd: giderU,
      genelGiderTumen: genelT, genelGiderUsd: genelU,
      elemeUcretTumen: elemeT, elemeUcretUsd: elemeU,
      altGelirTumen: altGelirT, altGelirUsd: altGelirU, altSatilanKg: altSatilanKg,
      netTumen: netT, netUsd: netU,
      kalanMaliyetTumen: kalanMaliyetT,
      paylastirmaVar: (hamPay > 0.0001 || pay < 0.9999),
      hamKg: S(p.hamKg),
      girenKg: girenKg,
      elenenKg: elenenKg,
      hamSatilanKg: hamSatilanKg,
      hamGelirTumen: hamGelirT, hamGelirUsd: hamGelirU,
      hamSatisMaliyetTumen: hamMaliyetT, hamSatisMaliyetUsd: hamMaliyetU,
      hamSatisKarTumen: hamGelirT - hamMaliyetT,
      hamSatisKarUsd: hamGelirU - hamMaliyetU,
      elenmemisKg: S(p.hamKg) - girenKg - hamSatilanKg,
      elenenPay: pay,
      elemedeKg: elemedeKg,
      ustKg: ustKg, altKg: altKg, fireKg: fireKg,
      randiman: elenenKg > 0 ? ustKg / elenenKg : 0,
      altOran: elenenKg > 0 ? altKg / elenenKg : 0,
      fireOran: elenenKg > 0 ? fireKg / elenenKg : 0,
      birimTumen: birimT,
      birimUsd: birimU,
      usdTon: usdTon,
      kullanilanKur: birimU > 0 ? birimT / birimU : kasa.ortKur,
      ustStokKg: ustKg - yuklenenKg,
      altStokKg: altKg - altSatilanKg,
      yuklenenKg: yuklenenKg,
      tamam: ustKg > 0,
      altKaliteler: Hesap.altKaliteler(veri, partiId),
      guncelBorc: (function () {
        var d = Hesap.borcDagilimi(veri);
        return d.partiBorc[partiId] || 0;
      })(),
      giderDurumu: Hesap.giderDurumu(veri, partiId, kasa)
    };
  };

  Hesap.tumPartiler = function (veri) {
    var kasa = Hesap.kasa(veri);
    return Hesap.partiListesi(veri).map(function (p) {
      return Hesap.parti(veri, p.id, kasa);
    }).filter(Boolean);
  };

  /* ------------------------------------------------------------
     BORÇ VE ÖDEMELER

     Alım satırında "Borç" ya da "Kısmi" işaretlenen tutar borçtur.
     Sonradan yapılan ödemeler o tüccarın EN ESKİ borcundan başlayarak
     düşülür. Böylece hem tüccar bazında kalan borç, hem parti bazında
     güncel borç doğru çıkar.
     ------------------------------------------------------------ */

  Hesap.borcDagilimi = function (veri) {
    var partiler = Hesap.partiListesi(veri).slice().sort(function (a, b) {
      return String(a.tarih || '').localeCompare(String(b.tarih || ''));
    });

    // tüccar -> borçlu satırlar (eskiden yeniye)
    var tuccar = {};
    partiler.forEach(function (p) {
      p.alimlar.forEach(function (a, i) {
        var borc = Hesap.satirBorc(a);
        if (borc <= 0) return;
        var ad = (a.satici || '').trim() || 'Belirtilmemiş';
        if (!tuccar[ad]) tuccar[ad] = { ad: ad, satirlar: [], alimBorcu: 0, odeme: 0 };
        tuccar[ad].satirlar.push({
          partiId: p.id, kod: p.kod, tarih: p.tarih, sira: i,
          borc: borc, odenen: 0
        });
        tuccar[ad].alimBorcu += borc;
      });
    });

    // ödemeleri dağıt
    dizi(veri.odemeler).slice().sort(function (a, b) {
      return String(a.tarih || '').localeCompare(String(b.tarih || ''));
    }).forEach(function (o) {
      var ad = (o.satici || '').trim() || 'Belirtilmemiş';
      var t = tuccar[ad];
      if (!t) { tuccar[ad] = { ad: ad, satirlar: [], alimBorcu: 0, odeme: S(o.tutar) }; return; }
      t.odeme += S(o.tutar);
      var kalan = S(o.tutar);
      t.satirlar.forEach(function (x) {
        if (kalan <= 0.0001) return;
        var al = Math.min(kalan, x.borc - x.odenen);
        if (al <= 0.0001) return;
        x.odenen += al;
        kalan -= al;
      });
    });

    // parti bazında kalan borç
    var partiBorc = {};
    Object.keys(tuccar).forEach(function (ad) {
      tuccar[ad].satirlar.forEach(function (x) {
        partiBorc[x.partiId] = (partiBorc[x.partiId] || 0) + (x.borc - x.odenen);
      });
      var t = tuccar[ad];
      t.kalanBorc = Math.max(0, t.alimBorcu - t.odeme);
      t.fazlaOdeme = Math.max(0, t.odeme - t.alimBorcu);
    });

    // satır bazında kalan borç: "partiId:sira" -> kalan
    var satirBorc = {};
    Object.keys(tuccar).forEach(function (ad) {
      tuccar[ad].satirlar.forEach(function (x) {
        satirBorc[x.partiId + ':' + x.sira] = x.borc - x.odenen;
      });
    });

    return { tuccar: tuccar, partiBorc: partiBorc, satirBorc: satirBorc };
  };

  Hesap.toplamBorc = function (veri) {
    var d = Hesap.borcDagilimi(veri);
    var t = 0;
    Object.keys(d.tuccar).forEach(function (ad) { t += d.tuccar[ad].kalanBorc; });
    return t;
  };

  /* ============================================================
     TÜCCAR ÖZETİ
     Mallar karıştığı için tüccar bazında randıman ölçülemez —
     ama alım fiyatı, hacim ve borç ölçülebilir. Rapor bunları verir.
     ============================================================ */

  Hesap.tuccarlar = function (veri) {
    var harita = {};
    Hesap.partiListesi(veri).forEach(function (p) {
      p.alimlar.forEach(function (a) {
        var ad = (a.satici || '').trim() || 'Belirtilmemiş';
        if (!harita[ad]) {
          harita[ad] = { ad: ad, kg: 0, tutar: 0, borc: 0, alimSayisi: 0, partiler: {} };
        }
        var t = harita[ad];
        t.kg += S(a.kg);
        t.tutar += S(a.tutar);
        t.borc += Hesap.satirBorc(a);
        t.alimSayisi++;
        t.partiler[p.id] = true;
      });
    });
    var dagilim = Hesap.borcDagilimi(veri);
    return Object.keys(harita).map(function (ad) {
      var t = harita[ad];
      t.ortFiyat = t.kg > 0 ? t.tutar / t.kg : 0;
      t.partiSayisi = Object.keys(t.partiler).length;
      delete t.partiler;
      var d = dagilim.tuccar[ad];
      t.alimBorcu = d ? d.alimBorcu : t.borc;
      t.odeme = d ? d.odeme : 0;
      t.borc = d ? d.kalanBorc : t.borc;      // ödemeler düşülmüş kalan borç
      t.fazlaOdeme = d ? d.fazlaOdeme : 0;
      return t;
    }).sort(function (a, b) { return b.kg - a.kg; });
  };



  /* ============================================================
     GİDER KALEMLERİ

     Nakliye, hammaliye, çuval ve eleme ücreti her partide MUTLAKA
     oluşur. Biri girilmezse parti maliyeti olduğundan düşük görünür
     ve yanlış fiyat verilir. Bu yüzden program bunları zorunlu
     sayar ve eksik olanı uyarı olarak gösterir.
     ============================================================ */

  Hesap.GIDER_KATEGORILERI = [
    { ad: 'Nakliye',              simge: '🚚', kaynak: 'masraf' },
    { ad: 'Hammaliye / işçilik',  simge: '🧑‍🌾', kaynak: 'masraf' },
    { ad: 'Çuval / big bag',      simge: '🧺', kaynak: 'masraf' },
    { ad: 'Eleme ücreti',         simge: '⚙️', kaynak: 'eleme'  },
    { ad: 'Depo kirası',          simge: '🏬', kaynak: 'masraf' },
    { ad: 'Gümrük / evrak',       simge: '📄', kaynak: 'masraf' },
    { ad: 'Fumigasyon',           simge: '🧪', kaynak: 'masraf' },
    { ad: 'Komisyon / aracı',     simge: '🤝', kaynak: 'masraf' },
    { ad: 'Diğer',                simge: '➕', kaynak: 'masraf' }
  ];

  Hesap.VARSAYILAN_ZORUNLU = ['Nakliye', 'Hammaliye / işçilik', 'Çuval / big bag', 'Eleme ücreti'];

  /* ------------------------------------------------------------
     GİDER GİRİŞ ŞEKLİ

     Aynı gider farklı şekillerde anlaşılır:
       kg     → kilo başına fiyat   (eleme genelde böyle)
       ton    → ton başına fiyat    (nakliye genelde böyle)
       goturu → işin tamamı için tek fiyat (pazarlıkla)

     Kayıtta her zaman TOPLAM tutar saklanır; giriş şekli ve birim
     fiyat da saklanır ki düzenlerken aynı şekilde geri gelsin.
     ------------------------------------------------------------ */

  Hesap.GIDER_TIPLERI = [
    { deger: 'kg',     ad: 'Kilo başına', birim: 'T/kg' },
    { deger: 'ton',    ad: 'Ton başına',  birim: 'T/ton' },
    { deger: 'goturu', ad: 'Götürü',      birim: 'T' }
  ];

  // Girilen birim fiyattan toplam tutarı hesaplar
  Hesap.giderTutari = function (tip, birimFiyat, kg) {
    var f = S(birimFiyat), m = S(kg);
    if (tip === 'kg') return f * m;
    if (tip === 'ton') return f * m / 1000;
    return f;                                  // götürü
  };

  // Toplam tutardan, seçili giriş şekline göre birim fiyatı geri hesaplar
  Hesap.giderBirimi = function (tip, tutar, kg) {
    var t = S(tutar), m = S(kg);
    if (tip === 'kg') return m > 0 ? t / m : 0;
    if (tip === 'ton') return m > 0 ? t / m * 1000 : 0;
    return t;
  };

  Hesap.giderBirimiAdi = function (tip) {
    var k = Hesap.GIDER_TIPLERI.find(function (x) { return x.deger === tip; });
    return k ? k.birim : 'T';
  };

  Hesap.zorunluListesi = function (veri) {
    var a = (veri.ayarlar || {}).zorunluGiderler;
    return Array.isArray(a) ? a : Hesap.VARSAYILAN_ZORUNLU;
  };

  /* Bir partinin gider kalemlerinin durumu.
     durum: 'girildi' | 'eksik' | 'beklemede' | 'bos' */
  Hesap.giderDurumu = function (veri, partiId, kasa) {
    kasa = kasa || Hesap.kasa(veri);
    var partiler = Hesap.partiListesi(veri);
    var p = partiler.find(function (x) { return x.id === partiId; });
    if (!p) return null;

    var zorunlu = Hesap.zorunluListesi(veri);
    var elemeler = Hesap.partiElemeleri(veri, partiId);

    var satirlar = Hesap.GIDER_KATEGORILERI.map(function (kat) {
      var tumen = 0, usd = 0, adet = 0, paylasimli = false, tekKayit = null;

      if (kat.kaynak === 'eleme') {
        elemeler.forEach(function (e) {
          if (S(e.ucret) <= 0) return;
          var pay = Hesap.elemePayi(e, partiId);
          adet++;
          tumen += S(e.ucret) * pay;
          usd += S(kasa.usdDegeri['eleme:' + e.id]) * pay;
        });
      } else {
        dizi(veri.masraflar).forEach(function (m) {
          if ((m.kategori || 'Diğer') !== kat.ad) return;
          var pay = Hesap.masrafPayi(m, partiId, partiler);
          if (pay <= 0) return;
          adet++;
          tekKayit = m;
          // birden çok partiye dağıtılmış masraf buradan düzenlenemez —
          // değiştirilse diğer partilerin maliyeti de bozulurdu
          if (dizi(m.partiIds).length > 1) paylasimli = true;
          tumen += (m.paraBirimi === 'USD' ? 0 : S(m.tutar)) * pay;
          usd += S(kasa.usdDegeri['masraf:' + m.id]) * pay;
        });
      }

      var zor = zorunlu.indexOf(kat.ad) !== -1;
      var durum;
      if (tumen > 0 || usd > 0) durum = 'girildi';
      else if (!zor) durum = 'bos';
      else if (kat.kaynak === 'eleme' && !elemeler.length) durum = 'beklemede';
      else durum = 'eksik';

      return {
        ad: kat.ad, simge: kat.simge, kaynak: kat.kaynak, zorunlu: zor,
        tumen: tumen, usd: usd, adet: adet, durum: durum, paylasimli: paylasimli,
        kayitId: adet === 1 && tekKayit ? tekKayit.id : null,
        paraBirimi: adet === 1 && tekKayit ? (tekKayit.paraBirimi || 'TMN') : 'TMN',
        tutarTipi: adet === 1 && tekKayit ? (tekKayit.tutarTipi || 'goturu') : 'goturu',
        // tek ve yalnız bu partiye ait masraf tek alandan düzenlenebilir
        duzenlenebilir: kat.kaynak === 'masraf' && adet <= 1 && !paylasimli
      };
    });

    return {
      satirlar: satirlar,
      eksikler: satirlar.filter(function (r) { return r.durum === 'eksik'; }),
      bekleyenler: satirlar.filter(function (r) { return r.durum === 'beklemede'; }),
      tamam: !satirlar.some(function (r) { return r.durum === 'eksik'; })
    };
  };

  /* ============================================================
     8MM ALTI KALİTELERİ

     Elek altı tek tip olmayabilir: 1. kalite, 2. kalite, kırık…
     Her biri ayrı fiyattan satılır. Eleme kaydında kalite satırlarına
     ayrılır, satışta her kalite kendi fiyatıyla girilir.

     altKg ve satış tutarı her zaman TOPLAM olarak saklanır; maliyet
     hesabı bundan etkilenmez, kaliteler yalnızca kırılım sağlar.
     ============================================================ */

  /* ------------------------------------------------------------
     ÇOK PARTİLİ ELEME

     Birkaç partinin malı birlikte elenebilir. Karıştıktan sonra
     hangi partinin ne verdiği ölçülemez; bu yüzden çıktılar (8mm+,
     8mm−, fire) ve eleme ücreti GİREN KİLO ORANINDA paylaştırılır.
     Dürüst olan budur — uydurma kesinlik üretmez.
     ------------------------------------------------------------ */

  // Eleme kaydının parti satırları (eski tek partili kayıtlar çevrilir)
  Hesap.elemeGirdileri = function (e) {
    var g = dizi(e.partiler);
    if (!g.length) {
      return e.partiId ? [{ partiId: e.partiId, girenKg: S(e.girenKg) }] : [];
    }
    return g.map(function (x) {
      return { partiId: x.partiId, girenKg: S(x.girenKg) };
    });
  };

  // Bir elemenin belirli partiye düşen payı (0–1)
  Hesap.elemePayi = function (e, partiId) {
    var girdiler = Hesap.elemeGirdileri(e);
    var toplam = 0, bu = 0;
    girdiler.forEach(function (x) {
      toplam += x.girenKg;
      if (x.partiId === partiId) bu += x.girenKg;
    });
    if (bu <= 0) return 0;
    return toplam > 0 ? bu / toplam : 0;
  };

  // Bu partiye ait olan elemeler
  Hesap.partiElemeleri = function (veri, partiId) {
    return dizi(veri.elemeler).filter(function (e) {
      return Hesap.elemeGirdileri(e).some(function (x) { return x.partiId === partiId; });
    });
  };

  var KALITESIZ = 'Ayrılmamış';

  Hesap.KALITESIZ = KALITESIZ;

  // Eleme kaydındaki kalite satırları (eski kayıtlar tek satıra çevrilir)
  Hesap.altKalemleri = function (e) {
    var k = dizi(e.altKalemler);
    if (k.length) return k;
    return S(e.altKg) > 0 ? [{ ad: KALITESIZ, kg: S(e.altKg) }] : [];
  };

  /* Satış kaydındaki kalite satırları.
     Bir satış birden çok partiye dağılabilir; her kalem kendi partisini
     taşır. Eski kayıtlarda kalem partisi yoksa kaydın partisi kullanılır. */
  Hesap.satisKalemleri = function (a) {
    var k = dizi(a.kalemler);
    if (!k.length) {
      k = [{ ad: a.kalite || KALITESIZ, kg: S(a.kg),
             birimFiyat: S(a.birimFiyat), tutar: S(a.tutar) }];
    }
    return k.map(function (x) {
      return {
        partiId: x.partiId || a.partiId,
        ad: x.ad || KALITESIZ,
        kg: S(x.kg), birimFiyat: S(x.birimFiyat), tutar: S(x.tutar)
      };
    });
  };

  /* Bir satış kaydının belirli bir partiye düşen payı */
  Hesap.satisPayi = function (a, partiId) {
    var kg = 0, tutar = 0;
    Hesap.satisKalemleri(a).forEach(function (x) {
      if (x.partiId === partiId) { kg += x.kg; tutar += x.tutar; }
    });
    return { kg: kg, tutar: tutar };
  };

  /* Bir partide kalite bazında 8mm altı durumu */
  Hesap.altKaliteler = function (veri, partiId) {
    var harita = {};
    function kutu(ad) {
      ad = (ad || KALITESIZ).trim() || KALITESIZ;
      if (!harita[ad]) harita[ad] = { ad: ad, cikanKg: 0, satilanKg: 0, gelirT: 0 };
      return harita[ad];
    }

    dizi(veri.elemeler).forEach(function (e) {
      if (e.tamamlandi === false) return;
      var pay = Hesap.elemePayi(e, partiId);
      if (pay <= 0) return;
      Hesap.altKalemleri(e).forEach(function (k) {
        kutu(k.ad).cikanKg += S(k.kg) * pay;
      });
    });

    dizi(veri.altSatislar).forEach(function (a) {
      Hesap.satisKalemleri(a).forEach(function (k) {
        if (k.partiId !== partiId) return;
        var b = kutu(k.ad);
        b.satilanKg += k.kg;
        b.gelirT += k.tutar;
      });
    });

    return Object.keys(harita).map(function (ad) {
      var b = harita[ad];
      b.kalanKg = b.cikanKg - b.satilanKg;
      b.ortFiyat = b.satilanKg > 0 ? b.gelirT / b.satilanKg : 0;
      return b;
    }).sort(function (x, y) { return y.cikanKg - x.cikanKg; });
  };

  /* ------------------------------------------------------------
     8MM ALTI STOK HAVUZU

     Birkaç partinin elek altı birlikte satılabilir. Havuz, kalite
     adına göre tüm partileri toplar; satış eskiden yeniye (FIFO)
     dağıtılır — önce en eski partinin stoğu erir.
     ------------------------------------------------------------ */

  Hesap.altStokHavuzu = function (veri, harictSatisId) {
    var partiler = Hesap.partiListesi(veri).slice().sort(function (a, b) {
      return String(a.tarih || '').localeCompare(String(b.tarih || ''));   // eskiden yeniye
    });
    var havuz = {};

    partiler.forEach(function (p) {
      var kal = Hesap.altKaliteler(veri, p.id);
      kal.forEach(function (x) {
        var kalan = x.kalanKg;
        // Düzenlenen satışın kendi miktarı stoğa geri sayılır
        if (harictSatisId) {
          var sat = dizi(veri.altSatislar).find(function (a) { return a.id === harictSatisId; });
          if (sat) {
            Hesap.satisKalemleri(sat).forEach(function (kl) {
              if (kl.partiId === p.id && kl.ad === x.ad) kalan += kl.kg;
            });
          }
        }
        if (kalan <= 0.5) return;
        if (!havuz[x.ad]) havuz[x.ad] = { ad: x.ad, kalanKg: 0, partiler: [] };
        havuz[x.ad].kalanKg += kalan;
        havuz[x.ad].partiler.push({
          partiId: p.id, kod: p.kod, tarih: p.tarih, kalanKg: kalan
        });
      });
    });

    return Object.keys(havuz).map(function (a) { return havuz[a]; })
      .sort(function (a, b) { return b.kalanKg - a.kalanKg; });
  };

  /* İstenen miktarı, o kalitenin partileri arasında eskiden yeniye böler */
  Hesap.altDagit = function (havuz, kaliteAdi, kg) {
    var k = havuz.find(function (x) { return x.ad === kaliteAdi; });
    var sonuc = [], kalan = S(kg);
    if (!k) return { dagilim: sonuc, karsilanan: 0, eksik: kalan };
    k.partiler.forEach(function (p) {
      if (kalan <= 0.0001) return;
      var al = Math.min(kalan, p.kalanKg);
      if (al <= 0.0001) return;
      sonuc.push({ partiId: p.partiId, kod: p.kod, tarih: p.tarih, kg: al });
      kalan -= al;
    });
    return { dagilim: sonuc, karsilanan: S(kg) - kalan, eksik: kalan };
  };

  /* ------------------------------------------------------------
     8MM ÜSTÜ YÜKLEME HAVUZU

     Bir kamyona birkaç partinin malı birlikte yüklenebilir.
     Yükleme eskiden yeniye (FIFO) dağıtılır: önce en eski partinin
     stoğu erir. Böylece mal depoda bekleyip bayatlamaz.
     ------------------------------------------------------------ */

  Hesap.ustStokHavuzu = function (veri, haricSevkiyatId) {
    var kasa = Hesap.kasa(veri);
    return Hesap.partiListesi(veri).map(function (p) {
      var o = Hesap.parti(veri, p.id, kasa);
      var kalan = o.ustStokKg;
      if (haricSevkiyatId) {
        var sv = dizi(veri.sevkiyatlar).find(function (x) { return x.id === haricSevkiyatId; });
        if (sv) {
          dizi(sv.kalemler).forEach(function (kl) {
            if (kl.partiId === p.id) kalan += S(kl.kg);
          });
        }
      }
      return { partiId: p.id, kod: p.kod, tarih: p.tarih, satici: p.satici,
               kalanKg: kalan, usdTon: o.usdTon, birimUsd: o.birimUsd };
    }).filter(function (x) { return x.kalanKg > 0.5; })
      .sort(function (a, b) {
        return String(a.tarih || '').localeCompare(String(b.tarih || ''));   // eskiden yeniye
      });
  };

  /* İstenen yükleme miktarını partilere eskiden yeniye böler */
  Hesap.ustDagit = function (havuz, kg) {
    var sonuc = [], kalan = S(kg);
    havuz.forEach(function (p) {
      if (kalan <= 0.0001) return;
      var al = Math.min(kalan, p.kalanKg);
      if (al <= 0.0001) return;
      sonuc.push({ partiId: p.partiId, kod: p.kod, tarih: p.tarih, kg: al });
      kalan -= al;
    });
    return { dagilim: sonuc, karsilanan: S(kg) - kalan, eksik: kalan };
  };

  /* ============================================================
     STOK — elle girilmez, hareketlerden türetilir
     ============================================================ */

  Hesap.stok = function (veri) {
    var ozetler = Hesap.tumPartiler(veri);
    var t = { ham: 0, elemede: 0, ust: 0, alt: 0, yuklenen: 0, fire: 0 };
    ozetler.forEach(function (o) {
      t.ham += o.elenmemisKg;
      t.elemede += o.elemedeKg;
      t.ust += o.ustStokKg;
      t.alt += o.altStokKg;
      t.yuklenen += o.yuklenenKg;
      t.fire += o.fireKg;
    });
    t.partiler = ozetler;
    return t;
  };

  /* ============================================================
     GENEL GİDERLER (seyahat, işletme)

     Otel, uçak bileti, yeme içme… Bunlar malın maliyeti DEĞİLDİR;
     hiçbir partiye dağıtılmaz. Yalnızca kasadan düşer. Böylece
     USD/ton maliyet rakamı temiz kalır, ama harcanan para görünür.
     ============================================================ */

  Hesap.GENEL_GIDER_KATEGORILERI = [
    { ad: 'Uçak bileti',        simge: '✈️' },
    { ad: 'Otel / konaklama',   simge: '🏨' },
    { ad: 'Yeme içme',          simge: '🍽️' },
    { ad: 'Ulaşım (taksi, otobüs)', simge: '🚕' },
    { ad: 'Vize / evrak',       simge: '🛂' },
    { ad: 'Telefon / internet', simge: '📱' },
    { ad: 'Temsil / ağırlama',  simge: '🤝' },
    { ad: 'Diğer',              simge: '➕' }
  ];

  Hesap.genelGiderler = function (veri, kasa) {
    kasa = kasa || Hesap.kasa(veri);
    var liste = dizi(veri.genelGiderler).map(function (g) {
      return {
        kayit: g,
        tumen: g.paraBirimi === 'USD' ? 0 : S(g.tutar),
        usd: S(kasa.usdDegeri['genelGider:' + g.id])
      };
    });

    var toplamT = 0, toplamU = 0;
    var kategori = {}, gezi = {};
    liste.forEach(function (x) {
      toplamT += x.tumen; toplamU += x.usd;
      var kat = x.kayit.kategori || 'Diğer';
      kategori[kat] = (kategori[kat] || 0) + x.usd;
      var g = (x.kayit.gezi || '').trim() || 'Belirtilmemiş';
      if (!gezi[g]) gezi[g] = { ad: g, usd: 0, tumen: 0, adet: 0 };
      gezi[g].usd += x.usd; gezi[g].tumen += x.tumen; gezi[g].adet++;
    });

    return {
      liste: liste,
      toplamTumen: toplamT,
      toplamUsd: toplamU,
      kategoriler: Object.keys(kategori).map(function (a) {
        return { ad: a, usd: kategori[a] };
      }).sort(function (a, b) { return b.usd - a.usd; }),
      geziler: Object.keys(gezi).map(function (a) { return gezi[a]; })
        .sort(function (a, b) { return b.usd - a.usd; })
    };
  };

  /* ============================================================
     SEVKİYAT
     ============================================================ */

  Hesap.sevkiyat = function (veri, sevkiyatId) {
    var s = dizi(veri.sevkiyatlar).find(function (x) { return x.id === sevkiyatId; });
    if (!s) return null;
    var kasa = Hesap.kasa(veri);

    var toplamKg = 0, maliyetT = 0, maliyetU = 0;
    var kalemler = dizi(s.kalemler).map(function (kl) {
      var o = Hesap.parti(veri, kl.partiId, kasa);
      var kg = S(kl.kg);
      toplamKg += kg;
      var mT = o ? o.birimTumen * kg : 0;
      var mU = o ? o.birimUsd * kg : 0;
      maliyetT += mT; maliyetU += mU;
      return {
        partiId: kl.partiId,
        kod: o ? o.parti.kod : '?',
        satici: o ? o.parti.satici : '',
        kg: kg, birimTumen: o ? o.birimTumen : 0, usdTon: o ? o.usdTon : 0,
        maliyetTumen: mT, maliyetUsd: mU
      };
    });

    var satisUsd = S(s.satisUsdTon) * toplamKg / 1000;
    return {
